id: MAP-PCIDSS
title:
  en: SRAS Core to PCI DSS 4.0.1
  th: SRAS Core ไปยัง PCI DSS 4.0.1
description:
  en: Informative crosswalk from SRAS Core requirements to PCI DSS 4.0.1 requirements for environments that handle payment account data. It is not an equivalence, certification, or compliance claim.
  th: crosswalk เชิงข้อมูลจากข้อกำหนด SRAS Core ไปยังข้อกำหนด PCI DSS 4.0.1 สำหรับสภาพแวดล้อมที่จัดการข้อมูลบัญชีชำระเงิน ไม่ใช่การอ้างความเท่าเทียม การรับรอง หรือการปฏิบัติตาม
version: 0.1.0
source_standard: PCI DSS 4.0.1
source_url: https://www.pcisecuritystandards.org/document_library/
