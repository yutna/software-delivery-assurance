id: MAP-WCAG22
title:
  en: SRAS Core to WCAG 2.2 Level AA
  th: SRAS Core ไปยัง WCAG 2.2 Level AA
description:
  en: Informative crosswalk from SRAS Core requirements to WCAG 2.2 Level AA success criteria and conformance sections. Accessibility-specific requirements are planned for sector overlays in v0.4.0. This crosswalk is not an accessibility conformance claim.
  th: crosswalk เชิงข้อมูลจากข้อกำหนด SRAS Core ไปยัง success criteria และหมวด conformance ของ WCAG 2.2 Level AA ข้อกำหนดเฉพาะด้าน accessibility มีแผนอยู่ใน sector overlays ใน v0.4.0 crosswalk นี้ไม่ใช่การอ้างความสอดคล้องด้าน accessibility
version: 0.1.0
source_standard: WCAG 2.2 Level AA
source_url: https://www.w3.org/TR/WCAG22/
mappings:
  - requirement: SRAS-GOV-001
    external: 5.2 Conformance Requirements
    relationship: partial
    notes: Scope approval should name the accessibility target; the accessibility requirements themselves belong to overlays.
  - requirement: SRAS-GOV-008
    external: 5.3 Conformance Claims
    relationship: related
    notes: A conformance claim is a published claim and needs evidence; SRAS claim control is broader.
  - requirement: SRAS-CHG-004
    external: 5.2 Conformance Requirements
    relationship: related
    notes: Automated tests cannot confirm accessibility conformance; manual and assistive-technology testing are required.
  - requirement: SRAS-CHG-008
    external: 5.3 Conformance Claims
    relationship: related
    notes: Release evidence should state the accessibility target and known limitations.
  - requirement: SRAS-PRV-003
    external: 3.3.1 Error Identification, 3.3.3 Error Suggestion
    relationship: related
    notes: Request forms should identify and explain errors accessibly.
  - requirement: SRAS-PRV-006
    external: 3.1.1 Language of Page, 3.1.5 Reading Level
    relationship: related
    notes: A privacy notice should declare its language and be readable.
  - requirement: SRAS-OPS-010
    external: 4.1.3 Status Messages
    relationship: partial
    notes: Service status updates should be exposed as accessible status messages.
  - requirement: SRAS-INC-003
    external: 1.1.1 Non-text Content
    relationship: related
    notes: Incident communication should provide text alternatives for non-text content.
status: draft
review_status: unverified
translation_status: partial
machine_translated: true
