  - id: TH-LOG-010
    version: 0.4.0
    overlay: TH-LOG
    title:
      en: Lost, delayed, or misrouted shipments have a tested response
      th: สินค้าที่หาย ล่าช้า หรือส่งผิดเส้นทางมีแนวตอบสนองที่ทดสอบแล้ว
    description:
      en: Lost, delayed, and misrouted shipments have detection signals, an escalation owner, carrier coordination, customer communication, and a root-cause review. A simulation or tabletop within the last 12 months exercises the response.
      th: สินค้าที่หาย ล่าช้า และส่งผิดเส้นทางต้องมีสัญญาณตรวจจับ เจ้าของการส่งต่อ การประสานกับผู้ขนส่ง การสื่อสารกับลูกค้า และการทบทวนสาเหตุราก และต้องมีการจำลองหรือ tabletop ภายใน 12 เดือนที่ผ่านมา
    rationale:
      en: A shipment exception that is handled ad hoc produces inconsistent customer outcomes.
      th: ข้อยกเว้นการจัดส่งที่จัดการแบบเฉพาะหน้าให้ผลลัพธ์ต่อลูกค้าที่ไม่สม่ำเสมอ
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-LOG]
      excludes: []
    evidence:
      - type: document
        description: Exception response plan with owner and communication template
        max_age_days: 365
      - type: test_result
        description: Simulation or tabletop result for shipment exceptions
        max_age_days: 365
      - type: ticket
        description: Root-cause review record for a recent exception
        max_age_days: 180
    assessment:
      lite:
        pass: The response is documented and exercised in the last 12 months.
        partial: A plan exists but the exercise or root-cause review is missing.
      full:
        l2: The response is exercised with carriers and customer support.
        l3: Exception rates and resolution times are measured.
    references:
      - title: Consumer Protection Act B.E. 2522
        url: https://law.go.th/DetailLawPage?table_of_law_id=9263
        type: regulation
