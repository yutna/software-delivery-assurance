  - id: TH-LOG-011
    version: 0.4.0
    overlay: TH-LOG
    title:
      en: Proof-of-delivery records are tamper-evident and retained
      th: บันทึกหลักฐานการส่งมอบปลอมแปลงได้ยากและถูกเก็บรักษา
    description:
      en: Proof-of-delivery records include the recipient confirmation, time, location, and delivery actor. The record is tamper-evident, retained for the defined period, and retrievable for dispute handling within the service target.
      th: บันทึกหลักฐานการส่งมอบต้องมีการยืนยันจากผู้รับ เวลา สถานที่ และผู้ส่งมอบ บันทึกต้องปลอมแปลงได้ยาก เก็บรักษาตามระยะเวลาที่กำหนด และเรียกดูได้เพื่อจัดการข้อพิพาทภายในเป้าหมายการให้บริการ
    rationale:
      en: Proof of delivery is the evidence that ends most delivery disputes.
      th: หลักฐานการส่งมอบเป็นพยานหลักฐานที่ยุติข้อพิพาทการจัดส่งส่วนใหญ่
    criticality: gate
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-LOG]
      excludes: []
    evidence:
      - type: configuration
        description: Proof-of-delivery capture, integrity, and retention configuration
        max_age_days: 180
      - type: log
        description: Retrieval test result for a proof-of-delivery record
        max_age_days: 180
    assessment:
      lite:
        pass: Records are complete, tamper-evident, retained, and retrievable.
        partial: Records exist but integrity or retrieval has gaps.
      full:
        l2: Every delivery path captures and retains a valid record.
        l3: Retrieval timeliness and dispute outcomes are measured.
    references:
      - title: Electronic Transactions Act B.E. 2544
        url: https://law.go.th/DetailLawPage?table_of_law_id=8937
        type: regulation
      - title: Consumer Protection Act B.E. 2522
        url: https://law.go.th/DetailLawPage?table_of_law_id=9263
        type: regulation
    tags: [proof-of-delivery, integrity, retention]
