  - id: TH-FIN-009
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Regulatory notification readiness is tested for financial incidents
      th: ความพร้อมในการแจ้งหน่วยงานกำกับดูแลได้รับการทดสอบสำหรับเหตุการณ์การเงิน
    description:
      en: A notification matrix names the regulator, trigger, owner, and deadline for financial incidents. Templates and contact details are current, and a tabletop within the last 12 months exercises the path.
      th: ตารางการแจ้งระบุหน่วยงานกำกับดูแล เงื่อนไขการแจ้ง เจ้าของ และกำหนดเวลา สำหรับเหตุการณ์ทางการเงิน แม่แบบและข้อมูลติดต่อเป็นปัจจุบัน และต้องมีการฝึกซ้อมแบบ tabletop ภายใน 12 เดือนที่ผ่านมา
    rationale:
      en: A late or misdirected notification turns an incident into a regulatory breach.
      th: การแจ้งที่ล่าช้าหรือผิดช่องทางทำให้เหตุการณ์กลายเป็นการฝ่าฝืนข้อกำหนดของหน่วยงานกำกับดูแล
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: []
