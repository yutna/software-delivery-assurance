    updated_at: "2026-10-27"
  - id: TH-FIN-007
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Customer financial data is classified, minimised, and access-controlled
      th: ข้อมูลการเงินของลูกค้าถูกจำแนก ลดปริมาณ และควบคุมการเข้าถึง
    description:
      en: Customer financial data is classified, limited to fields with a documented need, encrypted in transit and at rest, and accessible only to approved roles. Retention and deletion follow policy.
      th: ข้อมูลการเงินของลูกค้าต้องได้รับการจำแนก จำกัดเฉพาะฟิลด์ที่มีความจำเป็นตามเอกสาร เข้ารหัสระหว่างส่งและขณะจัดเก็บ และเข้าถึงได้เฉพาะบทบาทที่ได้รับอนุมัติ การเก็บรักษาและการลบเป็นไปตามนโยบาย
    rationale:
      en: Financial data is a high-value target; minimisation and access control reduce the impact of a breach.
      th: ข้อมูลการเงินเป็นเป้าหมายที่มีมูลค่าสูง การลดปริมาณและการควบคุมการเข้าถึงช่วยลดผลกระทบจากการรั่วไหล
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-RGD]
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: document
        description: Data classification and minimisation record for customer financial data
        max_age_days: 365
      - type: configuration
        description: Encryption and role-based access configuration
        max_age_days: 180
    assessment:
      lite:
        pass: Data is classified, minimised, encrypted, and role-restricted.
        partial: Classification exists but some fields or stores are out of scope.
      full:
        l2: Controls cover every store and are verified in the current release.
        l3: Access and retention are measured and reviewed on a cadence.
    references:
      - title: Personal Data Protection Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=8668
        type: regulation
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
    tags: [customer-data, data-classification, access-control]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
