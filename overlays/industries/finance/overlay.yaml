id: TH-FIN
type: industry
jurisdiction: TH
industry: finance
title:
  en: Thailand finance overlay
  th: overlay ภาคการเงินประเทศไทย
description:
  en: Assurance deltas for banks, insurers, payment providers, fintech, and financial software vendors operating in Thailand.
  th: ส่วนเพิ่ม assurance สำหรับธนาคาร ประกันภัย ผู้ให้บริการชำระเงิน fintech และผู้ขายซอฟต์แวร์การเงินที่ดำเนินงานในประเทศไทย
version: 0.4.0
extends: ">=0.3.0 <1.0.0"
requires:
  - SRAS-AI
  - SRAS-INT
  - SRAS-RGD
  - SRAS-CLD
adds:
  - id: TH-FIN-001
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Critical financial services have a documented maximum tolerable downtime
      th: บริการการเงินที่สำคัญมี maximum tolerable downtime ที่จัดทำเอกสารไว้
    description:
      en: Every critical financial service has an approved maximum tolerable downtime, a recovery time objective, and a recovery point objective. A recovery exercise within the last 12 months demonstrates the objective.
      th: บริการการเงินที่สำคัญทุกรายการต้องมี maximum tolerable downtime, recovery time objective และ recovery point objective ที่อนุมัติแล้ว และต้องมีการฝึกซ้อมกู้คืนภายใน 12 เดือนที่ผ่านมาซึ่งแสดงให้เห็นว่าบรรลุวัตถุประสงค์
    rationale:
      en: Availability commitments cannot be assessed without a stated tolerance and a tested recovery path.
      th: ไม่สามารถประเมิน commitment ด้าน availability ได้หากไม่มี tolerance ที่ระบุไว้และเส้นทางการกู้คืนที่ผ่านการทดสอบ
    criticality: gate
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: document
        description: Approved maximum tolerable downtime, RTO, and RPO for each critical service
        max_age_days: 365
      - type: test_result
        description: Recovery exercise result against the stated objectives
        max_age_days: 365
    assessment:
      lite:
        pass: The tolerance and recovery objectives are documented and exercised.
        partial: The objectives are documented but the exercise is incomplete.
      full:
        l2: Documented, approved, and exercised for the current release.
        l3: Measured against production incidents and recovery results.
    references:
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
    tags: [availability, recovery, critical-service]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: draft
    created_at: "2026-10-27"
    updated_at: "2026-10-27"
  - id: TH-FIN-002
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: IT risk is owned by the board and reviewed at least annually
      th: ความเสี่ยงด้านไอทีมีเจ้าภาพระดับคณะกรรมการและทบทวนอย่างน้อยปีละครั้ง
    description:
      en: The board approves the IT risk appetite and receives an IT risk report at least annually. A named executive owns IT risk, and the risk register records IT risks with owners, ratings, and review dates.
      th: คณะกรรมการอนุมัติ risk appetite ด้านไอทีและรับรายงานความเสี่ยงด้านไอทีอย่างน้อยปีละครั้ง ผู้บริหารที่มีชื่อรับผิดชอบความเสี่ยงด้านไอที และ risk register บันทึกความเสี่ยงด้านไอทีพร้อมเจ้าของ ระดับความเสี่ยง และวันทบทวน
    rationale:
      en: IT risk is a board-level risk for a financial institution, not only an engineering concern.
      th: ความเสี่ยงด้านไอทีเป็นความเสี่ยงระดับคณะกรรมการของสถาบันการเงิน ไม่ใช่เพียงเรื่องของทีมวิศวกรรม
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: []
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: document
        description: Board-approved IT risk appetite and reporting pack
        max_age_days: 365
      - type: ticket
        description: Board or risk committee review record with actions
        max_age_days: 365
    assessment:
      lite:
        pass: IT risk appetite, owner, and annual review are recorded.
        partial: An owner exists but the board review is overdue.
      full:
        l2: The board reviews IT risk at least annually with tracked actions.
        l3: IT risk reporting is linked to the enterprise risk register and metrics.
    references:
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
    tags: [it-risk, board-oversight, risk-register]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: draft
    created_at: "2026-10-27"
    updated_at: "2026-10-27"
  - id: TH-FIN-003
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Critical outsourcing arrangements have an exit plan and tested transition
      th: ข้อตกลง outsourcing ที่สำคัญมีแผนออกและผ่านการทดสอบการโอนย้าย
    description:
      en: Every critical outsourcing or cloud arrangement has a documented exit plan covering data return, service transition, roles, and timing. A tabletop or live test within the last 12 months demonstrates the plan.
      th: ข้อตกลง outsourcing หรือ cloud ที่สำคัญทุกรายการต้องมีแผนออกที่จัดทำเป็นเอกสาร ครอบคลุมการส่งคืนข้อมูล การโอนย้ายบริการ บทบาท และกรอบเวลา และต้องมีการทดสอบแบบ tabletop หรือทดสอบจริงภายใน 12 เดือนที่ผ่านมา
    rationale:
      en: An exit that has never been exercised is a plan, not a capability.
      th: แผนออกที่ยังไม่เคยทดสอบเป็นเพียงเอกสาร ไม่ใช่ขีดความสามารถ
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: [SRAS-CLD]
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: document
        description: Exit plan with data return, transition, roles, and timing
        max_age_days: 365
      - type: test_result
        description: Tabletop or live transition test result
        max_age_days: 365
    assessment:
      lite:
        pass: The exit plan exists and was exercised in the last 12 months.
        partial: The plan exists but the test is overdue.
      full:
        l2: The plan is tested and updated after each material change.
        l3: Exit readiness is measured with recovery and transition metrics.
    references:
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
    tags: [outsourcing, third-party, exit-plan]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: draft
    created_at: "2026-10-27"
    updated_at: "2026-10-27"
  - id: TH-FIN-004
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Transaction records are integrity-protected and retained for the defined period
      th: บันทึกธุรกรรมได้รับการปกป้องความถูกต้องและเก็บตามระยะเวลาที่กำหนด
    description:
      en: Transaction and ledger records are protected against unauthorised change, retained for the period set by policy and applicable rules, and accessible only through logged, approved access.
      th: บันทึกธุรกรรมและบัญชีแยกประเภทได้รับการปกป้องจากการเปลี่ยนแปลงโดยไม่ได้รับอนุญาต เก็บรักษาตามระยะเวลาที่นโยบายและกฎเกณฑ์ที่ใช้บังคับกำหนด และเข้าถึงได้เฉพาะผ่านสิทธิ์ที่ได้รับอนุมัติและมีการบันทึก log
    rationale:
      en: Transaction integrity and retention are the basis for dispute handling, audit, and reconciliation.
      th: ความถูกต้องของธุรกรรมและการเก็บรักษาเป็นพื้นฐานของการจัดการข้อโต้แย้ง การตรวจสอบ และการกระทบยอด
    criticality: gate
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: configuration
        description: Immutability, retention, and access controls for transaction records
        max_age_days: 180
      - type: log
        description: Access log showing approved access to transaction records
        max_age_days: 90
      - type: document
        description: Retention schedule and reconciliation procedure
        max_age_days: 365
    assessment:
      lite:
        pass: Records are protected, retained, and access is logged.
        partial: Retention is defined but protection or logging has gaps.
      full:
        l2: Controls are implemented and tested for the current release.
        l3: Integrity and reconciliation are measured with continuous checks.
    references:
      - title: Payment Systems Act B.E. 2560
        url: https://law.go.th/DetailLawPage?table_of_law_id=9194
        type: regulation
      - title: Bank of Thailand payment IT risk notification No. สนช. 1/2564
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2564/ThaiPDF/25640024.pdf
        type: regulation
    tags: [transaction-integrity, audit-trail, retention]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: draft
    created_at: "2026-10-27"
    updated_at: "2026-10-27"
  - id: TH-FIN-005
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Fraud incidents have an escalation path and a customer communication plan
      th: เหตุการณ์ฉ้อโกงมีเส้นทางส่งต่อและแผนสื่อสารกับลูกค้า
    description:
      en: Fraud detection signals have a named owner and escalation path. A customer communication plan covers notification, support, and remediation, and is exercised within the last 12 months.
      th: สัญญาณการตรวจจับการฉ้อโกงมีเจ้าของและเส้นทางส่งต่อที่ระบุชื่อ แผนสื่อสารกับลูกค้าครอบคลุมการแจ้ง การสนับสนุน และการเยียวยา และต้องมีการฝึกซ้อมภายใน 12 เดือนที่ผ่านมา
    rationale:
      en: A fraud event that is detected but not escalated or communicated becomes a customer and regulatory problem.
      th: เหตุการณ์ฉ้อโกงที่ตรวจพบแต่ไม่ถูกส่งต่อหรือสื่อสารจะกลายเป็นปัญหาต่อลูกค้าและหน่วยงานกำกับดูแล
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: document
        description: Fraud escalation matrix and customer communication plan
        max_age_days: 365
      - type: test_result
        description: Fraud simulation or tabletop exercise result
        max_age_days: 365
    assessment:
      lite:
        pass: The escalation path and communication plan are documented and exercised.
        partial: The plan exists but the exercise or owner is missing.
      full:
        l2: The plan is current and exercised with support and communications teams.
        l3: Outcomes are measured against real fraud incidents and customer feedback.
    references:
      - title: Emergency Decree on Technology Crimes B.E. 2566
        url: https://law.go.th/DetailLawPage?table_of_law_id=12199
        type: regulation
      - title: Bank of Thailand payment IT risk notification No. สนช. 1/2564
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2564/ThaiPDF/25640024.pdf
        type: regulation
    tags: [fraud, incident-response, customer-communication]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: draft
    created_at: "2026-10-27"
    updated_at: "2026-10-27"
  - id: TH-FIN-006
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: High-privilege access to payment and ledger systems is separately approved
      th: สิทธิ์ระดับสูงต่อระบบชำระเงินและบัญชีแยกประเภทได้รับการอนุมัติแยกต่างหาก
    description:
      en: Privileged roles on payment and ledger systems require separate approval, multi-factor authentication, session logging, and a quarterly access review. Standing access is time-bound.
      th: บทบาทสิทธิ์ระดับสูงบนระบบชำระเงินและบัญชีแยกประเภทต้องได้รับการอนุมัติแยกต่างหาก ใช้ multi-factor authentication บันทึก session log และทบทวนสิทธิ์ทุกไตรมาส สิทธิ์แบบถาวรต้องมีกรอบเวลา
    rationale:
      en: A single unchecked privileged path can move money or alter records without attribution.
      th: เส้นทางสิทธิ์ระดับสูงเพียงเส้นเดียวที่ไม่ถูกตรวจสอบสามารถเคลื่อนย้ายเงินหรือแก้ไขบันทึกโดยระบุตัวตนไม่ได้
    criticality: gate
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: configuration
        description: Privileged role definition, MFA, and session logging configuration
        max_age_days: 180
      - type: log
        description: Privileged session log sample for payment and ledger systems
        max_age_days: 90
      - type: ticket
        description: Quarterly privileged access review record
        max_age_days: 120
    assessment:
      lite:
        pass: Privileged access is separately approved, MFA-protected, and logged.
        partial: Approval and MFA exist but review or logging has gaps.
      full:
        l2: Controls are implemented and reviewed every quarter.
        l3: Privileged activity is monitored with anomaly detection and metrics.
    references:
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
      - title: Payment Systems Act B.E. 2560
        url: https://law.go.th/DetailLawPage?table_of_law_id=9194
        type: regulation
    tags: [privileged-access, segregation-of-duties, payment]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: draft
