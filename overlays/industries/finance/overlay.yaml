  - id: TH-FIN-010
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Models used in credit, fraud, or pricing are validated and monitored
      th: โมเดลที่ใช้ในสินเชื่อ การฉ้อโกง หรือการตั้งราคาได้รับการตรวจสอบและติดตาม
    description:
      en: Models used in credit, fraud, or pricing are inventoried, validated independently of their developers, monitored against defined thresholds, and reviewed when performance drifts. Consequential decisions retain human oversight.
      th: โมเดลที่ใช้ในสินเชื่อ การฉ้อโกง หรือการตั้งราคาต้องมีทะเบียน ผ่านการตรวจสอบอย่างอิสระจากผู้พัฒนา ติดตามเทียบกับเกณฑ์ที่กำหนด และทบทวนเมื่อประสิทธิภาพคลาดเคลื่อน การตัดสินใจที่มีนัยสำคัญยังคงมีการกำกับโดยมนุษย์
    rationale:
      en: A model that is not validated or monitored can make consistent, invisible financial decisions.
      th: โมเดลที่ไม่ผ่านการตรวจสอบหรือติดตามสามารถตัดสินใจทางการเงินอย่างสม่ำเสมอโดยไม่มองเห็น
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: [SRAS-AI]
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: document
        description: Model inventory, validation report, and approval record
        max_age_days: 365
      - type: metric
        description: Model performance and drift metrics against thresholds
        max_age_days: 90
      - type: report
        description: Periodic model risk review with actions
        max_age_days: 365
    assessment:
      lite:
        pass: Models are inventoried, validated, and monitored.
        partial: Inventory exists but validation or monitoring has gaps.
      full:
        l2: Validation and monitoring cover every model in production.
        l3: Model risk is measured and reviewed with business outcomes.
    references:
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
