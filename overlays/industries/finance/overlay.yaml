  - id: TH-FIN-008
    version: 0.4.0
    overlay: TH-FIN
    title:
      en: Core financial system changes have a tested rollback and independent review
      th: การเปลี่ยนแปลงระบบการเงินหลักมี rollback ที่ทดสอบและรีวิวอย่างอิสระ
    description:
      en: Changes to core financial systems have a risk assessment, independent review, a tested rollback or roll-forward plan, and a change freeze rule for critical financial periods.
      th: การเปลี่ยนแปลงระบบการเงินหลักต้องมีการประเมินความเสี่ยง การรีวิวอย่างอิสระ แผน rollback หรือ roll-forward ที่ผ่านการทดสอบ และกฎ change freeze สำหรับช่วงเวลาการเงินที่สำคัญ
    rationale:
      en: A failed core change can stop payments or corrupt records faster than a recovery team can react.
      th: การเปลี่ยนแปลงระบบหลักที่ล้มเหลวสามารถหยุดการชำระเงินหรือทำให้บันทึกเสียหายได้เร็วกว่าที่ทีมกู้คืนจะตอบสนอง
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-FIN]
      excludes: []
    evidence:
      - type: ticket
        description: Change record with risk assessment and independent approval
        max_age_days: 180
      - type: test_result
        description: Rollback or roll-forward test result for the change
        max_age_days: 180
    assessment:
      lite:
        pass: Changes have independent review and a tested rollback path.
        partial: Review exists but rollback testing is missing for some changes.
      full:
        l2: Every core change follows the process with evidence retained.
        l3: Change failure and rollback rates are measured and reviewed.
    references:
      - title: Bank of Thailand IT risk notification No. สกช. 5/2566
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
        type: regulation
    tags: [change-management, rollback, independent-review]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
