  - id: TH-ECM-010
    version: 0.4.0
    overlay: TH-ECM
    title:
      en: Customer-facing flows meet the agreed accessibility target
      th: เส้นทางที่ลูกค้าใช้งานเป็นไปตามเป้าหมาย accessibility ที่ตกลง
    description:
      en: Critical customer journeys meet the agreed accessibility target for the named WCAG version. Automated and manual checks cover search, product, cart, checkout, payment, and account recovery, and findings are remediated on a tracked plan.
      th: เส้นทางลูกค้าที่สำคัญต้องเป็นไปตามเป้าหมาย accessibility ที่ตกลงสำหรับเวอร์ชัน WCAG ที่ระบุ การตรวจสอบอัตโนมัติและด้วยมนุษย์ครอบคลุมการค้นหา สินค้า ตะกร้า checkout การชำระเงิน และการกู้คืนบัญชี และข้อบกพร่องต้องได้รับการแก้ไขตามแผนที่ติดตามได้
    rationale:
      en: Accessibility declared only on a policy page does not reach the journeys where customers fail.
      th: accessibility ที่ประกาศเพียงหน้านโยบายไม่ครอบคลุมเส้นทางที่ลูกค้าใช้งานจริงไม่สำเร็จ
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: []
      overlays: [TH-ECM]
      excludes: []
    evidence:
      - type: test_result
        description: Automated and manual accessibility results for critical journeys
        max_age_days: 180
      - type: report
        description: Accessibility remediation plan with owners and dates
        max_age_days: 365
    assessment:
      lite:
        pass: Critical journeys meet the target and findings have a plan.
        partial: Some critical journeys are untested or defects are open.
      full:
        l2: Every critical journey is tested against the named WCAG version.
        l3: Accessibility regressions are prevented in the release pipeline.
    references:
      - title: WCAG 2.2
        url: https://www.w3.org/TR/WCAG22/
        type: standard
      - title: Consumer Protection Act B.E. 2522
        url: https://law.go.th/DetailLawPage?table_of_law_id=9263
        type: regulation
    tags: [accessibility, wcag, customer-journey]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
