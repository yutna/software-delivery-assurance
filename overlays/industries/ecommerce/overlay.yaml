    created_at: "2026-10-27"
    updated_at: "2026-10-27"
  - id: TH-ECM-012
    version: 0.4.0
    overlay: TH-ECM
    title:
      en: Account takeover and payment fraud have a tested response
      th: การยึดบัญชีและการฉ้อโกงการชำระเงินมีแนวตอบสนองที่ทดสอบแล้ว
    description:
      en: Account takeover and payment fraud have detection signals, an escalation owner, customer notification, and a regulatory reporting path. A simulation or tabletop within the last 12 months exercises the full response.
      th: การยึดบัญชีและการฉ้อโกงการชำระเงินต้องมีสัญญาณตรวจจับ เจ้าของการส่งต่อ การแจ้งลูกค้า และเส้นทางการรายงานต่อหน่วยงานกำกับดูแล และต้องมีการจำลองหรือ tabletop ภายใน 12 เดือนที่ผ่านมาซึ่งทดสอบการตอบสนองทั้งหมด
    rationale:
      en: Fraud response that is assembled during an incident is slower and less consistent.
      th: การตอบสนองต่อการฉ้อโกงที่ประกอบขึ้นระหว่างเหตุการณ์จะช้ากว่าและสม่ำเสมอน้อยกว่า
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: []
      overlays: [TH-ECM]
      excludes: []
    evidence:
      - type: document
        description: Fraud response plan, escalation matrix, and notification path
        max_age_days: 365
      - type: test_result
        description: Simulation or tabletop result for account takeover and payment fraud
        max_age_days: 365
    assessment:
      lite:
        pass: The response is documented and exercised in the last 12 months.
        partial: The plan exists but the exercise is overdue or incomplete.
      full:
        l2: The response is exercised with support, payments, and communications.
        l3: Detection and response outcomes are measured against real incidents.
    references:
      - title: Emergency Decree on Technology Crimes B.E. 2566
        url: https://law.go.th/DetailLawPage?table_of_law_id=12199
        type: regulation
      - title: Personal Data Protection Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=8668
        type: regulation
      - title: Bank of Thailand payment IT risk notification No. สนช. 1/2564
        url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2564/ThaiPDF/25640024.pdf
        type: regulation
    tags: [fraud, account-takeover, incident-response]
