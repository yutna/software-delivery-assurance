  - id: TH-ECM-011
    version: 0.4.0
    overlay: TH-ECM
    title:
      en: Order and dispute records are retained and retrievable
      th: บันทึกคำสั่งซื้อและข้อพิพาทถูกเก็บรักษาและเรียกดูได้
    description:
      en: Order, payment, refund, cancellation, and dispute records are retained for the period set by policy and applicable rules, protected against unauthorised change, and retrievable within the service target for a customer or authority request.
      th: บันทึกคำสั่งซื้อ การชำระเงิน การคืนเงิน การยกเลิก และข้อพิพาทต้องเก็บรักษาตามระยะเวลาที่นโยบายและกฎเกณฑ์ที่ใช้บังคับกำหนด ปกป้องจากการเปลี่ยนแปลงโดยไม่ได้รับอนุญาต และเรียกดูได้ภายในเป้าหมายการให้บริการสำหรับคำขอของลูกค้าหรือหน่วยงาน
    rationale:
      en: A dispute that cannot be reconstructed from records cannot be resolved fairly or consistently.
      th: ข้อพิพาทที่ไม่สามารถสร้างใหม่จากบันทึกได้ไม่สามารถแก้ไขอย่างเป็นธรรมหรือสม่ำเสมอ
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: []
      overlays: [TH-ECM]
      excludes: []
    evidence:
      - type: document
        description: Retention schedule and retrieval procedure for order and dispute records
        max_age_days: 365
      - type: configuration
        description: Retention, integrity, and access configuration for order records
        max_age_days: 180
      - type: log
        description: Retrieval test result within the service target
        max_age_days: 180
    assessment:
      lite:
        pass: Records are retained, integrity-protected, and retrievable.
        partial: Retention exists but retrieval or integrity has gaps.
      full:
        l2: Retention and retrieval are tested for every record type.
        l3: Retrieval timeliness is measured against the service target.
    references:
      - title: Electronic Transactions Act B.E. 2544
        url: https://law.go.th/DetailLawPage?table_of_law_id=8937
        type: regulation
      - title: Consumer Protection Act B.E. 2522
        url: https://law.go.th/DetailLawPage?table_of_law_id=9263
        type: regulation
    tags: [record-retention, dispute, audit-trail]
    status: active
    introduced_in: 0.4.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
