  - id: TH-PUB-012
    version: 0.4.0
    overlay: TH-PUB
    title:
      en: A privacy impact assessment is approved before public launch
      th: การประเมินผลกระทบด้านความเป็นส่วนตัวได้รับอนุมัติก่อนเปิดบริการ
    description:
      en: A privacy impact assessment for a public service that processes personal data is completed before launch, approved by the owning agency, and reviewed when the processing or data sharing changes. A public summary records the outcome and any conditions.
      th: การประเมินผลกระทบด้านความเป็นส่วนตัวสำหรับบริการสาธารณะที่ประมวลผลข้อมูลส่วนบุคคลต้องเสร็จก่อนเปิดบริการ ได้รับอนุมัติจากหน่วยงานเจ้าของ และทบทวนเมื่อการประมวลผลหรือการแบ่งปันข้อมูลเปลี่ยนแปลง สรุปสาธารณะต้องบันทึกผลและเงื่อนไข
    rationale:
      en: A public service that starts processing before the privacy assessment cannot show that the design was considered.
      th: บริการสาธารณะที่เริ่มประมวลผลก่อนการประเมินความเป็นส่วนตัวไม่สามารถแสดงได้ว่าการออกแบบได้รับการพิจารณา
    criticality: gate
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-RGD]
      overlays: [TH-PUB]
      excludes: []
    evidence:
      - type: document
        description: Approved privacy impact assessment with scope and conditions
        max_age_days: 365
      - type: document
        description: Public summary of the assessment outcome
        max_age_days: 365
    assessment:
      lite:
        pass: The assessment is approved before launch and its conditions are tracked.
        partial: The assessment exists but approval or the public summary is missing.
      full:
        l2: The assessment covers every personal-data flow and sharing partner.
        l3: Conditions are tested and the assessment is reviewed on change.
    references:
      - title: Personal Data Protection Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=8668
        type: regulation
      - title: Digital Government Administration and Services Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=9216
        type: regulation
    tags: [privacy-impact-assessment, public-service, approval]
    status: active
