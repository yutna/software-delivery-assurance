  - id: TH-PUB-010
    version: 0.4.0
    overlay: TH-PUB
    title:
      en: Cross-agency and vendor changes use a shared change record
      th: การเปลี่ยนแปลงข้ามหน่วยงานและผู้ขายใช้บันทึกการเปลี่ยนแปลงร่วมกัน
    description:
      en: Changes that affect another agency or a vendor use one shared change record with impact, approvals from each party, a rollback plan, and a communication path. A change freeze applies to critical public periods.
      th: การเปลี่ยนแปลงที่กระทบหน่วยงานอื่นหรือผู้ขายต้องใช้บันทึกการเปลี่ยนแปลงร่วมฉบับเดียว ซึ่งระบุผลกระทบ การอนุมัติจากแต่ละฝ่าย แผน rollback และเส้นทางสื่อสาร และมี change freeze สำหรับช่วงเวลาสาธารณะที่สำคัญ
    rationale:
      en: A change approved on one side of an agency boundary can break the other side without warning.
      th: การเปลี่ยนแปลงที่อนุมัติฝ่ายเดียวของขอบเขตหน่วยงานสามารถทำให้อีกฝ่ายเสียหายโดยไม่มีการแจ้งเตือน
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: [SRAS-INT]
      overlays: [TH-PUB]
      excludes: []
    evidence:
      - type: ticket
        description: Shared change record with multi-party approval and rollback
        max_age_days: 180
      - type: test_result
        description: Cross-agency integration test result for the change
        max_age_days: 180
    assessment:
      lite:
        pass: Cross-party changes use a shared record and rollback plan.
        partial: A record exists but one party or the rollback is missing.
      full:
        l2: Every cross-party change has joint approval and test evidence.
        l3: Change failure and coordination time are measured.
    references:
      - title: Digital Government Administration and Services Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=9216
        type: regulation
    tags: [change-management, cross-agency, coordination]
    status: active
    introduced_in: 0.4.0
