  - id: TH-PUB-011
    version: 0.4.0
    overlay: TH-PUB
    title:
      en: Citizen-facing incident communication has an approved template and owner
      th: การสื่อสารเหตุการณ์ต่อประชาชนมีแม่แบบและเจ้าของที่อนุมัติแล้ว
    description:
      en: Citizen-facing incident communication has an approved template, a named owner, Thai and English versions, and accessible channels. The path is exercised within the last 12 months and covers service status, impact, workaround, and next update.
      th: การสื่อสารเหตุการณ์ต่อประชาชนต้องมีแม่แบบที่อนุมัติแล้ว เจ้าของที่ระบุชื่อ ฉบับภาษาไทยและอังกฤษ และช่องทางที่เข้าถึงได้ ต้องมีการฝึกซ้อมภายใน 12 เดือนที่ผ่านมา และครอบคลุมสถานะบริการ ผลกระทบ แนวทางชั่วคราว และการอัปเดตครั้งถัดไป
    rationale:
      en: A service outage without citizen communication becomes a trust and accessibility failure.
      th: เหตุขัดข้องของบริการที่ไม่มีการสื่อสารต่อประชาชนจะกลายเป็นความล้มเหลวด้านความเชื่อมั่นและการเข้าถึง
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: []
      overlays: [TH-PUB]
      excludes: []
    evidence:
      - type: document
        description: Approved citizen communication template and owner record
        max_age_days: 365
      - type: test_result
        description: Communication exercise result within the last 12 months
        max_age_days: 365
    assessment:
      lite:
        pass: The template, owner, channels, and exercise are current.
        partial: A template exists but the owner or exercise is missing.
      full:
        l2: The path is exercised with service, communications, and accessibility teams.
        l3: Communication timeliness and citizen feedback are measured.
    references:
      - title: Digital Government Administration and Services Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=9216
        type: regulation
      - title: Cybersecurity Act B.E. 2562
        url: https://law.go.th/DetailLawPage?table_of_law_id=1594
        type: regulation
    tags: [citizen-communication, incident-response, accessibility]
    status: active
