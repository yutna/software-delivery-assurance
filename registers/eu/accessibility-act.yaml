notes:
  en: The Directive entered into force on 28 June 2019. Member States had to adopt the transposition measures by 28 June 2022 and apply them from 28 June 2025; the obligations in Article 4(8) may be applied at the latest from 28 June 2027. This entry does not decide whether the Directive applies to a particular product, service, or organisation, and it does not state that any organisation meets it.
  th: ไดเรกทีฟมีผลใช้บังคับเมื่อวันที่ 28 มิถุนายน 2562 รัฐสมาชิกต้องออกมาตรการแปลงเป็นกฎหมายภายในวันที่ 28 มิถุนายน 2565 และเริ่มใช้ตั้งแต่วันที่ 28 มิถุนายน 2568 โดยหน้าที่ตาม Article 4(8) อาจเริ่มใช้ได้ไม่เกินวันที่ 28 มิถุนายน 2570 รายการนี้ไม่วินิจฉัยว่าไดเรกทีฟใช้กับผลิตภัณฑ์ บริการ หรือองค์กรใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามไดเรกทีฟ
