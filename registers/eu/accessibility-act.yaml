id: EU-EAA-001
jurisdiction: EU
instrument: Directive (EU) 2019/882 (European Accessibility Act)
instrument_type: regulation
regulator: European Commission and national market surveillance authorities
source_url: https://eur-lex.europa.eu/eli/dir/2019/882/oj
effective_date: "2025-06-28"
revision: "2026-10-28.r1"
last_verified: "2026-10-28"
review_due: "2027-10-28"
status: in_force
summary:
  en: The Directive sets accessibility requirements for certain products and services in the European Union. It covers websites, mobile applications, e-commerce, banking services, e-books, transport services, and consumer terminals, and it sets requirements for accessibility information and conformity assessment.
  th: ไดเรกทีฟนี้กำหนดข้อกำหนดด้านการเข้าถึงสำหรับผลิตภัณฑ์และบริการบางประเภทในสหภาพยุโรป ครอบคลุมเว็บไซต์ แอปพลิเคชันมือถือ อีคอมเมิร์ซ บริการธนาคาร หนังสืออิเล็กทรอนิกส์ บริการขนส่ง และอุปกรณ์ปลายทางสำหรับผู้บริโภค และกำหนดข้อกำหนดด้านข้อมูลการเข้าถึงและการประเมินความสอดคล้อง
obligations:
  - en: An economic operator places on the market only products, or provides only services, that meet the accessibility requirements.
    th: ผู้ประกอบการทางเศรษฐกิจ (economic operator) วางตลาดผลิตภัณฑ์หรือให้บริการเฉพาะเมื่อเป็นไปตามข้อกำหนดด้านการเข้าถึง
  - en: A service provider provides accessibility information and explains how the service meets the requirements.
    th: ผู้ให้บริการจัดให้มีข้อมูลด้านการเข้าถึงและอธิบายว่าบริการเป็นไปตามข้อกำหนดอย่างไร
  - en: A manufacturer applies the accessibility requirements in design and development and performs the applicable conformity assessment.
    th: ผู้ผลิตนำข้อกำหนดด้านการเข้าถึงไปใช้ในการออกแบบและพัฒนา และดำเนินการประเมินความสอดคล้องที่ใช้บังคับ
  - en: An importer or distributor verifies that the product carries the required conformity documentation before placing it on the market.
    th: ผู้นำเข้าหรือผู้จัดจำหน่ายตรวจสอบว่าผลิตภัณฑ์มีเอกสารความสอดคล้องตามที่กำหนดก่อนวางตลาด
  - en: A service provider makes the service accessible, including its information, user interface, and support.
    th: ผู้ให้บริการทำให้บริการเข้าถึงได้ รวมถึงข้อมูล ส่วนติดต่อผู้ใช้ และการสนับสนุน
  - en: A service provider keeps the service accessible for the period it offers the service and monitors changes.
    th: ผู้ให้บริการรักษาระดับการเข้าถึงตลอดระยะเวลาที่ให้บริการและติดตามการเปลี่ยนแปลง
  - en: A Member State designates the authorities responsible for market surveillance and enforcement.
    th: รัฐสมาชิกแต่งตั้งหน่วยงานที่รับผิดชอบการกำกับดูแลตลาดและการบังคับใช้
mapped_requirements:
  - SRAS-CHG-004
