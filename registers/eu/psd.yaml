notes:
  en: The Directive entered into force on 12 January 2016 and Member States had to apply the transposition measures from 13 January 2018. The Commission published proposals for a replacement directive (PSD3) and a Payment Services Regulation in 2023; as of the last verification date the adopted replacement instruments had not been published in the Official Journal. This entry does not decide whether the Directive applies to a particular organisation or transaction, and it does not state that any organisation meets it.
  th: ไดเรกทีฟมีผลใช้บังคับเมื่อวันที่ 12 มกราคม 2559 และรัฐสมาชิกต้องเริ่มใช้มาตรการแปลงเป็นกฎหมายตั้งแต่วันที่ 13 มกราคม 2561 คณะกรรมาธิการเผยแพร่ข้อเสนอไดเรกทีฟฉบับแทนที่ (PSD3) และระเบียบบริการชำระเงินในปี 2566 ณ วันที่ตรวจสอบล่าสุด ตราสารฉบับแทนที่ที่รับรองแล้วยังไม่ได้เผยแพร่ใน Official Journal รายการนี้ไม่วินิจฉัยว่าไดเรกทีฟใช้กับองค์กรหรือธุรกรรมใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามไดเรกทีฟ
