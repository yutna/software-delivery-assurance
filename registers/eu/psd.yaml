id: EU-PSD-001
jurisdiction: EU
instrument: Directive (EU) 2015/2366 (Payment Services Directive 2)
instrument_type: regulation
regulator: European Banking Authority and national competent authorities
source_url: https://eur-lex.europa.eu/eli/dir/2015/2366/oj
effective_date: "2018-01-13"
revision: "2026-10-28.r1"
last_verified: "2026-10-28"
review_due: "2027-10-28"
status: in_force
summary:
  en: The Directive sets rules for payment services in the internal market. It covers the authorisation and supervision of payment institutions, transparency of fees and exchange rates, the rights and obligations of payment service providers and users, strong customer authentication, and access to payment accounts for third-party providers. It amends several directives and Regulation (EU) No 1093/2010 and repeals Directive 2007/64/EC.
  th: ไดเรกทีฟนี้กำหนดกฎสำหรับบริการชำระเงินในตลาดภายใน ครอบคลุมการอนุญาตและการกำกับดูแลสถาบันการชำระเงิน ความโปร่งใสของค่าธรรมเนียมและอัตราแลกเปลี่ยน สิทธิและหน้าที่ของผู้ให้บริการชำระเงินและผู้ใช้บริการ การยืนยันตัวตนลูกค้าที่เข้มงวด (strong customer authentication) และการเข้าถึงบัญชีชำระเงินสำหรับผู้ให้บริการบุคคลที่สาม แก้ไขไดเรกทีฟหลายฉบับและระเบียบ (EU) No 1093/2010 และยกเลิกไดเรกทีฟ 2007/64/EC
obligations:
  - en: A payment service provider is authorised and supervised by a competent authority.
    th: ผู้ให้บริการชำระเงินได้รับอนุญาตและอยู่ภายใต้การกำกับดูแลของหน่วยงานที่มีอำนาจ
  - en: A payment service provider applies strong customer authentication for electronic payment transactions under the conditions the Directive sets.
    th: ผู้ให้บริการชำระเงินใช้การยืนยันตัวตนลูกค้าที่เข้มงวดสำหรับธุรกรรมชำระเงินทางอิเล็กทรอนิกส์ภายใต้เงื่อนไขที่ไดเรกทีฟกำหนด
  - en: A payment service provider gives transparent information on fees, exchange rates, and the execution of payment transactions.
    th: ผู้ให้บริการชำระเงินให้ข้อมูลที่โปร่งใสเกี่ยวกับค่าธรรมเนียม อัตราแลกเปลี่ยน และการดำเนินการธุรกรรมชำระเงิน
  - en: A payment service provider executes payment transactions within the timeframes and under the liability rules the Directive sets.
    th: ผู้ให้บริการชำระเงินดำเนินการธุรกรรมชำระเงินภายในกรอบเวลาและภายใต้หลักความรับผิดที่ไดเรกทีฟกำหนด
  - en: A payment service provider gives account information service providers and payment initiation service providers access to payment accounts when the account holder consents.
    th: ผู้ให้บริการชำระเงินให้ผู้ให้บริการข้อมูลบัญชีและผู้ให้บริการริเริ่มการชำระเงินเข้าถึงบัญชีชำระเงินเมื่อเจ้าของบัญชีให้ความยินยอม
  - en: A payment service provider manages operational and security risks and reports major incidents to the competent authority.
    th: ผู้ให้บริการชำระเงินบริหารความเสี่ยงด้านการดำเนินงานและความปลอดภัย และรายงานเหตุการณ์สำคัญต่อหน่วยงานที่มีอำนาจ
  - en: A payment service provider keeps records of payment transactions and provides them to the payer and the payee.
    th: ผู้ให้บริการชำระเงินเก็บบันทึกธุรกรรมชำระเงินและให้ข้อมูลดังกล่าวแก่ผู้จ่ายและผู้รับเงิน
