notes:
  en: The Regulation entered into force on 11 January 2024 and applies from 12 September 2025. Article 3(1) applies to connected products placed on the market after 12 September 2026. Chapter IV applies to contracts concluded after 12 September 2025 and, in the cases the Regulation lists, to earlier contracts from 12 September 2027. This entry does not decide whether the Regulation applies to a particular product, service, or organisation, and it does not state that any organisation meets it.
  th: ระเบียบมีผลใช้บังคับเมื่อวันที่ 11 มกราคม 2567 และเริ่มใช้เมื่อวันที่ 12 กันยายน 2568 Article 3(1) ใช้กับผลิตภัณฑ์ที่เชื่อมต่อซึ่งวางตลาดหลังวันที่ 12 กันยายน 2569 Chapter IV ใช้กับสัญญาที่ทำหลังวันที่ 12 กันยายน 2568 และในกรณีที่ระเบียบระบุ ใช้กับสัญญาก่อนหน้าตั้งแต่วันที่ 12 กันยายน 2570 รายการนี้ไม่วินิจฉัยว่าระเบียบใช้กับผลิตภัณฑ์ บริการ หรือองค์กรใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามระเบียบ
