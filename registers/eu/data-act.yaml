id: EU-DATA-001
jurisdiction: EU
instrument: Regulation (EU) 2023/2854 (Data Act)
instrument_type: regulation
regulator: European Commission and national competent authorities
source_url: https://eur-lex.europa.eu/eli/reg/2023/2854/oj
effective_date: "2025-09-12"
revision: "2026-10-28.r1"
last_verified: "2026-10-28"
review_due: "2027-10-28"
status: in_force
summary:
  en: The Regulation sets harmonised rules on fair access to and use of data. It covers access to data generated by connected products and related services, sharing of data with third parties, switching between data processing services, safeguards for public-sector access to data, and interoperability. It amends Regulation (EU) 2017/2394 and Directive (EU) 2020/1828.
  th: ระเบียบนี้กำหนดกฎที่สอดประสานกันเกี่ยวกับการเข้าถึงและการใช้ข้อมูลอย่างเป็นธรรม ครอบคลุมการเข้าถึงข้อมูลที่เกิดจากผลิตภัณฑ์ที่เชื่อมต่อและบริการที่เกี่ยวข้อง การแบ่งปันข้อมูลกับบุคคลที่สาม การสลับผู้ให้บริการประมวลผลข้อมูล มาตรการป้องกันการเข้าถึงข้อมูลโดยภาครัฐ และการทำงานร่วมกัน แก้ไขระเบียบ (EU) 2017/2394 และไดเรกทีฟ (EU) 2020/1828
obligations:
  - en: A manufacturer of a connected product or a provider of a related service gives the user access to data generated by the product or service.
    th: ผู้ผลิตผลิตภัณฑ์ที่เชื่อมต่อหรือผู้ให้บริการที่เกี่ยวข้องให้ผู้ใช้เข้าถึงข้อมูลที่เกิดจากผลิตภัณฑ์หรือบริการ
  - en: A data holder shares data with a data recipient at the user's request under the conditions the Regulation sets.
    th: ผู้ถือข้อมูล (data holder) แบ่งปันข้อมูลกับผู้รับข้อมูล (data recipient) ตามคำขอของผู้ใช้ภายใต้เงื่อนไขที่ระเบียบกำหนด
  - en: A data holder does not use data obtained from a connected product to develop a competing product or service.
    th: ผู้ถือข้อมูลไม่ใช้ข้อมูลที่ได้จากผลิตภัณฑ์ที่เชื่อมต่อเพื่อพัฒนาผลิตภัณฑ์หรือบริการที่แข่งขันกัน
  - en: A provider of data processing services supports switching and portability, including the return of data and contractual exit terms.
    th: ผู้ให้บริการประมวลผลข้อมูลสนับสนุนการสลับและการโอนย้ายข้อมูล รวมถึงการคืนข้อมูลและเงื่อนไขการออกจากสัญญา
  - en: A provider of data processing services informs customers about switching charges and the conditions for leaving the service.
    th: ผู้ให้บริการประมวลผลข้อมูลแจ้งลูกค้าเกี่ยวกับค่าธรรมเนียมการสลับและเงื่อนไขการออกจากบริการ
  - en: A public-sector body requests data from a data holder only under the conditions and for the purposes the Regulation sets.
    th: หน่วยงานภาครัฐขอข้อมูลจากผู้ถือข้อมูลเฉพาะภายใต้เงื่อนไขและเพื่อวัตถุประสงค์ที่ระเบียบกำหนด
  - en: A provider of data processing services makes data and interfaces available in a documented, machine-readable format.
    th: ผู้ให้บริการประมวลผลข้อมูลจัดให้มีข้อมูลและส่วนเชื่อมต่อในรูปแบบที่จัดทำเอกสารและอ่านได้ด้วยเครื่อง
  - en: A party that receives data protects trade secrets and personal data under the conditions the Regulation sets.
    th: ผู้รับข้อมูลคุ้มครองความลับทางการค้าและข้อมูลส่วนบุคคลภายใต้เงื่อนไขที่ระเบียบกำหนด
