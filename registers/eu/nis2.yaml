notes:
  en: The Directive entered into force on 16 January 2023. Member States had to adopt the transposition measures by 17 October 2024 and apply them from 18 October 2024. This entry does not decide whether the Directive applies to a particular organisation, and it does not state that any organisation meets it.
  th: ไดเรกทีฟมีผลใช้บังคับเมื่อวันที่ 16 มกราคม 2566 รัฐสมาชิกต้องออกมาตรการแปลงเป็นกฎหมายภายในวันที่ 17 ตุลาคม 2567 และเริ่มใช้มาตรการเหล่านั้นตั้งแต่วันที่ 18 ตุลาคม 2567 รายการนี้ไม่วินิจฉัยว่าไดเรกทีฟใช้กับองค์กรใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามไดเรกทีฟ
