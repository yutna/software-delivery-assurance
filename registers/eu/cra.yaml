notes:
  en: The Regulation entered into force on 10 December 2024 and applies from 11 December 2027. Article 14 applies from 11 September 2026 and Chapter IV applies from 11 June 2026. This entry does not decide whether the Regulation applies to a particular product or organisation, and it does not state that any product meets it.
  th: ระเบียบมีผลใช้บังคับเมื่อวันที่ 10 ธันวาคม 2567 และเริ่มใช้เมื่อวันที่ 11 ธันวาคม 2570 โดย Article 14 มีผลตั้งแต่ 11 กันยายน 2569 และ Chapter IV มีผลตั้งแต่ 11 มิถุนายน 2569 รายการนี้ไม่วินิจฉัยว่าระเบียบใช้กับผลิตภัณฑ์หรือองค์กรใดโดยเฉพาะ และไม่ได้ระบุว่าผลิตภัณฑ์ใดปฏิบัติตามระเบียบ
