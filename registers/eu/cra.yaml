id: EU-CRA-001
jurisdiction: EU
instrument: Regulation (EU) 2024/2847 (Cyber Resilience Act)
instrument_type: regulation
regulator: European Commission, market surveillance authorities, and ENISA
source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
effective_date: "2027-12-11"
revision: "2026-10-28.r1"
last_verified: "2026-10-28"
review_due: "2027-10-28"
status: in_force
summary:
  en: The Regulation sets horizontal cybersecurity requirements for products with digital elements. It covers placing products on the market, vulnerability handling, due diligence, technical documentation, conformity assessment, market surveillance, and reporting of actively exploited vulnerabilities and severe incidents. It amends several product regulations and Regulation (EU) 2019/881.
  th: ระเบียบนี้กำหนดข้อกำหนดด้านความมั่นคงทางไซเบอร์ในแนวนอนสำหรับผลิตภัณฑ์ที่มีองค์ประกอบดิจิทัล ครอบคลุมการวางตลาดผลิตภัณฑ์ การจัดการช่องโหว่ การตรวจสอบสถานะตามหน้าที่ (due diligence) เอกสารทางเทคนิค การประเมินความสอดคล้อง การกำกับดูแลตลาด และการรายงานช่องโหว่ที่ถูกใช้ประโยชน์จริงและเหตุการณ์ร้ายแรง แก้ไขระเบียบผลิตภัณฑ์หลายฉบับและระเบียบ (EU) 2019/881
obligations:
  - en: A manufacturer places on the market only a product with digital elements that meets the essential cybersecurity requirements.
    th: ผู้ผลิตวางตลาดผลิตภัณฑ์ที่มีองค์ประกอบดิจิทัลเฉพาะเมื่อผลิตภัณฑ์เป็นไปตามข้อกำหนดความมั่นคงทางไซเบอร์ที่จำเป็น
  - en: A manufacturer assesses the risks, draws up the technical documentation, and carries out the applicable conformity assessment.
    th: ผู้ผลิตประเมินความเสี่ยง จัดทำเอกสารทางเทคนิค และดำเนินการประเมินความสอดคล้องที่ใช้บังคับ
  - en: A manufacturer handles vulnerabilities and reports actively exploited vulnerabilities and severe incidents to the relevant authority and ENISA within the timeframes the Regulation sets.
    th: ผู้ผลิตจัดการช่องโหว่และรายงานช่องโหว่ที่ถูกใช้ประโยชน์จริงและเหตุการณ์ร้ายแรงต่อหน่วยงานที่เกี่ยวข้องและ ENISA ภายในกรอบเวลาที่ระเบียบกำหนด
  - en: A manufacturer provides security updates for the support period and informs users when support ends.
    th: ผู้ผลิตจัดให้มีการอัปเดตความปลอดภัยตลอดระยะเวลาสนับสนุนและแจ้งผู้ใช้เมื่อสิ้นสุดการสนับสนุน
  - en: An importer or distributor verifies that the manufacturer has met the applicable obligations before placing the product on the market.
    th: ผู้นำเข้าหรือผู้จัดจำหน่ายตรวจสอบว่าผู้ผลิตปฏิบัติตามหน้าที่ที่ใช้บังคับก่อนวางผลิตภัณฑ์ในตลาด
  - en: A manufacturer identifies the components and vulnerabilities of the product in the technical documentation.
    th: ผู้ผลิตระบุองค์ประกอบและช่องโหว่ของผลิตภัณฑ์ในเอกสารทางเทคนิค
  - en: A manufacturer affixes the CE marking and issues the EU declaration of conformity.
    th: ผู้ผลิตติดเครื่องหมาย CE และออกประกาศความสอดคล้องของสหภาพยุโรป
