notes:
  en: The Regulation entered into force on 17 September 2014 and applies from 1 July 2016, with exceptions listed in Article 60. Regulation (EU) 2024/1183 amended it and entered into force on 20 May 2024. This entry does not decide whether the Regulation applies to a particular organisation or service, and it does not state that any organisation meets it.
  th: ระเบียบมีผลใช้บังคับเมื่อวันที่ 17 กันยายน 2557 และเริ่มใช้เมื่อวันที่ 1 กรกฎาคม 2559 โดยมีข้อยกเว้นตาม Article 60 ระเบียบ (EU) 2024/1183 แก้ไขเพิ่มเติมและมีผลใช้บังคับเมื่อวันที่ 20 พฤษภาคม 2567 รายการนี้ไม่วินิจฉัยว่าระเบียบใช้กับองค์กรหรือบริการใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามระเบียบ
