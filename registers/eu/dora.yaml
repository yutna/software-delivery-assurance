id: EU-DORA-001
jurisdiction: EU
instrument: Regulation (EU) 2022/2554 (Digital Operational Resilience Act)
instrument_type: regulation
regulator: European Supervisory Authorities (EBA, ESMA, EIOPA) and national competent authorities
source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
effective_date: "2025-01-17"
revision: "2026-10-28.r1"
last_verified: "2026-10-28"
review_due: "2027-10-28"
status: in_force
summary:
  en: The Regulation sets uniform requirements for the security of network and information systems that support the business processes of financial entities, and for the ICT third-party service providers that serve them. It covers ICT risk management, incident reporting, digital operational resilience testing, ICT third-party risk, and information sharing.
  th: ระเบียบนี้กำหนดข้อกำหนดเดียวกันสำหรับความมั่นคงปลอดภัยของระบบเครือข่ายและระบบสารสนเทศที่รองรับกระบวนการทางธุรกิจของสถาบันการเงิน (financial entity) และสำหรับผู้ให้บริการ ICT บุคคลที่สามที่ให้บริการแก่สถาบันเหล่านั้น ครอบคลุมการบริหารความเสี่ยงด้าน ICT การรายงานเหตุการณ์ การทดสอบ digital operational resilience ความเสี่ยงจาก ICT บุคคลที่สาม และการแบ่งปันข้อมูล
obligations:
  - en: A financial entity has an internal governance and control framework that covers ICT risk.
    th: สถาบันการเงินมีกรอบการกำกับดูแลและการควบคุมภายในที่ครอบคลุมความเสี่ยงด้าน ICT
  - en: A financial entity maintains an ICT risk-management framework and identifies, protects, detects, responds to, and recovers from ICT incidents.
    th: สถาบันการเงินมีกรอบการบริหารความเสี่ยงด้าน ICT และระบุ ป้องกัน ตรวจจับ ตอบสนอง และฟื้นฟูจากเหตุการณ์ด้าน ICT
  - en: A financial entity classifies and reports major ICT-related incidents to the competent authority within the timeframes the Regulation sets.
    th: สถาบันการเงินจัดประเภทและรายงานเหตุการณ์ด้าน ICT ที่สำคัญต่อหน่วยงานที่มีอำนาจภายในกรอบเวลาที่ระเบียบกำหนด
  - en: A financial entity performs digital operational resilience testing, including threat-led penetration testing when the Regulation requires it.
    th: สถาบันการเงินดำเนินการทดสอบ digital operational resilience รวมถึง threat-led penetration testing เมื่อระเบียบกำหนด
  - en: A financial entity manages ICT third-party risk through due diligence, contractual arrangements, and ongoing monitoring.
    th: สถาบันการเงินบริหารความเสี่ยงจาก ICT บุคคลที่สามผ่านการตรวจสอบสถานะตามหน้าที่ ข้อตกลงทางสัญญา และการติดตามอย่างต่อเนื่อง
  - en: A financial entity maintains a register of information on all contractual arrangements with ICT third-party service providers.
    th: สถาบันการเงินจัดทำทะเบียนข้อมูลของข้อตกลงทางสัญญาทั้งหมดกับผู้ให้บริการ ICT บุคคลที่สาม
  - en: A financial entity shares information on cyber threats within trusted communities under the conditions the Regulation sets.
    th: สถาบันการเงินแบ่งปันข้อมูลเกี่ยวกับภัยคุกคามทางไซเบอร์ภายในชุมชนที่เชื่อถือได้ภายใต้เงื่อนไขที่ระเบียบกำหนด
