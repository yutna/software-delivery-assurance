notes:
  en: The Regulation entered into force on 16 January 2023 and applies from 17 January 2025. This entry does not decide whether the Regulation applies to a particular organisation or ICT arrangement, and it does not state that any organisation meets it.
  th: ระเบียบมีผลใช้บังคับเมื่อวันที่ 16 มกราคม 2566 และเริ่มใช้เมื่อวันที่ 17 มกราคม 2568 รายการนี้ไม่วินิจฉัยว่าระเบียบใช้กับองค์กรหรือข้อตกลงด้าน ICT ใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามระเบียบ
