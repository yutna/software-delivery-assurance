status: in_force
summary:
  en: The Regulation sets rules for the processing of personal data and for the free movement of personal data in the European Union. It defines principles for processing, rights of data subjects, duties of controllers and processors, conditions for transfers outside the European Economic Area, and the role of supervisory authorities. It repealed Directive 95/46/EC.
  th: ระเบียบนี้กำหนดกฎเกณฑ์สำหรับการประมวลผลข้อมูลส่วนบุคคลและการเคลื่อนย้ายข้อมูลส่วนบุคคลโดยเสรีภายในสหภาพยุโรป กำหนดหลักการประมวลผล สิทธิของเจ้าของข้อมูล หน้าที่ของผู้ควบคุมและผู้ประมวลผลข้อมูล เงื่อนไขการโอนข้อมูลออกนอกเขตเศรษฐกิจยุโรป และบทบาทของหน่วยงานกำกับดูแล และยกเลิก Directive 95/46/EC
obligations:
  - en: A controller processes personal data only on a lawful basis and for specified, explicit, and legitimate purposes.
    th: ผู้ควบคุมข้อมูลประมวลผลข้อมูลส่วนบุคคลโดยอาศัยฐานทางกฎหมาย และเพื่อวัตถุประสงค์ที่ระบุชัดเจน ชัดแจ้ง และชอบด้วยกฎหมายเท่านั้น
  - en: A controller limits collection and retention to what the purpose requires.
    th: ผู้ควบคุมข้อมูลจำกัดการเก็บรวบรวมและการเก็บรักษาข้อมูลเท่าที่จำเป็นต่อวัตถุประสงค์
  - en: A controller provides information and handles requests for access, rectification, erasure, restriction, portability, and objection.
    th: ผู้ควบคุมข้อมูลให้ข้อมูลและดำเนินการตามคำขอเข้าถึง แก้ไข ลบ จำกัดการประมวลผล โอนย้ายข้อมูล และคัดค้าน
  - en: A controller and a processor implement appropriate technical and organisational security measures.
    th: ผู้ควบคุมและผู้ประมวลผลข้อมูลใช้มาตรการรักษาความปลอดภัยทางเทคนิคและเชิงองค์กรที่เหมาะสม
  - en: A controller keeps records of processing activities and assesses high-risk processing before it starts.
    th: ผู้ควบคุมข้อมูลจัดทำบันทึกกิจกรรมการประมวลผลและประเมินการประมวลผลที่มีความเสี่ยงสูงก่อนเริ่มดำเนินการ
  - en: A controller engages a processor only under a contract that sets the processing terms.
    th: ผู้ควบคุมข้อมูลว่าจ้างผู้ประมวลผลข้อมูลภายใต้สัญญาที่กำหนดเงื่อนไขการประมวลผล
  - en: A controller transfers personal data outside the European Economic Area only under a transfer mechanism the Regulation provides.
    th: ผู้ควบคุมข้อมูลโอนข้อมูลส่วนบุคคลออกนอกเขตเศรษฐกิจยุโรปภายใต้กลไกการโอนที่ระเบียบกำหนด
  - en: A controller notifies the supervisory authority of a personal data breach within the time the Regulation sets, and notifies affected data subjects when the threshold is met.
    th: ผู้ควบคุมข้อมูลแจ้งหน่วยงานกำกับดูแลเมื่อเกิดเหตุละเมิดข้อมูลส่วนบุคคลภายในกรอบเวลาที่ระเบียบกำหนด และแจ้งเจ้าของข้อมูลที่ได้รับผลกระทบเมื่อเข้าเงื่อนไข
  - en: A controller designates a data protection officer when the Regulation requires one.
    th: ผู้ควบคุมข้อมูลแต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลเมื่อระเบียบกำหนด
