notes:
  en: The Regulation entered into force on 24 May 2016 and applies from 25 May 2018. This entry does not decide whether the Regulation applies to a particular organisation or processing activity, and it does not state that any organisation meets it.
  th: ระเบียบมีผลใช้บังคับเมื่อวันที่ 24 พฤษภาคม 2559 และเริ่มใช้เมื่อวันที่ 25 พฤษภาคม 2561 รายการนี้ไม่วินิจฉัยว่าระเบียบใช้กับองค์กรหรือกิจกรรมการประมวลผลใดโดยเฉพาะ และไม่ได้ระบุว่าองค์กรใดปฏิบัติตามระเบียบ
