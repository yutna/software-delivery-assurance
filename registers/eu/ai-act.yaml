notes:
  en: The Regulation entered into force on 1 August 2024 and applies from 2 August 2026. Chapters I and II apply from 2 February 2025; Chapter III Section 4, Chapter V, Chapter VII, Chapter XII, and Article 78 apply from 2 August 2025, except Article 101; Article 6(1) applies from 2 August 2027. This entry does not decide whether the Regulation applies to a particular AI system or organisation, and it does not state that any system meets it.
  th: ระเบียบมีผลใช้บังคับเมื่อวันที่ 1 สิงหาคม 2567 และเริ่มใช้เมื่อวันที่ 2 สิงหาคม 2569 Chapter I และ II มีผลตั้งแต่ 2 กุมภาพันธ์ 2568 Chapter III Section 4, Chapter V, Chapter VII, Chapter XII และ Article 78 มีผลตั้งแต่ 2 สิงหาคม 2568 ยกเว้น Article 101 และ Article 6(1) มีผลตั้งแต่ 2 สิงหาคม 2570 รายการนี้ไม่วินิจฉัยว่าระเบียบใช้กับระบบ AI หรือองค์กรใดโดยเฉพาะ และไม่ได้ระบุว่าระบบใดปฏิบัติตามระเบียบ
