notes:
  en: This entry does not decide whether a specific service must be delivered digitally or which agency owns a dataset. Subordinate standards set detailed requirements.
  th: รายการนี้ไม่วินิจฉัยว่าบริการใดต้องให้ผ่านช่องทางดิจิทัลหรือหน่วยงานใดเป็นเจ้าของชุดข้อมูล มาตรฐานลำดับรองกำหนดข้อกำหนดโดยละเอียด
