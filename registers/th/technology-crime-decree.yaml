id: TH-TECH-001
jurisdiction: TH
instrument: Emergency Decree on Measures to Prevent and Suppress Technology Crimes B.E. 2566 (2023)
instrument_type: regulation
regulator: Ministry of Digital Economy and Society
source_url: https://law.go.th/DetailLawPage?table_of_law_id=12199
effective_date: "2023-03-16"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-04-27"
status: amended
summary:
  en: The emergency decree sets measures to prevent and suppress technology-related crime, including duties for financial institutions, telecommunications operators, and service providers to detect and respond to fraud and account misuse. It provides for information exchange, account control, and victim assistance. It was amended in 2025.
  th: พระราชกำหนดกำหนดมาตรการป้องกันและปราบปรามอาชญากรรมทางเทคโนโลยี รวมถึงหน้าที่ของสถาบันการเงิน ผู้ประกอบกิจการโทรคมนาคม และผู้ให้บริการ ในการตรวจจับและรับมือกับการฉ้อโกงและการใช้บัญชีโดยมิชอบ และกำหนดการแลกเปลี่ยนข้อมูล การควบคุมบัญชี และการช่วยเหลือผู้เสียหาย โดยมีการแก้ไขเพิ่มเติมในปี 2568
obligations:
  - en: Financial institutions and service providers apply the fraud prevention and detection measures set by the decree.
    th: สถาบันการเงินและผู้ให้บริการใช้มาตรการป้องกันและตรวจจับการฉ้อโกงที่พระราชกำหนดกำหนด
  - en: Suspicious accounts and transactions are reported and handled through the defined process.
    th: บัญชีและธุรกรรมที่น่าสงสัยได้รับการรายงานและจัดการผ่านกระบวนการที่กำหนด
  - en: Organisations keep records that support investigation and victim assistance.
    th: องค์กรเก็บรักษาบันทึกที่สนับสนุนการสอบสวนและการช่วยเหลือผู้เสียหาย
mapped_requirements:
  - SRAS-SEC-001
  - SRAS-SEC-005
  - SRAS-SEC-010
  - SRAS-INC-003
  - SRAS-INC-008
applies_to:
  sectors: [finance, ecommerce, logistics]
  roles: [financial-institution, telecom-operator, service-provider]
  data_types: [account-data, transaction-data, personal-data]
notes:
  en: This entry does not decide whether a specific transaction is fraudulent or which remedy applies. The 2025 amendment changed parts of the measure.
  th: รายการนี้ไม่วินิจฉัยว่าธุรกรรมใดเป็นการฉ้อโกงหรือการเยียวยาใดใช้บังคับ การแก้ไขเพิ่มเติมปี 2568 ได้เปลี่ยนแปลงบางส่วนของมาตรการ
source_language: th
translation_status: partial
machine_translated: true
