  data_types: [procurement-records, contract-records]
notes:
  en: This entry does not decide which procurement method applies or whether a bid is valid. Thresholds and detailed procedures are in subordinate regulations.
  th: รายการนี้ไม่วินิจฉัยว่าวิธีการจัดซื้อจัดจ้างใดใช้บังคับหรือข้อเสนอใดสมบูรณ์ วงเงินและขั้นตอนโดยละเอียดอยู่ในกฎระเบียบลำดับรอง
