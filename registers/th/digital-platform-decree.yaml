id: TH-DPS-001
jurisdiction: TH
instrument: Royal Decree on Digital Platform Service Businesses that Must Be Notified B.E. 2565 (2022)
instrument_type: regulation
regulator: Electronic Transactions Development Agency
source_url: https://www.etda.or.th/th/regulator/Digitalplatform/law.aspx
effective_date: "2023-08-21"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-04-27"
status: in_force
summary:
  en: The royal decree designates digital platform service businesses that must notify the Electronic Transactions Development Agency and sets duties for platform operators. It covers terms and conditions, information to users, complaint handling, and cooperation with authorities.
  th: พระราชกฤษฎีกากำหนดประเภทของธุรกิจบริการแพลตฟอร์มดิจิทัลที่ต้องแจ้งให้ทราบต่อสำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ และกำหนดหน้าที่ของผู้ประกอบธุรกิจแพลตฟอร์ม ครอบคลุมข้อกำหนดและเงื่อนไข การให้ข้อมูลแก่ผู้ใช้ การจัดการข้อร้องเรียน และการให้ความร่วมมือกับหน่วยงานที่เกี่ยวข้อง
obligations:
  - en: Platform operators in scope notify the agency before starting or continuing the service.
    th: ผู้ประกอบธุรกิจแพลตฟอร์มที่อยู่ในขอบเขตแจ้งต่อหน่วยงานก่อนเริ่มหรือดำเนินการให้บริการต่อ
  - en: Platform operators publish terms and conditions and give users clear information about the service.
    th: ผู้ประกอบธุรกิจแพลตฟอร์มเผยแพร่ข้อกำหนดและเงื่อนไข และให้ข้อมูลที่ชัดเจนเกี่ยวกับบริการแก่ผู้ใช้
  - en: Platform operators handle user complaints and illegal content through the defined process.
    th: ผู้ประกอบธุรกิจแพลตฟอร์มจัดการข้อร้องเรียนของผู้ใช้และเนื้อหาที่ผิดกฎหมายผ่านกระบวนการที่กำหนด
mapped_requirements:
  - SRAS-INT-001
  - SRAS-INT-002
  - SRAS-INT-004
  - SRAS-INT-009
  - SRAS-PRV-006
  - SRAS-INC-003
applies_to:
  sectors: [ecommerce]
  roles: [digital-platform-operator, business-user, consumer]
  data_types: [user-data, transaction-data, content-data]
notes:
  en: This entry does not decide whether a specific platform is in scope or which agency notification applies. The agency publishes the detailed categories and procedures.
  th: รายการนี้ไม่วินิจฉัยว่าแพลตฟอร์มใดอยู่ในขอบเขตหรือประกาศฉบับใดของหน่วยงานใช้บังคับ หน่วยงานเผยแพร่ประเภทและขั้นตอนโดยละเอียด
