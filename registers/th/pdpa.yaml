notes:
  en: This entry does not decide whether a processing activity has a lawful basis or which exemption applies. Key provisions took effect on 1 June 2022 under a separate postponement decree.
  th: รายการนี้ไม่วินิจฉัยว่ากิจกรรมการประมวลผลมีฐานทางกฎหมายหรือข้อยกเว้นใดใช้บังคับ และบทบัญญัติสำคัญมีผลใช้บังคับเมื่อวันที่ 1 มิถุนายน 2565 ตามพระราชกฤษฎีกาเลื่อนการบังคับใช้ฉบับแยกต่างหาก
