  - SRAS-OPS-006
applies_to:
  sectors: [finance, ecommerce]
  roles: [payment-system-provider, payment-service-provider]
  data_types: [payment-data, transaction-data, personal-data]
notes:
  en: This entry does not decide whether a specific provider is in scope or whether a control meets the notification. The source link is the Bank of Thailand transmittal package that contains the notification.
  th: รายการนี้ไม่วินิจฉัยว่าผู้ให้บริการใดอยู่ในขอบเขตหรือการควบคุมใดเป็นไปตามประกาศ ลิงก์แหล่งอ้างอิงคือชุดหนังสือนำส่งของธนาคารแห่งประเทศไทยซึ่งมีประกาศรวมอยู่
