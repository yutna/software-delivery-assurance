notes:
  en: This entry does not decide whether a specific institution is in scope or whether an arrangement meets the notification. The source link is the Bank of Thailand transmittal package, which contains the notification and the implementation guidelines.
  th: รายการนี้ไม่วินิจฉัยว่าสถาบันใดอยู่ในขอบเขตหรือข้อตกลงใดเป็นไปตามประกาศ ลิงก์แหล่งอ้างอิงคือชุดหนังสือนำส่งของธนาคารแห่งประเทศไทยซึ่งมีประกาศและแนวปฏิบัติรวมอยู่
