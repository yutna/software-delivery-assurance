id: TH-BOT-001
jurisdiction: TH
instrument: Bank of Thailand Notification No. สกช. 5/2566 on Information Technology Risk Management for Financial Institutions and Specialized Financial Institutions (2023)
instrument_type: regulation
regulator: Bank of Thailand
source_url: https://www.bot.or.th/content/dam/bot/fipcs/documents/FOG/2566/ThaiPDF/25660202.pdf
effective_date: null
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-04-27"
status: in_force
summary:
  en: The notification sets IT risk management requirements for financial institutions and specialized financial institutions. It covers IT governance, security controls, cyber resilience, third-party risk, incident response, and recovery. It replaced the 2019 IT risk notification.
  th: ประกาศฉบับนี้กำหนดหลักเกณฑ์การกำกับดูแลความเสี่ยงด้านเทคโนโลยีสารสนเทศสำหรับสถาบันการเงินและสถาบันการเงินเฉพาะกิจ ครอบคลุมการกำกับดูแลด้านไอที การควบคุมความมั่นคงปลอดภัย ความสามารถในการรับมือภัยไซเบอร์ ความเสี่ยงจากบุคคลภายนอก การรับมือเหตุการณ์ และการกู้คืนระบบ โดยยกเลิกประกาศฉบับปี 2562
obligations:
  - en: The board and management oversee IT risk within the institution's enterprise risk framework.
    th: คณะกรรมการและผู้บริหารกำกับดูแลความเสี่ยงด้านไอทีภายในกรอบการบริหารความเสี่ยงองค์กรของสถาบัน
  - en: The institution maintains IT security controls, cyber resilience, and tested recovery arrangements.
    th: สถาบันดูแลการควบคุมความมั่นคงปลอดภัยด้านไอที ความสามารถในการรับมือภัยไซเบอร์ และการกู้คืนระบบที่ผ่านการทดสอบ
  - en: Third-party and cloud arrangements are assessed and managed under the third-party risk requirements.
    th: ข้อตกลงกับบุคคลภายนอกและการใช้บริการคลาวด์ได้รับการประเมินและบริหารภายใต้ข้อกำหนดความเสี่ยงจากบุคคลภายนอก
  - en: The institution reports its IT risk self-assessment to the Bank of Thailand.
    th: สถาบันรายงานผลการประเมินตนเองด้านความเสี่ยงไอทีต่อธนาคารแห่งประเทศไทย
