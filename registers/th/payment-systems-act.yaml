id: TH-PAY-001
jurisdiction: TH
instrument: Payment Systems Act B.E. 2560 (2017)
instrument_type: law
regulator: Bank of Thailand
source_url: https://law.go.th/DetailLawPage?table_of_law_id=9194
effective_date: "2018-04-16"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-04-27"
status: in_force
summary:
  en: The Act establishes a unified framework for payment systems and payment services in Thailand. It covers the supervision of important and designated payment systems, the licensing or registration of payment service businesses, and the duties of operators.
  th: พระราชบัญญัติกำหนดกรอบการกำกับดูแลระบบการชำระเงินและบริการการชำระเงินในประเทศไทยอย่างเป็นเอกภาพ ครอบคลุมการกำกับระบบการชำระเงินที่มีความสำคัญและระบบการชำระเงินที่กำหนด การอนุญาตหรือการขึ้นทะเบียนธุรกิจบริการการชำระเงิน และหน้าที่ของผู้ประกอบธุรกิจ
obligations:
  - en: Operators obtain the permission or registration required for their service before operating.
    th: ผู้ประกอบธุรกิจได้รับอนุญาตหรือขึ้นทะเบียนตามที่กำหนดสำหรับบริการของตนก่อนเริ่มดำเนินการ
  - en: Operators follow the Bank of Thailand requirements for security, resilience, and consumer protection.
    th: ผู้ประกอบธุรกิจปฏิบัติตามข้อกำหนดของธนาคารแห่งประเทศไทยด้านความมั่นคงปลอดภัย ความสามารถในการให้บริการต่อเนื่อง และการคุ้มครองผู้บริโภค
  - en: Operators report material changes and incidents to the Bank of Thailand.
    th: ผู้ประกอบธุรกิจรายงานการเปลี่ยนแปลงที่มีนัยสำคัญและเหตุการณ์ต่อธนาคารแห่งประเทศไทย
mapped_requirements:
