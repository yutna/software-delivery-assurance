  data_types: [payment-data, transaction-data]
notes:
  en: This entry does not decide whether a specific service needs a licence or which supervisory notification applies. The Bank of Thailand issues detailed requirements.
  th: รายการนี้ไม่วินิจฉัยว่าบริการใดต้องได้รับอนุญาตหรือประกาศกำกับดูแลฉบับใดใช้บังคับ ธนาคารแห่งประเทศไทยออกข้อกำหนดโดยละเอียด
