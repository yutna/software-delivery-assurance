  data_types: [personal-data]
notes:
  en: The MCCs were endorsed by the 2nd ASEAN Digital Senior Officials' Meeting in January 2021. They are voluntary and do not create obligations without a contract that incorporates them. This entry does not decide whether the clauses are appropriate for a particular transfer.
  th: ข้อสัญญาต้นแบบอาเซียนได้รับการรับรองจากการประชุมเจ้าหน้าที่อาวุโสด้านดิจิทัลอาเซียนครั้งที่ 2 ในเดือนมกราคม 2564 เป็นเครื่องมือโดยสมัครใจและไม่สร้างหน้าที่หากไม่มีสัญญาที่นำไปใช้ รายการนี้ไม่วินิจฉัยว่าข้อสัญญาเหมาะสมกับการโอนใดโดยเฉพาะ
