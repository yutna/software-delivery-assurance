id: ASEAN-MCC-001
jurisdiction: ASEAN
instrument: ASEAN Model Contractual Clauses for Cross Border Data Flows (2021)
instrument_type: framework
regulator: ASEAN Digital Ministers Meeting (ADGMIN)
source_url: https://asean.org/wp-content/uploads/2021/08/ASEAN-Model-Contractual-Clauses-for-Cross-Border-Data-Flows.pdf
effective_date: "2021-01-22"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-10-27"
status: in_force
summary:
  en: The ASEAN Model Contractual Clauses are model contractual terms for transfers of personal data between ASEAN countries. They provide a controller-to-processor module and a controller-to-controller module, based on the principles of the ASEAN Framework on Personal Data Protection (2016). The clauses are a voluntary tool; they take effect only through a contract that incorporates them.
  th: ข้อสัญญาต้นแบบอาเซียนเป็นข้อสัญญาต้นแบบสำหรับการโอนข้อมูลส่วนบุคคลระหว่างประเทศในอาเซียน มีโมดูลผู้ควบคุมข้อมูลถึงผู้ประมวลผลข้อมูล และโมดูลผู้ควบคุมข้อมูลถึงผู้ควบคุมข้อมูล โดยอ้างอิงหลักการของกรอบการคุ้มครองข้อมูลส่วนบุคคลอาเซียน (2559) ข้อสัญญาเหล่านี้เป็นเครื่องมือโดยสมัครใจและมีผลเมื่อถูกนำไปใช้ในสัญญาเท่านั้น
obligations:
  - en: The parties incorporate the applicable module into a binding agreement and identify their roles as data exporter and data importer.
    th: คู่สัญญานำโมดูลที่ใช้บังคับไปใช้ในข้อตกลงที่มีผลผูกพัน และระบุบทบาทของตนเป็นผู้ส่งออกข้อมูลและผู้นำเข้าข้อมูล
  - en: The data importer processes transferred personal data only for the purposes and under the instructions set out in the agreement.
    th: ผู้นำเข้าข้อมูลประมวลผลข้อมูลส่วนบุคคลที่โอนมาเพื่อวัตถุประสงค์และตามคำสั่งที่กำหนดในข้อตกลงเท่านั้น
  - en: The data importer applies the security, accuracy, retention, and access standards the clauses set.
    th: ผู้นำเข้าข้อมูลใช้มาตรฐานด้านความปลอดภัย ความถูกต้อง การเก็บรักษา และการเข้าถึงตามที่ข้อสัญญากำหนด
  - en: The data importer notifies the data exporter of a personal data breach and assists with notifications to individuals and authorities.
    th: ผู้นำเข้าข้อมูลแจ้งเหตุละเมิดข้อมูลส่วนบุคคลต่อผู้ส่งออกข้อมูล และช่วยเหลือในการแจ้งต่อเจ้าของข้อมูลและหน่วยงาน
  - en: The data importer assists the data exporter in responding to requests from data subjects and regulators.
    th: ผู้นำเข้าข้อมูลช่วยเหลือผู้ส่งออกข้อมูลในการตอบสนองคำขอจากเจ้าของข้อมูลและหน่วยงานกำกับดูแล
  - en: The parties record the transfer, the module used, and the safeguards in the agreement.
    th: คู่สัญญาบันทึกการโอน โมดูลที่ใช้ และมาตรการคุ้มครองในข้อตกลง
  - en: The data importer returns or deletes personal data at the end of the arrangement, subject to the clauses.
    th: ผู้นำเข้าข้อมูลคืนหรือลบข้อมูลส่วนบุคคลเมื่อสิ้นสุดข้อตกลง ภายใต้เงื่อนไขของข้อสัญญา
  - en: The parties make the clauses available to regulators where the applicable law requires it.
    th: คู่สัญญาเปิดเผยข้อสัญญาต่อหน่วยงานกำกับดูแลเมื่อกฎหมายที่ใช้บังคับกำหนด
