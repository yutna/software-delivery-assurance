notes:
  en: The Act commenced on 2 January 2014 and the main data protection obligations took effect on 2 July 2014. The 2020 amendments took effect in phases from 1 February 2021. This entry does not decide whether the Act applies to a particular organisation or processing activity.
  th: พระราชบัญญัติเริ่มใช้บังคับเมื่อวันที่ 2 มกราคม 2557 และหน้าที่คุ้มครองข้อมูลหลักมีผลเมื่อวันที่ 2 กรกฎาคม 2557 การแก้ไขเพิ่มเติมปี 2563 มีผลเป็นระยะตั้งแต่ 1 กุมภาพันธ์ 2564 รายการนี้ไม่วินิจฉัยว่าพระราชบัญญัติใช้กับองค์กรหรือกิจกรรมการประมวลผลใดโดยเฉพาะ
