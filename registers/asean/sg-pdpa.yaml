id: SG-PDPA-001
jurisdiction: SG
instrument: Personal Data Protection Act 2012
instrument_type: law
regulator: Personal Data Protection Commission
source_url: https://sso.agc.gov.sg/Act/PDPA2012
effective_date: "2014-01-02"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-10-27"
status: in_force
summary:
  en: The Act sets baseline obligations for organisations that collect, use, or disclose personal data in Singapore. It covers consent and notification, purpose limitation, access and correction, accuracy, protection, retention, and transfer limitation, and it provides for the assessment and notification of data breaches. The 2020 amendments added a data portability obligation and strengthened the breach notification framework.
  th: พระราชบัญญัติกำหนดหน้าที่พื้นฐานสำหรับองค์กรที่เก็บ ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลในสิงคโปร์ ครอบคลุมการให้ความยินยอมและการแจ้งวัตถุประสงค์ การจำกัดวัตถุประสงค์ การเข้าถึงและการแก้ไขข้อมูล ความถูกต้อง การคุ้มครองข้อมูล การเก็บรักษาข้อมูล และการจำกัดการโอนข้อมูล และกำหนดให้ประเมินและแจ้งเหตุละเมิดข้อมูลส่วนบุคคล การแก้ไขเพิ่มเติมปี 2563 เพิ่มหน้าที่การโอนย้ายข้อมูลและเสริมกรอบการแจ้งเหตุละเมิด
obligations:
  - en: An organisation collects, uses, or discloses personal data only with consent or another basis the Act provides, and it notifies the individual of the purpose.
    th: องค์กรเก็บ ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลโดยได้รับความยินยอมหรืออาศัยฐานอื่นที่พระราชบัญญัติกำหนด และแจ้งวัตถุประสงค์ให้เจ้าของข้อมูลทราบ
  - en: Personal data is used only for purposes that a reasonable person would consider appropriate in the circumstances and for which the individual has been notified.
    th: ข้อมูลส่วนบุคคลถูกใช้เพื่อวัตถุประสงค์ที่บุคคลทั่วไปจะเห็นว่าเหมาะสมในสถานการณ์นั้น และเป็นวัตถุประสงค์ที่แจ้งให้เจ้าของข้อมูลทราบแล้ว
  - en: An organisation responds to access and correction requests through the process and timeframes the Act sets.
    th: องค์กรตอบสนองคำขอเข้าถึงและแก้ไขข้อมูลตามกระบวนการและกรอบเวลาที่พระราชบัญญัติกำหนด
  - en: An organisation makes reasonable security arrangements to protect personal data in its possession or control.
    th: องค์กรจัดให้มีมาตรการรักษาความปลอดภัยที่เหมาะสมเพื่อคุ้มครองข้อมูลส่วนบุคคลที่อยู่ในความครอบครองหรือการควบคุมของตน
  - en: An organisation stops retaining personal data when the purpose is no longer served and retention is no longer necessary for legal or business purposes.
    th: องค์กรหยุดเก็บรักษาข้อมูลส่วนบุคคลเมื่อไม่มีความจำเป็นตามวัตถุประสงค์และไม่มีความจำเป็นทางกฎหมายหรือทางธุรกิจอีกต่อไป
  - en: An organisation transfers personal data outside Singapore only under conditions the Act requires, including a comparable standard of protection.
    th: องค์กรโอนข้อมูลส่วนบุคคลออกนอกสิงคโปร์ภายใต้เงื่อนไขที่พระราชบัญญัติกำหนด รวมถึงมาตรฐานการคุ้มครองที่เทียบเคียงได้
  - en: An organisation assesses a data breach and notifies the Commission and affected individuals within the timeframes the Act sets.
    th: องค์กรประเมินเหตุละเมิดข้อมูลและแจ้งต่อคณะกรรมการและเจ้าของข้อมูลที่ได้รับผลกระทบภายในกรอบเวลาที่พระราชบัญญัติกำหนด
  - en: An organisation designates a data protection officer and makes the officer's contact information available.
    th: องค์กรแต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลและเผยแพร่ข้อมูลติดต่อของเจ้าหน้าที่
