notes:
  en: The Act took effect on 8 September 2012. Its Implementing Rules and Regulations elaborate the operative requirements and have been amended. This entry does not decide whether the Act applies to a particular processing activity.
  th: พระราชบัญญัติมีผลใช้บังคับเมื่อวันที่ 8 กันยายน 2555 กฎหมายลูกว่าด้วยการปฏิบัติตามพระราชบัญญัติขยายรายละเอียดข้อกำหนดที่ใช้บังคับและได้รับการแก้ไขเพิ่มเติม รายการนี้ไม่วินิจฉัยว่าพระราชบัญญัติใช้กับกิจกรรมการประมวลผลใดโดยเฉพาะ
