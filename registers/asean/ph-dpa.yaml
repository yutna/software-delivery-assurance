id: PH-DPA-001
jurisdiction: PH
instrument: Republic Act No. 10173 (Data Privacy Act of 2012)
instrument_type: law
regulator: National Privacy Commission
source_url: https://www.officialgazette.gov.ph/2012/08/15/republic-act-no-10173/
effective_date: "2012-09-08"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-10-27"
status: in_force
summary:
  en: The Act protects personal information in information and communications systems in the government and the private sector, and it creates the National Privacy Commission. It sets the principles of transparency, legitimate purpose, and proportionality, provides data subject rights, and requires security measures, breach notification, and accountability for personal data transferred to third parties or across borders.
  th: พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคลในระบบสารสนเทศและการสื่อสารทั้งภาครัฐและภาคเอกชน และจัดตั้งคณะกรรมการความเป็นส่วนตัวแห่งชาติ กำหนดหลักความโปร่งใส วัตถุประสงค์โดยชอบ และความได้สัดส่วน ให้สิทธิแก่เจ้าของข้อมูล และกำหนดมาตรการรักษาความปลอดภัย การแจ้งเหตุละเมิด และความรับผิดชอบสำหรับข้อมูลส่วนบุคคลที่โอนให้บุคคลที่สามหรือข้ามประเทศ
obligations:
  - en: A personal information controller processes personal data for a declared and legitimate purpose and collects only what is necessary for that purpose.
    th: ผู้ควบคุมข้อมูลส่วนบุคคลประมวลผลข้อมูลส่วนบุคคลเพื่อวัตถุประสงค์ที่ประกาศไว้และชอบด้วยกฎหมาย และเก็บเฉพาะข้อมูลที่จำเป็นต่อวัตถุประสงค์นั้น
  - en: Data subjects can exercise their rights through a process the controller operates.
    th: เจ้าของข้อมูลสามารถใช้สิทธิผ่านกระบวนการที่ผู้ควบคุมข้อมูลดำเนินการ
  - en: A personal information controller and processor implement organisational, physical, and technical security measures.
    th: ผู้ควบคุมและผู้ประมวลผลข้อมูลส่วนบุคคลใช้มาตรการรักษาความปลอดภัยทางองค์กร ทางกายภาพ และทางเทคนิค
  - en: A personal information controller notifies the Commission and affected data subjects of a personal data breach within the time the Act and its implementing rules set.
    th: ผู้ควบคุมข้อมูลส่วนบุคคลแจ้งเหตุละเมิดข้อมูลส่วนบุคคลต่อคณะกรรมการและเจ้าของข้อมูลที่ได้รับผลกระทบภายในเวลาที่พระราชบัญญัติและกฎหมายลูกกำหนด
  - en: A personal information controller appoints a data protection officer and registers data processing systems where the Act and its implementing rules require it.
    th: ผู้ควบคุมข้อมูลส่วนบุคคลแต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลและขึ้นทะเบียนระบบการประมวลผลข้อมูลเมื่อพระราชบัญญัติและกฎหมายลูกกำหนด
  - en: A personal information controller conducts a privacy impact assessment for processing that poses higher risk.
    th: ผู้ควบคุมข้อมูลส่วนบุคคลประเมินผลกระทบด้านความเป็นส่วนตัวสำหรับการประมวลผลที่มีความเสี่ยงสูงขึ้น
  - en: A transfer of personal data to a third party or another country remains subject to the controller's accountability.
    th: การโอนข้อมูลส่วนบุคคลให้บุคคลที่สามหรือไปยังประเทศอื่นยังคงอยู่ภายใต้ความรับผิดชอบของผู้ควบคุมข้อมูล
  - en: A personal information processor acts under a contract and the instructions of the controller.
    th: ผู้ประมวลผลข้อมูลส่วนบุคคลดำเนินการภายใต้สัญญาและคำสั่งของผู้ควบคุมข้อมูล
