id: MY-PDPA-001
jurisdiction: MY
instrument: Personal Data Protection Act 2010 (Act 709)
instrument_type: law
regulator: Personal Data Protection Commissioner
source_url: https://lom.agc.gov.my/act-detail.php?act=709&lang=BI
effective_date: "2013-11-15"
revision: "2026-10-27.r1"
last_verified: "2026-10-27"
review_due: "2027-10-27"
status: in_force
summary:
  en: The Act regulates the processing of personal data in commercial transactions in Malaysia. It sets principles for notice and choice, disclosure, security, retention, data integrity, and access, and it provides for the registration of data controllers and for conditions on cross-border transfers. The Personal Data Protection (Amendment) Act 2024 (Act A1727) amended the Act, including the terminology used for data controllers and provisions on data breach notification and data protection officers.
  th: พระราชบัญญัติควบคุมการประมวลผลข้อมูลส่วนบุคคลในธุรกรรมเชิงพาณิชย์ในมาเลเซีย กำหนดหลักการเกี่ยวกับการแจ้งและการเลือก การเปิดเผยข้อมูล ความปลอดภัย การเก็บรักษา ความถูกต้องของข้อมูล และการเข้าถึงข้อมูล และกำหนดให้มีการขึ้นทะเบียนผู้ควบคุมข้อมูล รวมถึงเงื่อนไขการโอนข้อมูลไปต่างประเทศ พระราชบัญญัติแก้ไขเพิ่มเติมการคุ้มครองข้อมูลส่วนบุคคลปี 2024 (Act A1727) แก้ไขพระราชบัญญัติ รวมถึงถ้อยคำที่ใช้สำหรับผู้ควบคุมข้อมูล และบทบัญญัติเกี่ยวกับการแจ้งเหตุละเมิดข้อมูลและเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล
obligations:
  - en: A data controller gives notice of the purposes for which personal data is collected and the choices available to the data subject.
    th: ผู้ควบคุมข้อมูลแจ้งวัตถุประสงค์ในการเก็บข้อมูลส่วนบุคคลและทางเลือกที่มีให้แก่เจ้าของข้อมูล
  - en: Personal data is disclosed only for the purpose notified and to parties the Act allows.
    th: ข้อมูลส่วนบุคคลถูกเปิดเผยเพื่อวัตถุประสงค์ที่แจ้งไว้และต่อบุคคลที่พระราชบัญญัติอนุญาตเท่านั้น
  - en: A data controller takes practical steps to protect personal data from loss, misuse, modification, or unauthorised access.
    th: ผู้ควบคุมข้อมูลดำเนินมาตรการที่ปฏิบัติได้จริงเพื่อคุ้มครองข้อมูลส่วนบุคคลจากการสูญหาย การใช้ผิดวัตถุประสงค์ การแก้ไข หรือการเข้าถึงโดยไม่ได้รับอนุญาต
  - en: Personal data is not retained longer than necessary for the purpose.
    th: ข้อมูลส่วนบุคคลไม่ถูกเก็บรักษานานเกินความจำเป็นตามวัตถุประสงค์
  - en: A data controller takes reasonable steps to keep personal data accurate.
    th: ผู้ควบคุมข้อมูลดำเนินมาตรการที่เหมาะสมเพื่อให้ข้อมูลส่วนบุคคลถูกต้อง
  - en: A data subject can access and correct personal data through the process the Act sets.
    th: เจ้าของข้อมูลสามารถเข้าถึงและแก้ไขข้อมูลส่วนบุคคลผ่านกระบวนการที่พระราชบัญญัติกำหนด
  - en: A cross-border transfer takes place only under the conditions the Act sets.
    th: การโอนข้อมูลไปต่างประเทศเกิดขึ้นภายใต้เงื่อนไขที่พระราชบัญญัติกำหนด
  - en: A data controller notifies the Commissioner of a personal data breach as the amended Act requires.
    th: ผู้ควบคุมข้อมูลแจ้งเหตุละเมิดข้อมูลส่วนบุคคลต่อผู้ตรวจการตามที่พระราชบัญญัติฉบับแก้ไขกำหนด
  - en: A data controller appoints a data protection officer where the amended Act requires one.
    th: ผู้ควบคุมข้อมูลแต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลเมื่อพระราชบัญญัติฉบับแก้ไขกำหนด
