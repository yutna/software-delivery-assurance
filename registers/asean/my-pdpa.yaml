notes:
  en: The Act came into operation on 15 November 2013 and was amended by the Personal Data Protection (Amendment) Act 2024 (Act A1727), whose provisions commenced in phases. This entry does not decide whether the Act applies to a particular processing activity or commercial transaction.
  th: พระราชบัญญัติเริ่มมีผลใช้บังคับเมื่อวันที่ 15 พฤศจิกายน 2556 และถูกแก้ไขเพิ่มเติมโดยพระราชบัญญัติแก้ไขเพิ่มเติมการคุ้มครองข้อมูลส่วนบุคคลปี 2024 (Act A1727) ซึ่งบทบัญญัติมีผลใช้บังคับเป็นระยะ รายการนี้ไม่วินิจฉัยว่าพระราชบัญญัติใช้กับกิจกรรมการประมวลผลหรือธุรกรรมเชิงพาณิชย์ใดโดยเฉพาะ
