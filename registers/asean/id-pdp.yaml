id: ID-PDP-001
jurisdiction: ID
instrument: Law No. 27 of 2022 on Personal Data Protection
instrument_type: law
regulator: Ministry of Communication and Digital Affairs
source_url: https://jdih.komdigi.go.id/produk_hukum/view/id/832/t/undangundang%20nomor%2027%20tahun%202022
effective_date: "2022-10-17"
