notes:
  en: The Law was enacted on 17 October 2022 with a two-year transition period that ended on 17 October 2024. Implementing regulations continue to be issued, and the Law provides for a Personal Data Protection Commission. This entry does not decide whether the Law applies to a particular controller or processing activity.
  th: กฎหมายประกาศใช้เมื่อวันที่ 17 ตุลาคม 2565 โดยมีระยะเปลี่ยนผ่านสองปีซึ่งสิ้นสุดเมื่อวันที่ 17 ตุลาคม 2567 และยังมีการออกกฎหมายลูกอย่างต่อเนื่อง กฎหมายกำหนดให้มีคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล รายการนี้ไม่วินิจฉัยว่ากฎหมายใช้กับผู้ควบคุมข้อมูลหรือกิจกรรมการประมวลผลใดโดยเฉพาะ
