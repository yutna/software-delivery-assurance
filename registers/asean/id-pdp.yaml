review_due: "2027-10-27"
status: in_force
summary:
  en: The Law establishes the framework for personal data protection in Indonesia. It defines categories of personal data, sets out data subject rights, and assigns duties to data controllers and data processors for lawful processing, consent, notice, security, breach handling, and cross-border transfers. It also provides for a data protection officer, impact assessments, and a supervisory commission.
  th: กฎหมายกำหนดกรอบการคุ้มครองข้อมูลส่วนบุคคลในอินโดนีเซีย นิยามประเภทของข้อมูลส่วนบุคคล กำหนดสิทธิของเจ้าของข้อมูล และกำหนดหน้าที่ให้ผู้ควบคุมข้อมูลและผู้ประมวลผลข้อมูลสำหรับการประมวลผลโดยชอบด้วยกฎหมาย ความยินยอม การแจ้งข้อมูล ความปลอดภัย การจัดการเหตุละเมิด และการโอนข้อมูลไปต่างประเทศ รวมถึงกำหนดเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล การประเมินผลกระทบ และคณะกรรมการกำกับดูแล
obligations:
  - en: A data controller collects personal data with a lawful basis and the consent the Law requires, and it provides the required notice.
    th: ผู้ควบคุมข้อมูลเก็บข้อมูลส่วนบุคคลโดยมีฐานทางกฎหมายและความยินยอมตามที่กฎหมายกำหนด และจัดให้มีการแจ้งข้อมูลตามที่กำหนด
  - en: Data subjects can exercise their rights through a process the data controller operates.
    th: เจ้าของข้อมูลสามารถใช้สิทธิผ่านกระบวนการที่ผู้ควบคุมข้อมูลดำเนินการ
  - en: A data controller and data processor protect personal data through technical and organisational measures.
    th: ผู้ควบคุมข้อมูลและผู้ประมวลผลข้อมูลคุ้มครองข้อมูลส่วนบุคคลด้วยมาตรการทางเทคนิคและทางองค์กร
  - en: A data controller and data processor keep records of processing activities and assess the impact of high-risk processing.
    th: ผู้ควบคุมข้อมูลและผู้ประมวลผลข้อมูลจัดเก็บบันทึกกิจกรรมการประมวลผลและประเมินผลกระทบของการประมวลผลที่มีความเสี่ยงสูง
  - en: A data controller notifies a personal data breach to the authorities and affected data subjects within the time the Law sets.
    th: ผู้ควบคุมข้อมูลแจ้งเหตุละเมิดข้อมูลส่วนบุคคลต่อหน่วยงานและเจ้าของข้อมูลที่ได้รับผลกระทบภายในเวลาที่กฎหมายกำหนด
  - en: A cross-border transfer takes place only under the conditions the Law sets.
    th: การโอนข้อมูลไปต่างประเทศเกิดขึ้นภายใต้เงื่อนไขที่กฎหมายกำหนด
  - en: A data controller appoints a data protection officer where the Law requires one.
    th: ผู้ควบคุมข้อมูลแต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลเมื่อกฎหมายกำหนด
  - en: A data processor processes personal data only under the instruction of the data controller and a binding agreement.
    th: ผู้ประมวลผลข้อมูลประมวลผลข้อมูลส่วนบุคคลตามคำสั่งของผู้ควบคุมข้อมูลและข้อตกลงที่มีผลผูกพันเท่านั้น
