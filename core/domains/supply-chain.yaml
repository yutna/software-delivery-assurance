- id: SRAS-SCM-005
  version: 0.2.0
  title:
    en: Licenses are identified, approved, and tracked for obligations
    th: license ถูกระบุ อนุมัติ และติดตามข้อผูกพัน
  description:
    en: Every third-party component must have a recorded license, an approval decision for its use, and a tracked obligation such as attribution or source disclosure. A component with an unapproved or unknown license fails the requirement.
    th: องค์ประกอบจากบุคคลภายนอกทุกรายการต้องมี license ที่บันทึกไว้ การตัดสินใจอนุมัติการใช้งาน และข้อผูกพันที่ติดตาม เช่น การระบุที่มา หรือการเปิดเผย source องค์ประกอบที่มี license ที่ไม่อนุมัติหรือไม่ทราบถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An unknown license can block distribution or create an unexpected obligation.
    th: license ที่ไม่ทราบสามารถขัดขวางการเผยแพร่หรือสร้างข้อผูกพันที่ไม่คาดคิด
  domain: supply-chain
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Component license inventory with approval decisions
      max_age_days: 180
    - type: report
      description: Attribution and obligation checklist for the current release
      max_age_days: 180
  assessment:
    lite:
      pass: Components have known, approved licenses and tracked obligations.
      partial: Some components lack a license record or approval.
    full:
      l2: Covered for all distributed components.
      l3: Measured with unknown-license findings and obligation completeness.
  references:
    - title: ISO/IEC 5230:2020
      url: https://www.iso.org/standard/81068.html
      type: standard
    - title: NIST SP 800-218 SSDF PW.4
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
  tags: [license-management, open-source, supply-chain]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-SCM-006
  version: 0.2.0
  title:
    en: End-of-life components are tracked and replaced on a plan
    th: องค์ประกอบที่หมดอายุการสนับสนุนถูกติดตามและแทนที่ตามแผน
  description:
    en: The product must track end-of-support dates for components and platforms, and must have a dated plan to replace or accept each end-of-life item. An end-of-life component in production without an approved plan fails the requirement.
    th: ผลิตภัณฑ์ต้องติดตามวันสิ้นสุดการสนับสนุนขององค์ประกอบและแพลตฟอร์ม และต้องมีแผนที่ระบุวันที่สำหรับการแทนที่หรือยอมรับแต่ละรายการที่หมดอายุ องค์ประกอบที่หมดอายุการสนับสนุนใน production โดยไม่มีแผนที่ได้รับอนุมัติถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An unsupported component receives no security fixes and becomes a permanent exception.
    th: องค์ประกอบที่ไม่ได้รับการสนับสนุนไม่ได้รับ security fixes และกลายเป็นข้อยกเว้นถาวร
  domain: supply-chain
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: End-of-life inventory with support dates and replacement plan
      max_age_days: 180
    - type: ticket
      description: Approval record for any accepted end-of-life risk
      max_age_days: 180
  assessment:
    lite:
      pass: End-of-life items have a dated replacement or acceptance decision.
      partial: Some end-of-life items are unsupported without a plan.
    full:
      l2: Tracked and planned for all in-scope components.
      l3: Measured with end-of-life count and replacement lead time.
  references:
    - title: ISO/IEC 27001:2022 5.9
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST CSF 2.0 GV.SC
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [end-of-life, lifecycle, supply-chain]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
