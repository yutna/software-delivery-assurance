  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-SCM-008
  version: 0.2.0
  title:
    en: Concentration risk and supplier exit are assessed
    th: ความเสี่ยงจากการพึ่งพาผู้ให้บริการรายเดียวและการออกจากผู้ให้บริการถูกประเมิน
  description:
    en: The product must identify critical suppliers where failure or exit would disrupt delivery, and must record a mitigation or exit plan for each. A single-supplier dependency with no exit plan fails the requirement.
    th: ผลิตภัณฑ์ต้องระบุผู้ให้บริการที่สำคัญซึ่งความล้มเหลวหรือการออกจากผู้ให้บริการจะกระทบการส่งมอบ และต้องบันทึกมาตรการบรรเทาหรือแผนออกสำหรับแต่ละราย การพึ่งพาผู้ให้บริการรายเดียวโดยไม่มีแผนออกถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A supplier that cannot be replaced quickly controls the product's continuity.
    th: ผู้ให้บริการที่ไม่สามารถแทนที่ได้อย่างรวดเร็วควบคุมความต่อเนื่องของผลิตภัณฑ์
  domain: supply-chain
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Concentration-risk assessment with mitigation and exit plans
      max_age_days: 365
    - type: ticket
      description: Review record for critical supplier dependencies
      max_age_days: 365
  assessment:
    lite:
      pass: Critical dependencies have a mitigation or exit plan.
      partial: Some critical dependencies are identified but not planned.
    full:
      l2: Assessed for all critical suppliers.
      l3: Measured with dependency count, portability, and exit-test evidence.
  references:
    - title: NIST SP 800-161 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/161/r1/final
      type: standard
    - title: NIST CSF 2.0 GV.SC
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [concentration-risk, exit-planning, supply-chain]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
