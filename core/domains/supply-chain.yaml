- id: SRAS-SCM-010
  version: 0.2.0
  title:
    en: Supply chain incidents are monitored and handled
    th: เหตุการณ์ในห่วงโซ่อุปทานถูกเฝ้าระวังและจัดการ
  description:
    en: The product must monitor advisories for critical components and suppliers, and must have a playbook to assess exposure, contain impact, and notify affected parties when a dependency is compromised. A compromised dependency with no exposure assessment fails the requirement.
    th: ผลิตภัณฑ์ต้องเฝ้าระวังประกาศเตือนสำหรับองค์ประกอบและผู้ให้บริการที่สำคัญ และต้องมี playbook สำหรับประเมินการได้รับผลกระทบ จำกัดผลกระทบ และแจ้งผู้ที่เกี่ยวข้องเมื่อ dependency ถูก compromise dependency ที่ถูก compromise โดยไม่มีการประเมินการได้รับผลกระทบถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A supplier compromise becomes the product's incident within hours.
    th: การถูก compromise ของผู้ให้บริการกลายเป็นเหตุการณ์ของผลิตภัณฑ์ภายในไม่กี่ชั่วโมง
  domain: supply-chain
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Supply chain monitoring sources and response playbook
      max_age_days: 365
    - type: ticket
      description: Exposure assessment record for the latest critical advisory
      max_age_days: 90
  assessment:
    lite:
      pass: Critical advisories are monitored and exposure is assessed.
      partial: Monitoring exists but some critical advisories or assessments are missing.
    full:
      l2: Applied to all critical components and suppliers.
      l3: Measured with advisory-to-assessment time and affected-release coverage.
  references:
