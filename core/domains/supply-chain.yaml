- id: SRAS-SCM-003
  version: 0.2.0
  title:
    en: Dependencies come from trusted sources and are integrity verified
    th: dependency มาจากแหล่งที่เชื่อถือได้และผ่านการตรวจสอบความสมบูรณ์
  description:
    en: Dependencies and build artifacts must be obtained from approved sources and verified with signatures or cryptographic digests before use. An unverified dependency or an artifact from an unapproved source fails the requirement.
    th: dependency และ build artifact ต้องได้มาจากแหล่งที่ได้รับอนุมัติและตรวจสอบด้วยลายเซ็นหรือ cryptographic digest ก่อนใช้งาน dependency ที่ไม่ได้ตรวจสอบหรือ artifact จากแหล่งที่ไม่อนุมัติถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An unverified dependency can introduce code that nobody reviewed.
    th: dependency ที่ไม่ได้ตรวจสอบสามารถนำ code ที่ไม่มีใคร review เข้ามาได้
  domain: supply-chain
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: Approved source and dependency verification configuration
      max_age_days: 180
    - type: report
      description: Signature or digest verification result for the current release
      max_age_days: 90
  assessment:
    lite:
      pass: Dependencies and artifacts are sourced from approved locations and verified.
      partial: Verification exists but some dependencies or artifacts bypass it.
    full:
      l2: Enforced for all production dependencies and artifacts.
      l3: Measured with verification coverage and exception trends.
  references:
    - title: NIST SP 800-218 SSDF PS.2
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: NIST CSF 2.0 GV.SC
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [provenance, dependency-management, supply-chain]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
