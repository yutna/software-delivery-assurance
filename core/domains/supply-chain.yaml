- id: SRAS-SCM-001
  version: 0.2.0
  title:
    en: An asset inventory covers software, services, and infrastructure
    th: asset inventory ครอบคลุมซอฟต์แวร์ บริการ และโครงสร้างพื้นฐาน
  description:
    en: The product must maintain an inventory of software components, services, infrastructure, and data stores with owner, version, location, and criticality. A production asset that is missing from the inventory fails the requirement.
    th: ผลิตภัณฑ์ต้องมี inventory ขององค์ประกอบซอฟต์แวร์ บริการ โครงสร้างพื้นฐาน และ data store พร้อม owner เวอร์ชัน ตำแหน่งที่ตั้ง และระดับความสำคัญ asset ใน production ที่ไม่อยู่ใน inventory ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An asset that is not known cannot be patched, reviewed, or retired.
    th: asset ที่ไม่รู้จักไม่สามารถถูก patch ทบทวน หรือปลดระวางได้
  domain: supply-chain
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Asset inventory with owner, version, location, and criticality
      max_age_days: 90
    - type: report
      description: Reconciliation of production assets against the inventory
      max_age_days: 90
  assessment:
    lite:
      pass: Every production asset is inventoried with an owner and criticality.
      partial: The inventory exists but some assets or owners are missing.
    full:
      l2: Maintained and reconciled for the current release.
      l3: Measured with coverage, stale entries, and unknown-asset findings.
  references:
    - title: NIST CSF 2.0 GV.SC
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 5.9
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [asset-inventory, supply-chain, visibility]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-SCM-002
  version: 0.2.0
  title:
    en: A software bill of materials is produced for every release
    th: software bill of materials ถูกจัดทำสำหรับทุกการปล่อย
  description:
    en: Each release must include a machine-readable SBOM that lists components, versions, relationships, and licenses, and the SBOM must match the deployed artifact. A release without an SBOM or with an SBOM that differs from the artifact fails the requirement.
    th: การปล่อยแต่ละครั้งต้องมี SBOM ที่เครื่องอ่านได้ ซึ่งระบุองค์ประกอบ เวอร์ชัน ความสัมพันธ์ และ license และ SBOM ต้องตรงกับ artifact ที่ deploy การปล่อยที่ไม่มี SBOM หรือมี SBOM ที่แตกต่างจาก artifact ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Without an SBOM, component risk cannot be found or answered quickly.
    th: หากไม่มี SBOM ความเสี่ยงขององค์ประกอบไม่สามารถถูกค้นหาหรือตอบได้อย่างรวดเร็ว
  domain: supply-chain
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: report
      description: SBOM for the current release in a standard format
      max_age_days: 90
    - type: test_result
      description: Verification that the SBOM matches the deployed artifact
      max_age_days: 90
  assessment:
    lite:
      pass: Each release has an SBOM that matches the deployed artifact.
      partial: An SBOM exists but is incomplete or not verified against the artifact.
    full:
      l2: Produced for every release and retained.
      l3: Measured with SBOM completeness and match rates.
  references:
    - title: NIST SP 800-218 SSDF PS.3
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: ISO/IEC 5962:2021 SPDX
      url: https://www.iso.org/standard/81870.html
      type: standard
  tags: [sbom, supply-chain, transparency]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
