- id: SRAS-SCM-009
  version: 0.2.0
  title:
    en: Supplier agreements include security, privacy, and exit terms
    th: สัญญาผู้ให้บริการรวมข้อกำหนดด้านความปลอดภัย ความเป็นส่วนตัว และการออก
  description:
    en: Each critical supplier agreement must include security requirements, breach notification, data return or deletion, audit or assurance rights, and termination support. An agreement missing a required term fails the requirement.
    th: สัญญาผู้ให้บริการที่สำคัญแต่ละฉบับต้องรวมข้อกำหนดด้านความปลอดภัย การแจ้งเหตุละเมิด การคืนหรือลบข้อมูล สิทธิในการตรวจสอบหรือรับการรับรอง และการสนับสนุนเมื่อสิ้นสุดสัญญา สัญญาที่ขาดข้อกำหนดที่จำเป็นถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A control that is not in the agreement is difficult to enforce after an incident.
    th: การควบคุมที่ไม่อยู่ในสัญญาเป็นเรื่องยากที่จะบังคับใช้หลังเกิดเหตุการณ์
  domain: supply-chain
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: contract
      description: Current supplier agreement with security, privacy, and exit terms
      max_age_days: 365
    - type: document
      description: Contract review checklist and exceptions
      max_age_days: 365
  assessment:
    lite:
      pass: Critical supplier agreements include the required security and exit terms.
      partial: Some agreements are missing a required term or review.
    full:
      l2: Covered for all critical suppliers.
      l3: Measured with clause coverage and renewal review timeliness.
  references:
    - title: ISO/IEC 27001:2022 5.20
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST SP 800-161 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/161/r1/final
      type: standard
  tags: [supplier-contracts, third-party-risk, supply-chain]
  status: active
  introduced_in: 0.2.0
