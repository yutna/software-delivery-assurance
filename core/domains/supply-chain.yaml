  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-SCM-004
  version: 0.2.0
  title:
    en: Third parties are risk-assessed before use and reviewed on a cadence
    th: บุคคลภายนอกถูกประเมินความเสี่ยงก่อนใช้งานและทบทวนตามรอบ
  description:
    en: Each supplier that handles data, provides a critical service, or affects the product must have a documented risk assessment before use and a review at a defined cadence. A critical supplier with no current assessment fails the requirement.
    th: ผู้ให้บริการแต่ละรายที่จัดการข้อมูล ให้บริการที่สำคัญ หรือส่งผลต่อผลิตภัณฑ์ ต้องมีการประเมินความเสี่ยงที่จัดทำเอกสารก่อนใช้งานและการทบทวนตามรอบที่กำหนด ผู้ให้บริการที่สำคัญซึ่งไม่มีการประเมินที่เป็นปัจจุบันถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Supplier risk becomes product risk when the supplier fails or changes.
    th: ความเสี่ยงของผู้ให้บริการกลายเป็นความเสี่ยงของผลิตภัณฑ์เมื่อผู้ให้บริการล้มเหลวหรือเปลี่ยนแปลง
  domain: supply-chain
  criticality: gate
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Supplier register with risk rating, owner, and review date
      max_age_days: 180
    - type: report
      description: Current assessment for each critical supplier
      max_age_days: 365
  assessment:
    lite:
      pass: Critical suppliers have a current assessment and owner.
      partial: Assessments exist but some critical suppliers or reviews are missing.
    full:
      l2: Applied to all critical suppliers for the current release.
      l3: Measured with assessment coverage and risk trend.
  references:
    - title: ISO/IEC 27001:2022 5.19 and 5.22
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST SP 800-161 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/161/r1/final
      type: standard
  tags: [third-party-risk, supplier-management, supply-chain]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
