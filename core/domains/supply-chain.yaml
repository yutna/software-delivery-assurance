- id: SRAS-SCM-007
  version: 0.2.0
  title:
    en: Subcontractor and subprocessor chains are visible and controlled
    th: ห่วงโซ่ผู้รับจ้างช่วงและผู้ประมวลผลช่วงมีความโปร่งใสและถูกควบคุม
  description:
    en: Each critical supplier must disclose the subcontractors and subprocessors that support the product, and those parties must meet the same security and privacy requirements. An undisclosed critical subcontractor fails the requirement.
    th: ผู้ให้บริการที่สำคัญแต่ละรายต้องเปิดเผยผู้รับจ้างช่วงและผู้ประมวลผลช่วงที่สนับสนุนผลิตภัณฑ์ และคู่สัญญาเหล่านั้นต้องเป็นไปตามข้อกำหนดด้านความปลอดภัยและความเป็นส่วนตัวเดียวกัน ผู้รับจ้างช่วงที่สำคัญซึ่งไม่ถูกเปิดเผยถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Risk does not stop at the first supplier.
    th: ความเสี่ยงไม่ได้หยุดอยู่ที่ผู้ให้บริการรายแรก
  domain: supply-chain
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Subcontractor and subprocessor register with roles and flow-down terms
      max_age_days: 180
    - type: contract
      description: Flow-down security and privacy terms
      max_age_days: 365
  assessment:
    lite:
      pass: Critical supply chains are disclosed and flow-down terms are in place.
      partial: Some subcontractors are undisclosed or lack flow-down terms.
    full:
      l2: Covered for all critical suppliers.
      l3: Reviewed after supplier change and measured with disclosure completeness.
  references:
    - title: ISO/IEC 27001:2022 5.21
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST SP 800-161 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/161/r1/final
      type: standard
  tags: [subcontractors, supply-chain, third-party-risk]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
