  updated_at: "2026-10-27"
- id: SRAS-CHG-004
  version: 0.2.0
  title:
    en: Critical user journeys have repeatable automated test coverage
    th: critical user journeys มีชุดทดสอบอัตโนมัติที่ทำซ้ำได้
  description:
    en: Critical user journeys must have automated or repeatable regression tests tied to acceptance criteria, and the release must record the latest result. A critical journey with no repeatable test or an unreviewed failure fails the requirement.
    th: critical user journeys ต้องมีชุดทดสอบ regression แบบอัตโนมัติหรือทำซ้ำได้ซึ่งเชื่อมโยงกับเกณฑ์การยอมรับ และการปล่อยต้องบันทึกผลล่าสุด critical journey ที่ไม่มีชุดทดสอบที่ทำซ้ำได้หรือมีผลล้มเหลวที่ไม่ได้รับการทบทวนถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Manual checks at release time cannot prove that a journey still works after change.
    th: การตรวจสอบด้วยมือตอนปล่อยไม่สามารถพิสูจน์ว่า journey ยังทำงานได้หลังการเปลี่ยนแปลง
  domain: change-release
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Test strategy and journey-to-test traceability matrix
      max_age_days: 365
    - type: test_result
      description: Latest regression result for critical journeys
      max_age_days: 30
  assessment:
    lite:
      pass: Critical journeys have repeatable tests and the latest result is recorded.
      partial: Some critical journeys have no repeatable test or no current result.
    full:
      l2: Automated where practical and executed for every release.
      l3: Measured with journey coverage, flake rate, and escaped-defect trends.
  references:
    - title: ISO/IEC 27001:2022 8.29
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST SP 800-218 SSDF PW.8
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
  tags: [testing, regression, release]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
