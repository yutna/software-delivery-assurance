- id: SRAS-CHG-010
  version: 0.2.0
  title:
    en: Database changes are reversible or have a tested recovery plan
    th: การเปลี่ยนแปลงฐานข้อมูลสามารถย้อนกลับได้หรือมีแผนกู้คืนที่ผ่านการทดสอบ
  description:
    en: Schema and data migrations must be reviewed, tested against representative data, and have a reversible step or a tested recovery plan before production deployment. A migration without a tested recovery path fails the requirement.
    th: การเปลี่ยนแปลง schema และข้อมูลต้องได้รับการ review ทดสอบกับข้อมูลตัวแทน และมีขั้นตอนย้อนกลับหรือแผนกู้คืนที่ผ่านการทดสอบก่อน deploy สู่ production การ migration ที่ไม่มีแนวทางกู้คืนที่ทดสอบแล้วถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A failed migration can corrupt data in ways that application rollback cannot fix.
    th: migration ที่ล้มเหลวสามารถทำให้ข้อมูลเสียหายในลักษณะที่การ rollback application แก้ไขไม่ได้
  domain: change-release
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Migration plan with reversibility or recovery steps
      max_age_days: 180
    - type: test_result
      description: Dry-run or recovery test result against representative data
      max_age_days: 180
  assessment:
    lite:
      pass: Migrations have a tested recovery path before production deployment.
      partial: Some migrations are reversible but recovery is untested or undocumented.
    full:
      l2: Applied to all production migrations.
      l3: Measured with migration failure and recovery-time trends.
