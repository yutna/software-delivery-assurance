- id: SRAS-CHG-003
  version: 0.2.0
  title:
    en: A continuous integration pipeline builds, tests, and scans every change
    th: pipeline แบบ continuous integration build ทดสอบ และสแกนทุกการเปลี่ยนแปลง
  description:
    en: Every change must run through an automated pipeline that builds the artifact, runs the test suite, and performs security and dependency scans, and a failing required job must block merge. A pipeline that can be bypassed without an approved exception fails the requirement.
    th: ทุกการเปลี่ยนแปลงต้องผ่าน pipeline อัตโนมัติที่ build artifact รันชุดทดสอบ และสแกนความปลอดภัยและ dependency โดย job ที่กำหนดซึ่งล้มเหลวต้องบล็อกการ merge pipeline ที่สามารถข้ามได้โดยไม่มีข้อยกเว้นที่ได้รับอนุมัติถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A repeatable pipeline finds failures before release, not after deployment.
    th: pipeline ที่ทำซ้ำได้พบความล้มเหลวก่อนการปล่อย ไม่ใช่หลังการ deploy
  domain: change-release
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: CI pipeline definition and required-job configuration
      max_age_days: 180
    - type: test_result
      description: Most recent pipeline result for the current release
      max_age_days: 30
    - type: ticket
      description: Approved bypass exception, if any
      max_age_days: 90
  assessment:
    lite:
      pass: Required pipeline jobs run on every change and failures block merge.
      partial: The pipeline exists but some required jobs or blocking rules are missing.
    full:
      l2: Enforced for all production changes in the current release.
      l3: Measured with pipeline duration, failure rate, and bypass trends.
  references:
    - title: NIST SP 800-218 SSDF PS.2 and PW.8
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: NIST CSF 2.0 PR.PS
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [ci-cd, automation, release]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
