- id: SRAS-CHG-001
  version: 0.2.0
  title:
    en: All source and configuration changes are version controlled
    th: การเปลี่ยนแปลง source และ configuration ทั้งหมดถูกควบคุมด้วย version control
  description:
    en: Production source code, infrastructure definitions, and configuration must be stored in version control with attributable commits and protected main branches. A production change applied outside version control fails the requirement.
    th: source code, นิยามโครงสร้างพื้นฐาน และ configuration ของ production ต้องถูกเก็บใน version control พร้อม commit ที่ระบุผู้ทำและ branch หลักที่ได้รับการป้องกัน การเปลี่ยนแปลง production ที่ทำนอก version control ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A change that is not in version control cannot be reviewed, reproduced, or rolled back.
    th: การเปลี่ยนแปลงที่ไม่ได้อยู่ใน version control ไม่สามารถ review ทำซ้ำ หรือ rollback ได้
  domain: change-release
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: Repository and branch protection configuration
      max_age_days: 180
    - type: log
      description: Commit history and change trace for the current release
      max_age_days: 90
  assessment:
    lite:
      pass: Production changes are traceable to reviewed commits on protected branches.
      partial: Most changes are versioned but some production paths bypass control.
    full:
      l2: Enforced for all production source, infrastructure, and configuration.
      l3: Measured with bypass findings and traceability coverage.
  references:
    - title: NIST SP 800-218 SSDF PS.1
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: ISO/IEC 27001:2022 8.32
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [version-control, change-management, release]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-CHG-002
  version: 0.2.0
  title:
    en: Every change is peer reviewed before it reaches production
    th: ทุกการเปลี่ยนแปลงได้รับการ review โดยเพื่อนร่วมงานก่อนถึง production
  description:
    en: Each production change must have at least one qualified reviewer who is not the author, with review evidence and resolved findings. A change merged without review or with unresolved blocking findings fails the requirement.
    th: การเปลี่ยนแปลง production แต่ละรายการต้องมีผู้ review ที่มีคุณสมบัติอย่างน้อยหนึ่งคนซึ่งไม่ใช่ผู้เขียน พร้อมหลักฐานการ review และ findings ที่ได้รับการแก้ไข การเปลี่ยนแปลงที่ merge โดยไม่มีการ review หรือยังมี blocking findings ที่ไม่ได้รับการแก้ไขถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Review catches defects and unsafe assumptions before they reach users.
    th: การ review ตรวจจับข้อบกพร่องและสมมติฐานที่ไม่ปลอดภัยก่อนถึงผู้ใช้
  domain: change-release
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: ticket
      description: Review approval records for production changes in the current release
      max_age_days: 90
    - type: configuration
      description: Branch protection and required-review configuration
      max_age_days: 180
  assessment:
    lite:
      pass: Every production change has an independent reviewer and resolved findings.
      partial: Review exists but some changes bypass it or leave blocking findings open.
    full:
      l2: Required for all production changes.
      l3: Measured with review coverage, review time, and escaped-defect trends.
  references:
    - title: NIST SP 800-218 SSDF PW.7
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: ISO/IEC 27001:2022 8.32
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [code-review, change-management, release]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
