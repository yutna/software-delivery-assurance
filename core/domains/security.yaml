- id: SRAS-SEC-010
  version: 0.2.0
  title:
    en: Security events are logged, monitored, and alerted with an owner
    th: เหตุการณ์ด้านความปลอดภัยถูกบันทึก เฝ้าระวัง และแจ้งเตือนโดยมี owner
  description:
    en: Security-relevant events must be collected in a protected log with sufficient context and retention, monitored for defined conditions, and routed to a named owner with an actionable alert. An unmonitored production system fails the requirement.
    th: เหตุการณ์ที่เกี่ยวข้องกับความปลอดภัยต้องถูกรวบรวมใน log ที่ได้รับการป้องกันพร้อมบริบทและระยะเวลาจัดเก็บที่เพียงพอ ถูกเฝ้าระวังตามเงื่อนไขที่กำหนด และส่งต่อไปยัง owner ที่ระบุชื่อพร้อมการแจ้งเตือนที่นำไปปฏิบัติได้ ระบบ production ที่ไม่มีการเฝ้าระวังถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An event that is not collected or reviewed cannot be detected or investigated.
    th: เหตุการณ์ที่ไม่ถูกเก็บหรือทบทวนไม่สามารถตรวจจับหรือสืบสวนได้
