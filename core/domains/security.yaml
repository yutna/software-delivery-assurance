- id: SRAS-SEC-005
  version: 0.2.0
  title:
    en: Multi-factor authentication protects privileged and remote access
    th: multi-factor authentication ปกป้องการเข้าถึงแบบ privileged และระยะไกล
  description:
    en: Privileged accounts and all remote or administrative access must require multi-factor authentication. Single-factor authentication for these paths fails the requirement, even when the password is strong.
    th: บัญชี privileged และการเข้าถึงระยะไกลหรือการเข้าถึงของผู้ดูแลทั้งหมดต้องใช้ multi-factor authentication การยืนยันตัวตนด้วยปัจจัยเดียวสำหรับช่องทางเหล่านี้ถือว่าไม่ผ่านข้อกำหนด แม้รหัสผ่านจะแข็งแรง
  rationale:
    en: A stolen password is not enough to reach privileged functions when a second factor is enforced.
    th: รหัสผ่านที่ถูกขโมยไม่เพียงพอต่อการเข้าถึงฟังก์ชัน privileged เมื่อมีการบังคับใช้ปัจจัยที่สอง
  domain: security
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: Multi-factor authentication policy and enforcement configuration
      max_age_days: 180
    - type: test_result
      description: Authentication test for privileged and remote access paths
      max_age_days: 90
  assessment:
    lite:
      pass: Privileged and remote access paths require multi-factor authentication.
      partial: Multi-factor authentication is enforced for some privileged or remote paths.
    full:
      l2: Enforced for every privileged and remote path in scope.
      l3: Measured with coverage and authentication-exception metrics.
  references:
    - title: NIST CSF 2.0 PR.AA
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: OWASP ASVS V2 Authentication
      url: https://owasp.org/www-project-application-security-verification-standard/
      type: standard
  tags: [identity, authentication, privileged-access]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
