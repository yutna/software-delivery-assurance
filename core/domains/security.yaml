- id: SRAS-SEC-009
  version: 0.2.0
  title:
    en: Vulnerabilities are prioritized and remediated within defined targets
    th: ช่องโหว่ถูกจัดลำดับความสำคัญและแก้ไขภายในเป้าหมายที่กำหนด
  description:
    en: Security findings from scans, tests, and reports must be tracked with severity, owner, and remediation target, and must be remediated or formally accepted within the target. An overdue critical finding without an approved exception fails the requirement.
    th: findings ด้านความปลอดภัยจากการสแกน การทดสอบ และรายงาน ต้องถูกติดตามพร้อม severity owner และเป้าหมายการแก้ไข และต้องได้รับการแก้ไขหรือยอมรับอย่างเป็นทางการภายในเป้าหมาย finding ระดับ critical ที่เกินกำหนดโดยไม่มีข้อยกเว้นที่ได้รับอนุมัติถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A finding without an owner and deadline is a permanent, invisible risk.
    th: finding ที่ไม่มี owner และกำหนดเวลาเป็นความเสี่ยงถาวรที่มองไม่เห็น
  domain: security
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: report
      description: Vulnerability register with severity, owner, target date, and status
      max_age_days: 30
    - type: ticket
      description: Remediation or acceptance evidence for open critical and high findings
      max_age_days: 30
  assessment:
    lite:
      pass: All critical and high findings have an owner and a target date, and overdue items are escalated.
      partial: Findings are tracked but some lack an owner, target, or decision.
    full:
      l2: Managed within defined targets for the current release.
      l3: Measured with time-to-remediate, recurrence, and exception trends.
  references:
    - title: NIST CSF 2.0 ID.RA and PR.PS
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 8.8
      url: https://www.iso.org/standard/27001
      type: standard
    - title: FIRST CVSS
      url: https://www.first.org/cvss/
      type: standard
