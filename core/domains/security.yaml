  updated_at: "2026-10-27"
- id: SRAS-SEC-007
  version: 0.2.0
  title:
    en: Security requirements and threat models are defined before build
    th: ข้อกำหนดด้านความปลอดภัยและ threat model ถูกกำหนดก่อนการพัฒนา
  description:
    en: Each material change must have documented security requirements and a threat model that covers assets, trust boundaries, threats, and mitigations before implementation. A high-risk change without a threat model fails the requirement.
    th: การเปลี่ยนแปลงที่มีนัยสำคัญแต่ละครั้งต้องมีข้อกำหนดด้านความปลอดภัยและ threat model ที่ครอบคลุมสินทรัพย์ ขอบเขตความเชื่อถือ ภัยคุกคาม และมาตรการบรรเทาก่อนเริ่มพัฒนา การเปลี่ยนแปลงที่มีความเสี่ยงสูงโดยไม่มี threat model ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Security decisions are cheapest and most effective before the design is fixed.
    th: การตัดสินใจด้านความปลอดภัยมีต้นทุนต่ำและได้ผลที่สุดก่อนที่การออกแบบจะถูกตรึง
  domain: security
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Security requirements and threat model for the current release
      max_age_days: 365
    - type: ticket
      description: Design review record with security sign-off
      max_age_days: 365
  assessment:
    lite:
      pass: Security requirements and a threat model exist for high-risk changes.
      partial: Some high-risk changes have no threat model or security sign-off.
    full:
      l2: Applied to all high-risk changes in the current release.
      l3: Threat models updated after material change and tracked to mitigation closure.
  references:
    - title: NIST SP 800-218 SSDF PW.1
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: ISO/IEC 27001:2022 8.25 and 8.26
      url: https://www.iso.org/standard/27001
      type: standard
    - title: OWASP ASVS V1 Architecture
      url: https://owasp.org/www-project-application-security-verification-standard/
      type: standard
  tags: [secure-sdlc, threat-modeling, design]
  status: active
  introduced_in: 0.2.0
