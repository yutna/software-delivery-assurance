- id: SRAS-SEC-006
  version: 0.2.0
  title:
    en: Access is granted, reviewed, and revoked through a controlled process
    th: การให้สิทธิ์ ทบทวน และเพิกถอนการเข้าถึงเป็นไปตามกระบวนการที่ควบคุม
  description:
    en: Access must be granted through an approved request, reviewed at a defined cadence, and revoked when a person changes role or leaves. An account that remains active after departure or role change fails the requirement.
    th: การเข้าถึงต้องได้รับอนุมัติผ่านคำขอที่ได้รับอนุมัติ มีการทบทวนตามรอบที่กำหนด และเพิกถอนเมื่อผู้ใช้เปลี่ยนบทบาทหรือออกจากองค์กร บัญชีที่ยังใช้งานได้หลังออกจากองค์กรหรือเปลี่ยนบทบาทถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Unreviewed access accumulates and outlives the reason it was granted.
    th: สิทธิ์ที่ไม่ได้ทบทวนจะสะสมและคงอยู่เกินกว่าเหตุผลที่ให้สิทธิ์นั้น
  domain: security
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Access request and approval procedure
      max_age_days: 365
    - type: ticket
      description: Most recent access review with decisions and approver
      max_age_days: 180
    - type: report
      description: Leaver and role-change reconciliation for the current period
      max_age_days: 90
  assessment:
    lite:
      pass: Access requests, reviews, and revocations are recorded and current.
      partial: The process exists but reviews or revocations are incomplete.
    full:
      l2: Applied to all in-scope systems for the current period.
      l3: Measured with review completion, orphan-account counts, and time-to-revoke.
  references:
    - title: ISO/IEC 27001:2022 8.2 and 8.3
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST CSF 2.0 PR.AA
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [access-control, access-review, identity]
  status: active
  introduced_in: 0.2.0
