- id: SRAS-SEC-008
  version: 0.2.0
  title:
    en: Code review and automated security scans gate every change
    th: การ review code และการสแกนความปลอดภัยอัตโนมัติเป็น gate ของทุกการเปลี่ยนแปลง
  description:
    en: Every production change must pass peer review and automated secret, dependency, and static analysis scans before merge. A merge that bypasses a required scan or review fails the requirement.
    th: การเปลี่ยนแปลงสู่ production ทุกรายการต้องผ่านการ review โดยเพื่อนร่วมงานและการสแกน secret dependency และ static analysis อัตโนมัติก่อน merge การ merge ที่ข้ามการสแกนหรือการ review ที่กำหนดถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A consistent automated gate catches defects that manual review alone misses.
    th: gate อัตโนมัติที่สม่ำเสมอตรวจจับข้อบกพร่องที่การ review ด้วยมือเพียงอย่างเดียวอาจมองข้าม
  domain: security
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: CI pipeline configuration showing required review and scan jobs
      max_age_days: 180
    - type: report
      description: Scan results and merge-blocking policy for the current release
      max_age_days: 90
    - type: ticket
      description: Exception record for any bypass with approval and expiry
      max_age_days: 90
  assessment:
    lite:
      pass: Required reviews and scans run on every production change.
      partial: Scans or reviews exist but are not consistently enforced.
    full:
      l2: Enforced for all production changes in the current release.
      l3: Measured with bypass rate, finding age, and remediation trends.
  references:
    - title: NIST SP 800-218 SSDF PW.7 and PW.8
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      type: standard
    - title: ISO/IEC 27001:2022 8.28
      url: https://www.iso.org/standard/27001
      type: standard
    - title: OWASP ASVS V1 and V10
      url: https://owasp.org/www-project-application-security-verification-standard/
      type: standard
  tags: [secure-sdlc, code-review, static-analysis]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
