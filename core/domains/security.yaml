- id: SRAS-SEC-011
  version: 0.2.0
  title:
    en: Production networks are segmented and traffic is restricted by policy
    th: เครือข่าย production ถูกแบ่งส่วนและจำกัดการรับส่งข้อมูลตามนโยบาย
  description:
    en: Production environments must be segmented from development and administrative networks, with inbound and outbound traffic restricted by documented rules. A flat network or an unrestricted administrative path fails the requirement.
    th: สภาพแวดล้อม production ต้องถูกแบ่งส่วนจากเครือข่าย development และเครือข่ายผู้ดูแล โดยจำกัดการรับส่งข้อมูลขาเข้าและขาออกด้วยกฎที่จัดทำเอกสาร เครือข่ายแบบ flat หรือช่องทางผู้ดูแลที่ไม่ถูกจำกัดถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Segmentation limits lateral movement after a compromise.
    th: การแบ่งส่วนเครือข่ายจำกัดการเคลื่อนที่ในแนวนอนหลังการถูก compromise
  domain: security
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: diagram
      description: Network diagram showing segments, trust boundaries, and data flows
      max_age_days: 365
    - type: configuration
      description: Firewall, security-group, or network-policy rules for production
      max_age_days: 180
    - type: test_result
      description: Connectivity test proving denied paths and allowed paths
      max_age_days: 180
  assessment:
    lite:
      pass: Production is segmented and documented rules restrict inbound and outbound traffic.
      partial: Segmentation exists but some paths are unrestricted or undocumented.
    full:
      l2: Implemented and tested for all production segments.
      l3: Reviewed after material change and measured with drift and exposed-service findings.
  references:
