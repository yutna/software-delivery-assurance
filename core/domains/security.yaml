- id: SRAS-SEC-012
  version: 0.2.0
  title:
    en: Independent security testing is performed and findings are closed
    th: มีการทดสอบความปลอดภัยโดยอิสระและปิด findings อย่างครบถ้วน
  description:
    en: In-scope systems must undergo independent penetration testing or a comparable security assessment at a defined cadence, with scope, results, and remediation recorded. A test with unaddressed critical findings and no approved exception fails the requirement.
    th: ระบบที่อยู่ในขอบเขตต้องได้รับการทดสอบเจาะระบบโดยอิสระหรือการประเมินความปลอดภัยที่เทียบเท่าตามรอบที่กำหนด โดยบันทึกขอบเขต ผลลัพธ์ และการแก้ไข การทดสอบที่มี critical findings ที่ยังไม่ได้รับการแก้ไขและไม่มีข้อยกเว้นที่ได้รับอนุมัติถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Independent testing challenges assumptions that the delivery team cannot see.
    th: การทดสอบโดยอิสระท้าทายสมมติฐานที่ทีมส่งมอบมองไม่เห็น
  domain: security
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: report
      description: Independent test report with scope, date, and methodology
      max_age_days: 365
    - type: ticket
      description: Remediation tracker for test findings with owners and status
      max_age_days: 180
  assessment:
    lite:
      pass: An independent test was completed for the current scope and critical findings are closed.
      partial: A test was completed but critical remediation or scope coverage is incomplete.
    full:
      l2: Completed at the defined cadence for the current release.
      l3: Risk-based scope, retest evidence, and trend analysis across cycles.
  references:
    - title: NIST CSF 2.0 ID.RA and PR.PS
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 8.29
