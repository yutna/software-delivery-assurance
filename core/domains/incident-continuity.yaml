- id: SRAS-INC-001
  version: 0.2.0
  title:
    en: An incident response plan covers roles, phases, and evidence
    th: แผนตอบสนองเหตุการณ์ครอบคลุมบทบาท ขั้นตอน และหลักฐาน
  description:
    en: The product must have an approved incident response plan that defines roles, severity, detection, containment, eradication, recovery, and evidence handling. A plan without an owner or evidence-handling step fails the requirement.
    th: ผลิตภัณฑ์ต้องมีแผนตอบสนองเหตุการณ์ที่ได้รับอนุมัติ ซึ่งกำหนดบทบาท severity การตรวจจับ การจำกัดวง การกำจัดต้นเหตุ การกู้คืน และการจัดการหลักฐาน แผนที่ไม่มี owner หรือไม่มีขั้นตอนจัดการหลักฐานถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A response improvised during an incident loses time and evidence.
    th: การตอบสนองที่คิดขึ้นในระหว่างเหตุการณ์ทำให้สูญเสียเวลาและหลักฐาน
  domain: incident-continuity
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Approved incident response plan with roles and phases
      max_age_days: 365
    - type: ticket
      description: Plan review or exercise record
      max_age_days: 365
  assessment:
    lite:
      pass: The plan is approved, owned, and covers response phases and evidence.
      partial: A plan exists but roles, phases, or evidence handling are incomplete.
    full:
      l2: Approved and exercised for the current release.
      l3: Reviewed after incidents and measured with response-time trends.
  references:
    - title: NIST SP 800-61 Rev. 3
      url: https://csrc.nist.gov/pubs/sp/800/61/r3/final
      type: standard
    - title: ISO/IEC 27001:2022 5.24 and 5.26
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [incident-response, security-operations, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
