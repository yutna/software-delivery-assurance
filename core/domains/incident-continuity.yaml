- id: SRAS-INC-004
  version: 0.2.0
  title:
    en: Incidents produce blameless postmortems with tracked actions
    th: เหตุการณ์สำคัญมี postmortem แบบไม่ตำหนิบุคคลพร้อมการติดตามการแก้ไข
  description:
    en: Material incidents must have a postmortem that records timeline, impact, root causes, contributing factors, and corrective actions with owners and due dates, and the actions must be tracked to closure. A postmortem without tracked actions fails the requirement.
    th: เหตุการณ์ที่มีนัยสำคัญต้องมี postmortem ที่บันทึกลำดับเหตุการณ์ ผลกระทบ สาเหตุราก ปัจจัยที่เกี่ยวข้อง และ corrective actions พร้อม owner และกำหนดส่งมอบ และต้องติดตามการดำเนินการจนปิด postmortem ที่ไม่มีการติดตามการแก้ไขถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An incident that is closed without learning will recur.
    th: เหตุการณ์ที่ถูกปิดโดยไม่เกิดการเรียนรู้จะเกิดขึ้นซ้ำ
  domain: incident-continuity
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Postmortem with timeline, impact, causes, and actions
      max_age_days: 180
    - type: ticket
      description: Corrective-action tracker with owners and closure evidence
      max_age_days: 180
  assessment:
    lite:
      pass: Material incidents have postmortems and tracked actions.
      partial: Postmortems exist but some lack causes, owners, or closure.
    full:
      l2: Completed for all material incidents in the current period.
      l3: Measured with action closure rate and repeat-incident trends.
  references:
    - title: NIST SP 800-61 Rev. 3
      url: https://csrc.nist.gov/pubs/sp/800/61/r3/final
      type: standard
    - title: NIST CSF 2.0 RS.AN
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [postmortem, learning, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
