- id: SRAS-INC-005
  version: 0.2.0
  title:
    en: A business continuity plan covers critical products and dependencies
    th: แผนความต่อเนื่องทางธุรกิจครอบคลุมผลิตภัณฑ์และ dependency ที่สำคัญ
  description:
    en: The product must have an approved business continuity plan that identifies critical functions, dependencies, recovery priorities, and alternate arrangements. A plan that omits a critical dependency or has no owner fails the requirement.
    th: ผลิตภัณฑ์ต้องมีแผนความต่อเนื่องทางธุรกิจที่ได้รับอนุมัติ ซึ่งระบุฟังก์ชันที่สำคัญ dependencies ลำดับความสำคัญในการกู้คืน และแนวทางสำรอง แผนที่ละเว้น dependency ที่สำคัญหรือไม่มี owner ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Continuity depends on the weakest dependency, not the strongest system.
    th: ความต่อเนื่องขึ้นอยู่กับ dependency ที่อ่อนแอที่สุด ไม่ใช่ระบบที่แข็งแรงที่สุด
  domain: incident-continuity
  criticality: gate
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Approved business continuity plan with critical functions and dependencies
      max_age_days: 365
    - type: ticket
      description: Plan review or exercise record
      max_age_days: 365
  assessment:
    lite:
      pass: The plan is approved, owned, and covers critical dependencies.
      partial: A plan exists but dependencies, priorities, or ownership are incomplete.
    full:
      l2: Approved and exercised for the current scope.
      l3: Reviewed after material change and measured with recovery capability.
  references:
    - title: ISO 22301:2019
      url: https://www.iso.org/standard/75106.html
      type: standard
    - title: ISO/IEC 27001:2022 5.29 and 5.30
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [business-continuity, bcp, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
