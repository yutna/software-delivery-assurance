  updated_at: "2026-10-27"
- id: SRAS-INC-006
  version: 0.2.0
  title:
    en: Disaster recovery is planned, tested, and meets its objectives
    th: การกู้คืนจากภัยพิบัติถูกวางแผน ทดสอบ และเป็นไปตามเป้าหมาย
  description:
    en: The product must have a disaster recovery plan with recovery time and recovery point objectives, and the plan must be exercised at a defined cadence with results recorded. An untested DR plan or a missed objective fails the requirement.
    th: ผลิตภัณฑ์ต้องมีแผนกู้คืนจากภัยพิบัติพร้อม recovery time และ recovery point objectives และต้องมีการซ้อมแผนตามรอบที่กำหนดโดยบันทึกผลลัพธ์ แผน DR ที่ไม่เคยทดสอบหรือไม่เป็นไปตามเป้าหมายถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A DR plan that has never run is a hypothesis, not a capability.
    th: แผน DR ที่ไม่เคยทำงานจริงเป็นเพียงสมมติฐาน ไม่ใช่ขีดความสามารถ
  domain: incident-continuity
  criticality: gate
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Disaster recovery plan with RTO, RPO, and roles
      max_age_days: 365
    - type: report
      description: DR exercise result with duration and gaps
      max_age_days: 365
  assessment:
    lite:
      pass: The DR plan is documented, owned, and exercised.
      partial: A plan exists but is untested or misses its objective.
    full:
      l2: Exercised at the defined cadence for critical services.
      l3: Measured with RTO/RPO attainment and gap closure.
  references:
    - title: ISO 22301:2019
      url: https://www.iso.org/standard/75106.html
      type: standard
    - title: NIST SP 800-34 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
      type: standard
  tags: [disaster-recovery, dr, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
