- id: SRAS-INC-003
  version: 0.2.0
  title:
    en: Incident communication is planned for internal and external audiences
    th: การสื่อสารเหตุการณ์ถูกวางแผนสำหรับผู้รับภายในและภายนอก
  description:
    en: The product must define who communicates incident status to internal teams, customers, and regulators, with approved templates, cadence, and authority. An incident communication sent without an owner or approval path fails the requirement.
    th: ผลิตภัณฑ์ต้องกำหนดผู้สื่อสารสถานะเหตุการณ์แก่ทีมภายใน ลูกค้า และหน่วยงานกำกับดูแล พร้อมแม่แบบ จังหวะเวลา และอำนาจอนุมัติที่ได้รับอนุมัติ การสื่อสารเหตุการณ์ที่ส่งโดยไม่มี owner หรือเส้นทางอนุมัติถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Conflicting or premature communication creates more harm than the outage itself.
    th: การสื่อสารที่ขัดแย้งหรือเร็วเกินไปสร้างความเสียหายมากกว่า outage เอง
  domain: incident-continuity
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Incident communication plan with audiences, templates, cadence, and approvers
      max_age_days: 365
    - type: report
      description: Communication record from the latest exercise or incident
      max_age_days: 180
  assessment:
    lite:
      pass: Communication roles, templates, and approval paths are defined and current.
      partial: A plan exists but audiences, templates, or approvals are incomplete.
    full:
      l2: Applied to the current release and exercised.
      l3: Measured with notice time, message accuracy, and stakeholder feedback.
  references:
    - title: NIST CSF 2.0 RS.CO
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 5.26
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [incident-communication, stakeholders, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
