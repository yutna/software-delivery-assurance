- id: SRAS-INC-007
  version: 0.2.0
  title:
    en: Crisis management has a command structure and decision log
    th: การจัดการวิกฤตมีโครงสร้างการบัญชาการและบันทึกการตัดสินใจ
  description:
    en: A crisis that exceeds normal incident handling must activate a predefined command structure with named roles, decision authority, and a decision log. A crisis response with no commander or no decision record fails the requirement.
    th: วิกฤตที่เกินกว่าการจัดการเหตุการณ์ปกติต้องเปิดใช้โครงสร้างการบัญชาการที่กำหนดไว้ล่วงหน้าพร้อมบทบาทที่ระบุชื่อ อำนาจตัดสินใจ และบันทึกการตัดสินใจ การตอบสนองวิกฤตที่ไม่มีผู้บัญชาการหรือไม่มีบันทึกการตัดสินใจถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Crisis decisions made without clear authority and records cannot be coordinated or reviewed.
    th: การตัดสินใจในวิกฤตที่ไม่มีอำนาจชัดเจนและไม่มีบันทึกไม่สามารถประสานงานหรือทบทวนได้
  domain: incident-continuity
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Crisis management plan with command roles and decision authority
      max_age_days: 365
    - type: report
      description: Crisis exercise record with decision log
      max_age_days: 365
  assessment:
    lite:
      pass: A crisis plan and decision log are defined and exercised.
      partial: A plan exists but roles, authority, or the decision log are incomplete.
    full:
      l2: Exercised for the current scope.
      l3: Measured with activation time and decision-cycle performance.
  references:
    - title: ISO 22301:2019
      url: https://www.iso.org/standard/75106.html
      type: standard
    - title: NIST CSF 2.0 RS.CO
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [crisis-management, command, resilience]
  status: active
  introduced_in: 0.2.0
