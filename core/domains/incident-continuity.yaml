- id: SRAS-INC-008
  version: 0.2.0
  title:
    en: Regulatory notification readiness is defined and reviewed
    th: ความพร้อมในการแจ้งหน่วยงานกำกับดูแลถูกกำหนดและทบทวน
  description:
    en: The product must identify incident types that may require external notification, with decision owners, timelines, evidence requirements, and a qualified review of the obligation. An incident with no notification assessment or no named decision owner fails the requirement.
    th: ผลิตภัณฑ์ต้องระบุประเภทเหตุการณ์ที่อาจต้องแจ้งภายนอก พร้อม owner ผู้ตัดสินใจ กำหนดเวลา ข้อกำหนดด้านหลักฐาน และการทบทวนข้อผูกพันโดยผู้มีคุณสมบัติ เหตุการณ์ที่ไม่มีประเมินการแจ้งหรือไม่มี owner ผู้ตัดสินใจที่ระบุชื่อถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Notification deadlines are short, and an unowned decision becomes a missed deadline.
    th: กำหนดเวลาการแจ้งนั้นสั้น และการตัดสินใจที่ไม่มีผู้รับผิดชอบจะกลายเป็นกำหนดเวลาที่พลาด
  domain: incident-continuity
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Notification matrix with incident types, owners, timelines, and evidence requirements
      max_age_days: 365
    - type: ticket
      description: Qualified review record for the notification obligations
      max_age_days: 365
  assessment:
    lite:
      pass: Notification triggers, owners, and timelines are documented and reviewed.
      partial: A matrix exists but some triggers, owners, or reviews are missing.
    full:
      l2: Reviewed by a qualified person for the current scope.
      l3: Exercised in incident scenarios and measured with decision time.
  references:
    - title: ISO/IEC 27001:2022 5.24 and 5.26
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST CSF 2.0 RS.CO
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [regulatory-notification, incident-response, compliance-readiness]
  status: active
  introduced_in: 0.2.0
