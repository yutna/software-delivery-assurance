  updated_at: "2026-10-27"
- id: SRAS-INC-002
  version: 0.2.0
  title:
    en: Incident severity and escalation paths are defined and current
    th: ระดับความรุนแรงของเหตุการณ์และเส้นทางการส่งต่อถูกกำหนดและเป็นปัจจุบัน
  description:
    en: The product must define incident severity levels, decision criteria, escalation triggers, and named contacts, and the on-call path must reach a decision-maker. An incident with no severity rule or unreachable escalation contact fails the requirement.
    th: ผลิตภัณฑ์ต้องกำหนดระดับความรุนแรงของเหตุการณ์ เกณฑ์การตัดสินใจ เงื่อนไขการส่งต่อ และผู้ติดต่อที่ระบุชื่อ และเส้นทาง on-call ต้องเข้าถึงผู้มีอำนาจตัดสินใจ เหตุการณ์ที่ไม่มีกฎระดับความรุนแรงหรือผู้ติดต่อส่งต่อที่ติดต่อไม่ได้ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Without agreed severity, response effort is allocated by whoever is loudest.
    th: หากไม่มีระดับความรุนแรงที่ตกลงร่วมกัน ความพยายามในการตอบสนองจะขึ้นอยู่กับว่าใครเสียงดังที่สุด
  domain: incident-continuity
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Severity matrix and escalation path with named contacts and targets
      max_age_days: 90
    - type: ticket
      description: Latest escalation or paging test record
      max_age_days: 90
  assessment:
    lite:
      pass: Severity rules and escalation contacts are current and reachable.
      partial: Rules exist but some contacts or triggers are stale.
    full:
      l2: Current for all critical services.
      l3: Measured with escalation time and decision latency.
  references:
    - title: NIST CSF 2.0 RS.MA
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 5.25
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [incident-response, escalation, security-operations]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
