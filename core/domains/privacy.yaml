- id: SRAS-PRV-010
  version: 0.2.0
  title:
    en: High-risk processing has a privacy impact assessment
    th: การประมวลผลที่มีความเสี่ยงสูงมีการประเมินผลกระทบด้านความเป็นส่วนตัว
  description:
    en: Processing that is high risk by nature, scale, sensitivity, or new technology must have a privacy impact assessment before launch and after material change, with mitigations recorded. A high-risk launch without an assessment fails the requirement.
    th: การประมวลผลที่มีความเสี่ยงสูงเนื่องจากลักษณะ ขนาด ความอ่อนไหว หรือเทคโนโลยีใหม่ ต้องมีการประเมินผลกระทบด้านความเป็นส่วนตัวก่อนเปิดใช้งานและหลังการเปลี่ยนแปลงที่มีนัยสำคัญ โดยบันทึกมาตรการบรรเทา การเปิดใช้งานที่มีความเสี่ยงสูงโดยไม่มีการประเมินถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: High-risk processing needs a documented decision before it affects real people.
    th: การประมวลผลที่มีความเสี่ยงสูงต้องการการตัดสินใจที่บันทึกไว้ก่อนส่งผลกระทบต่อบุคคลจริง
  domain: privacy
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
