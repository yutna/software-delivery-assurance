- id: SRAS-OPS-009
  version: 0.2.0
  title:
    en: Recurring incidents are investigated through problem management
    th: เหตุการณ์ที่เกิดซ้ำได้รับการสืบสวนผ่าน problem management
  description:
    en: Recurring or high-impact incidents must be recorded as problems with root-cause analysis, corrective actions, owners, and due dates, and the actions must be tracked to closure. A repeat incident with no problem record fails the requirement.
    th: เหตุการณ์ที่เกิดซ้ำหรือมีผลกระทบสูงต้องถูกบันทึกเป็นปัญหา พร้อมการวิเคราะห์สาเหตุราก corrective actions owner และกำหนดส่งมอบ และต้องติดตามการดำเนินการจนปิด เหตุการณ์ที่เกิดซ้ำโดยไม่มีบันทึกปัญหาถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Fixing the symptom without the cause guarantees the incident returns.
    th: การแก้ไขอาการโดยไม่แก้สาเหตุทำให้เหตุการณ์กลับมาเกิดซ้ำอย่างแน่นอน
  domain: operations
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Problem register with root cause, corrective actions, owners, and due dates
      max_age_days: 180
    - type: ticket
      description: Closure or effectiveness review for corrective actions
      max_age_days: 180
  assessment:
    lite:
      pass: Recurring incidents have problem records and tracked actions.
      partial: Some recurring incidents have no root cause or open actions are untracked.
    full:
      l2: Applied to recurring and high-impact incidents.
      l3: Measured with repeat-incident rate and corrective-action effectiveness.
  references:
    - title: ISO/IEC 20000-1:2018
      url: https://www.iso.org/standard/70636.html
      type: standard
    - title: NIST CSF 2.0 PR.IR
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [problem-management, root-cause, operations]
  status: active
