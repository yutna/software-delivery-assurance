  updated_at: "2026-10-27"
- id: SRAS-OPS-005
  version: 0.2.0
  title:
    en: Backups are configured, encrypted, and monitored
    th: backup ถูกกำหนดค่า เข้ารหัส และเฝ้าระวัง
  description:
    en: In-scope data and configuration must have scheduled backups with defined frequency, retention, encryption, and monitoring, and backup failures must alert an owner. A data store without a current successful backup fails the requirement.
    th: ข้อมูลและ configuration ที่อยู่ในขอบเขตต้องมี backup ตามกำหนดการพร้อมความถี่ ระยะเวลาจัดเก็บ การเข้ารหัส และการเฝ้าระวังที่กำหนด และความล้มเหลวของ backup ต้องแจ้ง owner data store ที่ไม่มี backup ที่สำเร็จล่าสุดถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A backup that silently fails is worse than no backup because it creates false confidence.
    th: backup ที่ล้มเหลวอย่างเงียบ ๆ แย่กว่าไม่มี backup เพราะสร้างความเชื่อมั่นที่ผิด
  domain: operations
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: Backup schedule, retention, encryption, and monitoring configuration
      max_age_days: 180
    - type: report
      description: Latest backup success and coverage report
      max_age_days: 30
  assessment:
    lite:
      pass: In-scope data has monitored, encrypted backups within retention.
      partial: Backups exist but coverage, encryption, or monitoring is incomplete.
    full:
      l2: Covered for all in-scope data and configuration.
      l3: Measured with success rate, coverage, and restore readiness.
  references:
    - title: ISO/IEC 27001:2022 8.13
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST SP 800-34 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
      type: standard
  tags: [backup, resilience, operations]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-OPS-006
  version: 0.2.0
  title:
    en: Restores are tested and meet the recovery objective
    th: การกู้คืนข้อมูลถูกทดสอบและเป็นไปตามเป้าหมายการกู้คืน
  description:
    en: Backups must be restored in a test at a defined cadence, and the restore must meet the documented recovery time and recovery point objectives. A backup that has never been restored or misses its objective fails the requirement.
    th: backup ต้องถูกกู้คืนในการทดสอบตามรอบที่กำหนด และการกู้คืนต้องเป็นไปตาม recovery time และ recovery point objectives ที่จัดทำเอกสาร backup ที่ไม่เคยถูกกู้คืนหรือไม่เป็นไปตามเป้าหมายถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Only a successful restore proves that a backup is usable.
    th: การกู้คืนที่สำเร็จเท่านั้นที่พิสูจน์ว่า backup ใช้งานได้
  domain: operations
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: report
      description: Restore test record with scope, date, duration, and data point
      max_age_days: 180
    - type: document
      description: Documented recovery time and recovery point objectives
      max_age_days: 365
  assessment:
    lite:
      pass: A restore test was completed within the cadence and met the objective.
      partial: A restore was tested but missed the objective or covers only part of the scope.
    full:
      l2: Tested at the defined cadence for all in-scope data.
      l3: Measured with restore success, duration, and gap findings.
  references:
    - title: ISO/IEC 27001:2022 8.13
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST SP 800-34 Rev. 1
      url: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
      type: standard
  tags: [restore, backup, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-OPS-007
  version: 0.2.0
  title:
    en: Runbooks exist for common failures and are exercised
    th: runbook มีสำหรับความล้มเหลวที่พบบ่อยและผ่านการซ้อม
  description:
    en: Common failure modes for critical journeys must have current runbooks with detection, decision criteria, steps, and escalation, and the runbooks must be exercised or reviewed. A critical failure mode with no runbook fails the requirement.
    th: รูปแบบความล้มเหลวที่พบบ่อยของ critical journeys ต้องมี runbook ที่เป็นปัจจุบันพร้อมการตรวจจับ เกณฑ์การตัดสินใจ ขั้นตอน และการส่งต่อ และ runbook ต้องผ่านการซ้อมหรือทบทวน รูปแบบความล้มเหลวที่สำคัญซึ่งไม่มี runbook ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: A runbook turns a rare, high-pressure failure into a practiced response.
    th: runbook เปลี่ยนความล้มเหลวที่พบได้ยากและมีแรงกดดันสูงให้เป็นการตอบสนองที่ฝึกฝนแล้ว
  domain: operations
  criticality: high
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Runbook index mapped to failure modes
      max_age_days: 365
    - type: ticket
      description: Exercise or review record for runbooks in the current period
      max_age_days: 180
  assessment:
    lite:
      pass: Common failure modes have current, exercised runbooks.
      partial: Some runbooks exist but coverage or exercise is incomplete.
    full:
      l2: Covered for critical journeys and reviewed for the current release.
      l3: Measured with runbook coverage, exercise completion, and time-to-recover.
  references:
    - title: ISO/IEC 20000-1:2018
      url: https://www.iso.org/standard/70636.html
      type: standard
    - title: NIST CSF 2.0 PR.IR
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [runbook, operations, resilience]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
