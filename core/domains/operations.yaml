- id: SRAS-OPS-003
  version: 0.2.0
  title:
    en: Service-level objectives are defined and reviewed for critical journeys
    th: service-level objectives ถูกกำหนดและทบทวนสำหรับ critical journeys
  description:
    en: Each critical journey must have service-level indicators, objectives, and an error budget, with a recorded review of performance against them. An SLO with no measured indicator or review fails the requirement.
    th: critical journey แต่ละรายการต้องมี service-level indicators objectives และ error budget พร้อมบันทึกการทบทวนผลการทำงานเทียบกับเป้าหมาย SLO ที่ไม่มีตัวชี้วัดที่วัดได้หรือไม่มีการทบทวนถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Reliability targets without measurement become opinions.
    th: เป้าหมายความน่าเชื่อถือที่ไม่มีการวัดผลกลายเป็นเพียงความคิดเห็น
  domain: operations
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: SLO definitions mapped to critical journeys
      max_age_days: 365
    - type: report
      description: Latest SLO performance and error-budget review
      max_age_days: 90
  assessment:
    lite:
      pass: Critical journeys have SLOs and a current performance review.
      partial: SLOs exist but some indicators or reviews are missing.
    full:
      l2: Defined and reviewed for the current release.
      l3: Error-budget policy applied to release and investment decisions.
  references:
    - title: ISO/IEC 20000-1:2018
      url: https://www.iso.org/standard/70636.html
      type: standard
    - title: NIST CSF 2.0 PR.IR
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [slo, reliability, operations]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
  created_at: "2026-10-27"
  updated_at: "2026-10-27"
- id: SRAS-OPS-004
  version: 0.2.0
  title:
    en: Capacity and load limits are planned and tested
    th: capacity และขีดจำกัดโหลดถูกวางแผนและทดสอบ
  description:
    en: Critical journeys must have a capacity model, expected peak load, and a load test or equivalent evidence showing headroom. A production system with unknown limits or no peak test fails the requirement.
    th: critical journeys ต้องมี capacity model โหลดสูงสุดที่คาดไว้ และการทดสอบโหลดหรือหลักฐานเทียบเท่าที่แสดง headroom ระบบ production ที่ไม่ทราบขีดจำกัดหรือไม่มีการทดสอบโหลดสูงสุดถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Capacity failures appear at the worst time and are expensive to fix under pressure.
    th: ความล้มเหลวด้าน capacity เกิดขึ้นในเวลาที่แย่ที่สุดและมีค่าใช้จ่ายสูงในการแก้ไขภายใต้แรงกดดัน
  domain: operations
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: Capacity model with expected peak and scaling limits
      max_age_days: 365
    - type: test_result
      description: Load test or capacity exercise result
      max_age_days: 180
  assessment:
    lite:
      pass: Critical journeys have a capacity model and peak-load evidence.
      partial: A model exists but peak load or headroom is untested.
    full:
      l2: Reviewed for the current release and expected peak.
      l3: Measured with saturation, headroom, and cost trends.
  references:
    - title: ISO/IEC 27001:2022 8.6
      url: https://www.iso.org/standard/27001
      type: standard
    - title: NIST CSF 2.0 PR.IR
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [capacity, reliability, operations]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
  review_status: draft
