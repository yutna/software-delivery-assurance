- id: SRAS-OPS-010
  version: 0.2.0
  title:
    en: Maintenance and service status are communicated to users
    th: การบำรุงรักษาและสถานะบริการถูกสื่อสารให้ผู้ใช้ทราบ
  description:
    en: Planned maintenance, degraded service, and customer-impacting outages must have an approved communication path, status channel, and owner, with messages issued within a defined target. An unannounced maintenance window or silent outage fails the requirement.
    th: การบำรุงรักษาตามแผน บริการที่เสื่อมคุณภาพ และ outage ที่กระทบลูกค้า ต้องมีช่องทางสื่อสารที่ได้รับอนุมัติ ช่องทางสถานะ และ owner โดยส่งข้อความภายในเป้าหมายที่กำหนด การบำรุงรักษาที่ไม่ประกาศหรือ outage ที่เงียบถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Users plan around known maintenance and trust a status channel that is used.
    th: ผู้ใช้สามารถวางแผนได้เมื่อทราบการบำรุงรักษาและไว้วางใจช่องทางสถานะที่มีการใช้งานจริง
  domain: operations
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
