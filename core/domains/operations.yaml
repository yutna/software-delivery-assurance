  updated_at: "2026-10-27"
- id: SRAS-OPS-002
  version: 0.2.0
  title:
    en: Actionable alerts have an owner and a linked runbook
    th: การแจ้งเตือนที่นำไปปฏิบัติได้มี owner และ runbook ที่เชื่อมโยง
  description:
    en: Alerts for critical journeys must be actionable, routed to a named owner, linked to a runbook, and tested to show detection and notification. An alert with no owner or no test record fails the requirement.
    th: การแจ้งเตือนสำหรับ critical journeys ต้องนำไปปฏิบัติได้ ส่งถึง owner ที่ระบุชื่อ เชื่อมโยงกับ runbook และผ่านการทดสอบเพื่อแสดงการตรวจจับและการแจ้ง การแจ้งเตือนที่ไม่มี owner หรือไม่มีบันทึกการทดสอบถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: An alert that nobody owns or acts on is noise, not detection.
    th: การแจ้งเตือนที่ไม่มีใครรับผิดชอบหรือลงมือทำเป็นเพียงเสียงรบกวน ไม่ใช่การตรวจจับ
  domain: operations
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: Alert rules and routing configuration
      max_age_days: 180
    - type: test_result
      description: Alert test showing detection, routing, and acknowledgement
      max_age_days: 90
  assessment:
    lite:
      pass: Critical alerts are owned, runbook-linked, and tested.
      partial: Alerts exist but some lack an owner, runbook, or test.
    full:
      l2: Covered for all critical journeys.
      l3: Measured with alert precision, time-to-acknowledge, and false-positive trends.
  references:
    - title: NIST CSF 2.0 DE.CM
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 8.16
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [alerting, monitoring, operations]
  status: active
  introduced_in: 0.2.0
