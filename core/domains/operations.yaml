  updated_at: "2026-10-27"
- id: SRAS-OPS-008
  version: 0.2.0
  title:
    en: On-call and escalation arrangements are defined and current
    th: การจัดเวร on-call และการส่งต่อปัญหาถูกกำหนดและเป็นปัจจุบัน
  description:
    en: Critical services must have a current on-call schedule, escalation path, contact method, and acknowledgement target. An unstaffed on-call rotation or a stale escalation list fails the requirement.
    th: บริการที่สำคัญต้องมีตาราง on-call ที่เป็นปัจจุบัน เส้นทางการส่งต่อ วิธีติดต่อ และเป้าหมายการตอบรับ การหมุนเวียน on-call ที่ไม่มีผู้รับผิดชอบหรือรายชื่อส่งต่อที่ล้าสมัยถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Detection without a reachable responder does not restore service.
    th: การตรวจจับที่ไม่มีการติดต่อผู้ตอบสนองได้ไม่สามารถกู้คืนบริการได้
  domain: operations
  criticality: high
  applicability:
    tiers: [2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: document
      description: On-call schedule and escalation matrix with acknowledgement targets
      max_age_days: 30
    - type: ticket
      description: Latest escalation or paging test record
      max_age_days: 90
  assessment:
    lite:
      pass: Critical services have current on-call and escalation contacts.
      partial: Arrangements exist but schedules or contacts are stale.
    full:
      l2: Current for all critical services.
      l3: Measured with acknowledgement time and escalation-path success.
  references:
    - title: ISO/IEC 20000-1:2018
      url: https://www.iso.org/standard/70636.html
      type: standard
    - title: NIST CSF 2.0 PR.IR
      url: https://www.nist.gov/cyberframework
      type: standard
  tags: [on-call, escalation, operations]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
