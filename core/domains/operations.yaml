- id: SRAS-OPS-001
  version: 0.2.0
  title:
    en: Production telemetry covers logs, metrics, and traces
    th: telemetry ของ production ครอบคลุม logs metrics และ traces
  description:
    en: Production systems must emit logs, metrics, and traces with correlation identifiers, defined retention, and coverage of critical journeys and dependencies. A critical component with no telemetry fails the requirement.
    th: ระบบ production ต้องส่ง logs metrics และ traces พร้อม correlation identifier ระยะเวลาจัดเก็บที่กำหนด และครอบคลุม critical journeys และ dependencies องค์ประกอบสำคัญที่ไม่มี telemetry ถือว่าไม่ผ่านข้อกำหนดนี้
  rationale:
    en: Without telemetry, operators cannot see failure or reconstruct what happened.
    th: หากไม่มี telemetry ผู้ปฏิบัติงานไม่สามารถมองเห็นความล้มเหลวหรือสร้างลำดับเหตุการณ์ย้อนหลังได้
  domain: operations
  criticality: gate
  applicability:
    tiers: [1, 2, 3]
    modules: []
    overlays: []
    excludes: []
  evidence:
    - type: configuration
      description: Telemetry collection and retention configuration
      max_age_days: 180
    - type: report
      description: Coverage report for critical journeys and dependencies
      max_age_days: 90
  assessment:
    lite:
      pass: Critical components emit correlated logs, metrics, and traces with retention.
      partial: Telemetry exists but some critical components or retention gaps remain.
    full:
      l2: Covered for all critical journeys and dependencies.
      l3: Measured with coverage, retention compliance, and query readiness.
  references:
    - title: NIST CSF 2.0 DE.CM
      url: https://www.nist.gov/cyberframework
      type: standard
    - title: ISO/IEC 27001:2022 8.16
      url: https://www.iso.org/standard/27001
      type: standard
  tags: [monitoring, observability, operations]
  status: active
  introduced_in: 0.2.0
  deprecated_in: null
  replaced_by: null
  translation_status: partial
  machine_translated: true
