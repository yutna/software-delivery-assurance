- id: SRAS-GOV-010
  version: 0.2.0
  title:
    en: Assurance exceptions are approved, time-bound, and owned
    th: ข้อยกเว้นด้าน assurance ได้รับอนุมัติ มีกำหนดเวลา และมี owner
  description:
    en: An exception to an assurance requirement must record the requirement, justification, risk owner, compensating control, approval, and expiry date. An exception without an owner or expiry is a gap, not an approved exception.
    th: ข้อยกเว้นต่อข้อกำหนด assurance ต้องบันทึกข้อกำหนด เหตุผล risk owner การควบคุมชดเชย การอนุมัติ และวันหมดอายุ ข้อยกเว้นที่ไม่มี owner หรือวันหมดอายุถือเป็นช่องว่าง ไม่ใช่ข้อยกเว้นที่ได้รับอนุมัติ
  rationale:
    en: Permanent exceptions hide risk and defeat the gate they bypass.
    th: ข้อยกเว้นแบบถาวรปกปิดความเสี่ยงและทำให้ gate ที่ถูกข้ามไร้ผล
