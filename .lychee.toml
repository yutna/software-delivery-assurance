# Link check configuration for local runs and CI.
#
# The user agent is a normal browser string because some official Thai
# government portals reject the default command-line user agent with HTTP 403.
# This changes only the request header, not which links are checked.
max_retries = 2
timeout = 20
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
include_fragments = "anchor-only"

# example.com is the placeholder domain in schema fixtures and synthetic
# examples. It is reserved for documentation and is never a real endpoint.
#
# The Philippine Official Gazette serves the canonical text of Republic Act
# No. 10173 but returns HTTP 403 to automated clients. The page is reachable in
# a browser and is the official source cited by the PH-DPA-001 register entry.
#
# The Thai Securities and Exchange Commission serves its news and notification
# pages to browsers but returns HTTP 403 to automated clients. The official
# sources remain linked for readers and are excluded only from the automated
# check.
#
# data.go.th serves the DGA Open Government License page to browsers but
# returns HTTP 403 to the automated checker. The page remains the public entry
# point for the licence terms.
exclude = [
  "https://example.com",
  "^https://www\\.officialgazette\\.gov\\.ph/",
  "^https://www\\.sec\\.or\\.th/",
  "^https://publish\\.sec\\.or\\.th/",
  "^https://data\\.go\\.th/",
  # The v1.0.0 announcement is prepared before the tag exists. The tag is
  # created when the v1.0.0 milestone closes (#66). Remove this exclusion in
  # #66 after the release page exists.
  "^https://github\\.com/yutna/software-delivery-assurance/releases/tag/v1\\.0\\.0$",
]

# Generated output, vendored material, and caches are not authored content.
# Their links are checked through the source instead.
exclude_path = [
  ".claude/skills",
  "vendor",
  "node_modules",
  "dist",
  "coverage",
  "tests/fixtures/invalid",
  "docs/.vitepress/dist",
  "docs/.vitepress/cache",
]
