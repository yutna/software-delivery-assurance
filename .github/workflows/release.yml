name: release
on:
  milestone:
    types: [closed]
permissions: {}
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          MILESTONE: ${{ github.event.milestone.title }}
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const milestone = (process.env.MILESTONE || "").replace(/^v/, "");
          const release = milestone === pkg.version;
          console.log("milestone=" + milestone + " package=" + pkg.version + " release=" + release);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "release=" + release + "\n");
          '
  release:
    needs: guard
    if: needs.guard.outputs.release == 'true'
    uses: yutna/oss-kit/.github/workflows/release.yml@main
    permissions:
      contents: write
      issues: write
    with:
      preflight: npx --yes node@24 tools/check-version.ts "$VERSION"
