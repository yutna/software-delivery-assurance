name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
assignees: [yutna]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included in this change?
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Which observable results make this complete?
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which commands or checks prove the result?
      placeholder: |
        e.g. npm run typecheck
        e.g. npm run sras -- render --check
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What should this change deliberately not include?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
