name: Bug report
description: Something isn't working
labels: [bug]
assignees: [yutna]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the error text or the output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit where the problem occurs.
      placeholder: e.g. v1.0.0 or 23ae0a9
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What command or check confirms the fix?
      placeholder: |
        e.g. npm run sras -- project validate <dir>
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime and tool versions
