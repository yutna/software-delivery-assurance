id: SRAS-SEC-001
version: 0.1.0
title:
  en: Authentication is required for every human and machine access path
  th: ต้องมี authentication สำหรับทุกช่องทางเข้าถึงของมนุษย์และเครื่อง
description:
  en: Every access path to production must require authentication.
  th: ทุกช่องทางเข้าถึงระบบ production ต้องมี authentication
rationale:
  en: Unauthenticated access cannot be attributed, revoked, or audited.
  th: การเข้าถึงที่ไม่มีการยืนยันตัวตนไม่สามารถตรวจสอบย้อนหลังได้
