  - id: SRAS-ONP-010
    version: 0.1.0
    module: SRAS-ONP
    title:
      en: Decommissioning removes data and access
      th: การปลดระวางลบข้อมูลและตัดสิทธิ์การเข้าถึง
    description:
      en: An asset removed from service must have its data securely erased or destroyed, its credentials and network access revoked, and its inventory record closed with evidence. An asset that is powered off but still credentialed is not decommissioned.
      th: asset ที่ถูกถอดออกจากบริการต้องมีข้อมูลถูกลบอย่างปลอดภัยหรือทำลาย ข้อมูลรับรองและสิทธิ์การเข้าถึงเครือข่ายถูกเพิกถอน และบันทึกในทะเบียนถูกปิดพร้อมหลักฐาน asset ที่ปิดเครื่องแต่ยังมีข้อมูลรับรองไม่ถือว่าปลดระวางแล้ว
    rationale:
      en: A forgotten asset keeps its credentials and its data.
      th: asset ที่ถูกลืมยังคงมีข้อมูลรับรองและข้อมูลของตน
    criticality: medium
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-ONP]
      overlays: []
      excludes: []
    evidence:
      - type: ticket
        description: Decommissioning record with data erasure and access revocation
        max_age_days: 365
      - type: attestation
        description: Destruction or secure erasure attestation
        max_age_days: 365
    assessment:
      lite:
        pass: Decommissioned assets have data erased and access revoked.
        partial: The record exists but erasure or revocation is unverified.
      full:
        l2: Erasure, revocation, and inventory closure are evidenced.
        l3: Decommissioning is sampled and reconciled with the inventory.
    references:
      - title: ISO/IEC 27001:2022
        url: https://www.iso.org/standard/27001
        type: standard
      - title: NIST SP 800-53 Rev. 5
        url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
        type: standard
