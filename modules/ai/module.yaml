    updated_at: "2026-10-27"

  - id: SRAS-AI-010
    version: 0.1.0
    module: SRAS-AI
    title:
      en: AI incidents are contained, investigated, and learned from
      th: เหตุการณ์ AI ถูกควบคุม สืบสวน และนำไปปรับปรุง
    description:
      en: An AI incident, including harmful output, unsafe recommendation, prompt injection, data leakage, or model unavailability, must have a defined containment path, an owner, a severity rule, and a post-incident review.
      th: เหตุการณ์ AI เช่น output ที่เป็นอันตราย คำแนะนำที่ไม่ปลอดภัย prompt injection ข้อมูลรั่วไหล หรือโมเดลใช้งานไม่ได้ ต้องมีเส้นทางควบคุม owner กฎระดับความรุนแรง และการทบทวนหลังเหตุการณ์
    rationale:
      en: AI failures may not appear as conventional system errors.
      th: ความล้มเหลวของ AI อาจไม่ปรากฏเป็น error ในระบบแบบเดิม
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-AI]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: AI incident response procedure with severity rules
        max_age_days: 365
      - type: report
        description: Post-incident review with corrective actions
        max_age_days: 365
    assessment:
      lite:
        pass: AI incidents have a containment path, owner, and severity rule.
        partial: A procedure exists but containment or ownership is unclear.
      full:
        l2: Incidents are contained and reviewed with corrective actions.
        l3: Corrective actions are tracked to closure and feed evaluation.
    references:
      - title: NIST AI RMF 1.0
        url: https://www.nist.gov/itl/ai-risk-management-framework
        type: standard
      - title: OWASP Top 10 for LLM Applications
        url: https://owasp.org/www-project-top-10-for-large-language-model-applications/
        type: guidance
    tags: [ai-incident, incident-response, containment]
