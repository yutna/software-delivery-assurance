  - id: SRAS-AI-012
    version: 0.1.0
    module: SRAS-AI
    title:
      en: AI claims are limited to evaluated evidence
      th: คำกล่าวอ้างเกี่ยวกับ AI จำกัดอยู่ที่หลักฐานที่ประเมินแล้ว
    description:
      en: A public or customer-facing claim about AI accuracy, safety, fairness, or compliance must be traceable to a current evaluation result and must state the known limitations. A claim that exceeds the recorded evidence must not be published. Users must be told when they interact with an AI capability or when a decision is materially AI-assisted.
      th: คำกล่าวอ้างต่อสาธารณะหรือต่อลูกค้าเกี่ยวกับความแม่นยำ ความปลอดภัย ความเป็นธรรม หรือ compliance ของ AI ต้องอ้างอิงผล evaluation ที่เป็นปัจจุบัน และต้องระบุข้อจำกัดที่ทราบ คำกล่าวอ้างที่เกินกว่าหลักฐานที่บันทึกไว้ต้องไม่ถูกเผยแพร่ ผู้ใช้ต้องได้รับแจ้งเมื่อมีปฏิสัมพันธ์กับ AI หรือเมื่อการตัดสินใจได้รับความช่วยเหลือจาก AI อย่างมีนัยสำคัญ
    rationale:
      en: A claim beyond the evidence creates expectations the product cannot prove.
      th: คำกล่าวอ้างที่เกินหลักฐานสร้างความคาดหวังที่ผลิตภัณฑ์พิสูจน์ไม่ได้
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-AI]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: Claim register linked to current evaluation evidence
        max_age_days: 180
      - type: report
        description: Current evaluation report supporting published claims
        max_age_days: 180
    assessment:
      lite:
        pass: Every AI claim is traceable to current evidence and stated limits.
        partial: Claims are recorded but evidence or limitations are incomplete.
      full:
        l2: Claims, evidence, and limitations are reviewed for the release.
        l3: Published claims are rechecked when evaluation or drift changes.
    references:
      - title: NIST AI RMF 1.0
        url: https://www.nist.gov/itl/ai-risk-management-framework
        type: standard
      - title: ISO/IEC 42001:2023
        url: https://www.iso.org/standard/81230.html
        type: standard
    tags: [claims, transparency, evidence]
