  - id: SRAS-AI-011
    version: 0.1.0
    module: SRAS-AI
    title:
      en: Third-party models and model licences are assessed
      th: โมเดลและ licence ของบุคคลที่สามถูกประเมิน
    description:
      en: A third-party model, API, or training dataset must have a recorded licence, permitted use, data-handling terms, change-notification terms, and an exit path. A dependency without licence clarity must not be released.
      th: โมเดล API หรือชุดข้อมูลของบุคคลที่สามต้องมี licence การใช้ที่ได้รับอนุญาต ข้อกำหนดการจัดการข้อมูล ข้อกำหนดการแจ้งเปลี่ยนแปลง และเส้นทางออกที่บันทึกไว้ dependency ที่ licence ไม่ชัดเจนต้องไม่ถูก release
    rationale:
      en: Licence limits and supplier changes affect the product directly.
      th: ข้อจำกัดของ licence และการเปลี่ยนแปลงจากผู้ให้บริการส่งผลต่อผลิตภัณฑ์โดยตรง
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-AI]
      overlays: []
      excludes: []
    evidence:
      - type: contract
        description: Model or dataset licence and data-handling terms
        max_age_days: 365
      - type: document
        description: Supplier change-notification and exit plan
        max_age_days: 365
    assessment:
      lite:
        pass: The licence and permitted use are recorded for each dependency.
        partial: A licence is recorded but data terms or exit path is missing.
      full:
        l2: Licence, data terms, change notice, and exit path are recorded.
        l3: Supplier changes are tracked and trigger a product review.
    references:
      - title: ISO/IEC 42001:2023
        url: https://www.iso.org/standard/81230.html
        type: standard
      - title: NIST AI RMF 1.0
        url: https://www.nist.gov/itl/ai-risk-management-framework
        type: standard
    tags: [third-party, licence, ai-supplier]
    status: active
    introduced_in: 0.1.0
