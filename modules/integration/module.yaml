  - id: SRAS-INT-009
    version: 0.1.0
    module: SRAS-INT
    title:
      en: Partners are onboarded with due diligence and a test path
      th: Partner ถูก onboard พร้อม due diligence และเส้นทางทดสอบ
    description:
      en: A partner integration must record due diligence, agreed data use, credentials issued to the partner, a sandbox or test path, support contacts, and the responsibilities of each side before production access is granted.
      th: integration กับ partner ต้องบันทึก due diligence การใช้ข้อมูลที่ตกลง ข้อมูลรับรองที่ออกให้ partner sandbox หรือเส้นทางทดสอบ ช่องทางติดต่อสนับสนุน และความรับผิดชอบของแต่ละฝ่าย ก่อนอนุญาตให้เข้าถึง production
    rationale:
      en: Production access granted before responsibilities are agreed leaves failures unowned.
      th: การให้สิทธิ์ production ก่อนตกลงความรับผิดชอบทำให้ความล้มเหลวไม่มีผู้รับผิดชอบ
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: [SRAS-INT]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: Partner onboarding record with responsibilities and contacts
        max_age_days: 365
      - type: ticket
        description: Production access approval for the partner
        max_age_days: 365
    assessment:
      lite:
        pass: Onboarding, data use, and contacts are recorded before access.
        partial: Access was granted but responsibilities or test evidence is incomplete.
      full:
        l2: Due diligence, responsibilities, and a test path are recorded.
        l3: Partner access and data use are reviewed periodically.
    references:
      - title: ISO/IEC 27001:2022
        url: https://www.iso.org/standard/27001
        type: standard
      - title: OWASP ASVS
        url: https://owasp.org/www-project-application-security-verification-standard/
        type: standard
    tags: [partner-onboarding, due-diligence, access]
    status: active
    introduced_in: 0.1.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
