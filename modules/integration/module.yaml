  - id: SRAS-INT-006
    version: 0.1.0
    module: SRAS-INT
    title:
      en: API contracts are versioned and compatibility is stated
      th: สัญญา API ถูก version และระบุความเข้ากันได้
    description:
      en: Every partner-facing API must have a published machine-readable contract and an explicit version. A breaking change requires a new version and a migration path; an additive change must be reviewed against the compatibility policy.
      th: API สำหรับ partner ทุกรายการต้องมี contract ที่อ่านได้ด้วยเครื่องและเผยแพร่แล้ว พร้อม version ที่ชัดเจน การเปลี่ยนแปลงที่ทำลายความเข้ากันได้ต้องมี version ใหม่และเส้นทาง migration ส่วนการเปลี่ยนแปลงแบบเพิ่มเติมต้องถูกทบทวนเทียบกับนโยบายความเข้ากันได้
    rationale:
      en: A contract that changes silently breaks consumers without warning.
      th: contract ที่เปลี่ยนโดยไม่แจ้งทำให้ผู้ใช้บริการเสียหายโดยไม่มีการเตือน
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: [SRAS-INT]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: Published API contract with version and compatibility policy
        max_age_days: 180
      - type: ticket
        description: Compatibility review for the current release
        max_age_days: 180
    assessment:
      lite:
        pass: A versioned contract is published and matches production.
        partial: A contract exists but versioning or compatibility policy is incomplete.
      full:
        l2: Contract, version, and compatibility review are current.
        l3: Contract differences are checked automatically before release.
    references:
      - title: OpenAPI Specification
        url: https://spec.openapis.org/oas/latest.html
        type: standard
      - title: IETF RFC 9110 HTTP Semantics
        url: https://www.rfc-editor.org/rfc/rfc9110.html
        type: standard
    tags: [api-contract, versioning, compatibility]
    status: active
    introduced_in: 0.1.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: unverified
    created_at: "2026-10-27"
    updated_at: "2026-10-27"

  - id: SRAS-INT-007
    version: 0.1.0
    module: SRAS-INT
    title:
      en: API errors are safe, stable, and actionable
      th: Error ของ API ปลอดภัย คงที่ และนำไปใช้ได้
    description:
      en: An API error must return a stable code, a safe message, and a correlation identifier, and must not expose stack traces, internal hostnames, credentials, or another consumer's data. Documented error codes must match the published contract.
      th: Error ของ API ต้องคืน code ที่คงที่ ข้อความที่ปลอดภัย และ correlation identifier และต้องไม่เปิดเผย stack trace hostname ภายใน ข้อมูลรับรอง หรือข้อมูลของผู้ใช้บริการรายอื่น code ของ error ที่จัดทำเอกสารต้องตรงกับ contract ที่เผยแพร่
    rationale:
      en: Verbose errors leak system detail and leave consumers unable to handle failures deterministically.
      th: error ที่ละเอียดเกินไปรั่วไหลรายละเอียดระบบ และทำให้ผู้ใช้บริการจัดการความล้มเหลวได้ไม่แน่นอน
    criticality: medium
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-INT]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: Error code catalogue and safe error format
        max_age_days: 365
      - type: test_result
        description: Negative tests for error content and correlation identifiers
        max_age_days: 180
    assessment:
      lite:
        pass: Errors use stable codes and do not expose internal detail.
        partial: Errors are safe but codes or documentation are inconsistent.
      full:
        l2: Error behaviour is documented, tested, and matches the contract.
        l3: Error rates and codes are reviewed for consumer impact.
    references:
      - title: IETF RFC 9457 Problem Details for HTTP APIs
        url: https://www.rfc-editor.org/rfc/rfc9457.html
        type: standard
      - title: OWASP ASVS
        url: https://owasp.org/www-project-application-security-verification-standard/
        type: standard
    tags: [error-handling, api-contract, information-disclosure]
    status: active
    introduced_in: 0.1.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
    review_status: unverified
    created_at: "2026-10-27"
    updated_at: "2026-10-27"

  - id: SRAS-INT-008
    version: 0.1.0
    module: SRAS-INT
    title:
      en: Integration traffic is observable end to end
      th: ทราฟฟิกของ integration ถูกสังเกตได้ตลอดเส้นทาง
    description:
      en: Requests must be traceable across the integration path with a correlation identifier, latency and error metrics, and logs that exclude secrets and sensitive payloads. A defined alert must fire when error or latency thresholds are breached.
      th: request ต้องถูกติดตามได้ตลอดเส้นทาง integration ด้วย correlation identifier metric ของ latency และ error และ log ที่ไม่รวม secret หรือ payload ที่ละเอียดอ่อน ต้องมี alert ที่กำหนดไว้เมื่อ error หรือ latency เกินเกณฑ์
    rationale:
      en: Without a shared identifier, a failing integration cannot be attributed to a hop or a consumer.
      th: หากไม่มี identifier ที่ใช้ร่วมกัน integration ที่ล้มเหลวไม่สามารถระบุจุดที่ผิดหรือผู้ใช้บริการได้
    criticality: high
    applicability:
      tiers: [2, 3]
      modules: [SRAS-INT]
      overlays: []
      excludes: []
    evidence:
      - type: metric
        description: Integration latency, error, and saturation metrics
        max_age_days: 30
      - type: configuration
        description: Logging, tracing, and alerting configuration
        max_age_days: 180
    assessment:
      lite:
        pass: Requests carry a correlation identifier and errors are alerted.
        partial: Metrics exist but tracing or alerting is incomplete.
      full:
        l2: Tracing, metrics, logs, and alerts cover the integration path.
        l3: Alerts are tuned and reviewed against real incidents.
    references:
      - title: OWASP ASVS
        url: https://owasp.org/www-project-application-security-verification-standard/
        type: standard
      - title: NIST CSF 2.0
        url: https://www.nist.gov/cyberframework
        type: standard
    tags: [observability, tracing, alerting]
    status: active
    introduced_in: 0.1.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
