  - id: SRAS-INT-010
    version: 0.1.0
    module: SRAS-INT
    title:
      en: API versions are deprecated with notice and a migration path
      th: API version ถูก deprecate พร้อมแจ้งล่วงหน้าและเส้นทาง migration
    description:
      en: A deprecated API version must have a published sunset date, a notice period defined in the contract, a documented migration path, and usage monitoring. A version must not be withdrawn while an active consumer has no reviewed migration plan.
      th: API version ที่ถูก deprecate ต้องมีวัน sunset ที่เผยแพร่ ระยะเวลาแจ้งล่วงหน้าที่กำหนดใน contract เส้นทาง migration ที่จัดทำเอกสาร และการ monitor การใช้งาน ต้องไม่ถอน version ขณะที่ผู้ใช้บริการที่ยังใช้งานอยู่ไม่มีแผน migration ที่ทบทวนแล้ว
    rationale:
      en: An unannounced removal breaks consumers and turns a planned change into an incident.
      th: การถอนโดยไม่แจ้งทำให้ผู้ใช้บริการเสียหายและเปลี่ยนการเปลี่ยนแปลงที่วางแผนไว้เป็นเหตุการณ์ผิดปกติ
    criticality: medium
    applicability:
      tiers: [2, 3]
      modules: [SRAS-INT]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: Deprecation policy, sunset date, and migration path
        max_age_days: 365
      - type: metric
        description: Active usage of the deprecated version
        max_age_days: 30
    assessment:
      lite:
        pass: The sunset date and notice period are published.
        partial: A deprecation exists but notice or migration evidence is incomplete.
      full:
        l2: Notice, migration, and usage monitoring are in place.
        l3: Withdrawal is blocked until every active consumer has a reviewed plan.
    references:
      - title: IETF RFC 8594 Sunset HTTP Header
        url: https://www.rfc-editor.org/rfc/rfc8594.html
        type: standard
      - title: OpenAPI Specification
        url: https://spec.openapis.org/oas/latest.html
        type: standard
