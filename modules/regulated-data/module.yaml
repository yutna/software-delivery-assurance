    updated_at: "2026-10-27"

  - id: SRAS-RGD-009
    version: 0.1.0
    module: SRAS-RGD
    title:
      en: Sensitive data is minimised and access-controlled
      th: ข้อมูลอ่อนไหวถูกจำกัดและควบคุมการเข้าถึง
    description:
      en: Sensitive data must be collected only when necessary, masked or tokenised where the purpose allows, encrypted at rest and in transit, and restricted to named roles with recorded access. Access must be reviewed on a defined cadence.
      th: ข้อมูลอ่อนไหวต้องถูกเก็บเมื่อจำเป็นเท่านั้น ปกปิดหรือแทนที่ด้วย token เมื่อวัตถุประสงค์อนุญาต เข้ารหัสทั้งขณะจัดเก็บและระหว่างส่ง และจำกัดให้เฉพาะ role ที่ระบุพร้อมบันทึกการเข้าถึง ต้องทบทวนสิทธิการเข้าถึงตามรอบที่กำหนด
    rationale:
      en: Sensitive data exposed to every role turns one compromised account into a reportable event.
      th: ข้อมูลอ่อนไหวที่ทุก role เข้าถึงได้ทำให้บัญชีที่ถูกยึดหนึ่งบัญชีกลายเป็นเหตุการณ์ที่ต้องรายงาน
    criticality: gate
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-RGD]
      overlays: []
      excludes: []
    evidence:
      - type: configuration
        description: Encryption, masking, and role-based access configuration
        max_age_days: 180
      - type: log
        description: Sensitive data access records and review
        max_age_days: 90
    assessment:
      lite:
        pass: Sensitive data is minimised and restricted to named roles.
        partial: Controls exist but masking or access review is incomplete.
      full:
        l2: Minimisation, encryption, and access review are operating.
        l3: Access is reviewed with evidence and exceptions are approved.
    references:
      - title: ISO/IEC 27001:2022
        url: https://www.iso.org/standard/27001
        type: standard
      - title: ISO/IEC 27018:2019
        url: https://www.iso.org/standard/76559.html
        type: standard
    tags: [sensitive-data, access-control, encryption]
    status: active
