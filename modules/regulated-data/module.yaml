  - id: SRAS-RGD-010
    version: 0.1.0
    module: SRAS-RGD
    title:
      en: Records of processing are current and reviewable
      th: บันทึกกิจกรรมการประมวลผลเป็นปัจจุบันและตรวจทานได้
    description:
      en: A record of processing activities must describe each purpose, data category, data subject category, recipient, transfer, retention rule, and security measure, and must be reviewed when the processing changes.
      th: บันทึกกิจกรรมการประมวลผลต้องอธิบายวัตถุประสงค์ ประเภทข้อมูล ประเภทเจ้าของข้อมูล ผู้รับข้อมูล การโอน กฎการเก็บรักษา และมาตรการความปลอดภัยของแต่ละรายการ และต้องถูกทบทวนเมื่อการประมวลผลเปลี่ยน
    rationale:
      en: A record assembled only for an audit is usually incomplete.
      th: บันทึกที่รวบรวมเฉพาะเมื่อมีการตรวจสอบมักไม่ครบถ้วน
    criticality: medium
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-RGD]
      overlays: []
      excludes: []
    evidence:
      - type: document
        description: Record of processing activities with owners
        max_age_days: 180
      - type: ticket
        description: Review record after a processing change
        max_age_days: 180
    assessment:
      lite:
        pass: The record covers every processing purpose and is current.
        partial: A record exists but recipients or transfers are incomplete.
      full:
        l2: The record is current and reviewed after material change.
        l3: The record is reconciled with the data inventory and contracts.
    references:
      - title: ISO/IEC 27701:2019
        url: https://www.iso.org/standard/71670.html
        type: standard
      - title: NIST Privacy Framework 1.0
        url: https://www.nist.gov/privacy-framework
        type: standard
