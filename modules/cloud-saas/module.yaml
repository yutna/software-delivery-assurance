    updated_at: "2026-10-27"

  - id: SRAS-CLD-008
    version: 0.1.0
    module: SRAS-CLD
    title:
      en: Cloud audit logs are complete, protected, and retained
      th: Audit log ของ cloud ครบถ้วน ป้องกันการแก้ไข และถูกเก็บรักษา
    description:
      en: Administrative, authentication, and data-access events must be logged with actor, time, source, and target, protected from modification by the logged account, and retained for the defined period. A log that can be edited by the actor it records is not trustworthy.
      th: เหตุการณ์ด้าน administration authentication และการเข้าถึงข้อมูลต้องถูกบันทึกพร้อม actor เวลา แหล่งที่มา และเป้าหมาย ป้องกันการแก้ไขโดยบัญชีที่ถูกบันทึก และเก็บรักษาตามระยะเวลาที่กำหนด log ที่ผู้ถูกบันทึกสามารถแก้ไขได้ไม่น่าเชื่อถือ
    rationale:
      en: An editable audit trail cannot support an investigation or a dispute.
      th: audit trail ที่แก้ไขได้ไม่สามารถสนับสนุนการสืบสวนหรือข้อโต้แย้งได้
    criticality: high
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-CLD]
      overlays: []
      excludes: []
    evidence:
      - type: configuration
        description: Audit log destination, immutability, and retention configuration
        max_age_days: 180
      - type: log
        description: Sample audit events with actor, time, source, and target
        max_age_days: 90
    assessment:
      lite:
        pass: Audit events are logged, protected, and retained.
        partial: Logging exists but immutability or retention is incomplete.
      full:
        l2: Logs are immutable, retained, and reviewed for coverage.
        l3: Log coverage is tested against the event catalogue.
    references:
      - title: ISO/IEC 27017:2015
        url: https://www.iso.org/standard/43757.html
        type: standard
      - title: NIST SP 800-144
        url: https://csrc.nist.gov/pubs/sp/800/144/final
        type: standard
    tags: [logging, audit-trail, retention]
    status: active
    introduced_in: 0.1.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
