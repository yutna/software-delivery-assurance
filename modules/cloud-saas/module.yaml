  - id: SRAS-CLD-010
    version: 0.1.0
    module: SRAS-CLD
    title:
      en: Cloud availability and service limits are designed and tested
      th: Availability และ service limit ของ cloud ถูกออกแบบและทดสอบ
    description:
      en: The product must record its dependence on cloud regions, zones, and service quotas, and must test that a zone or quota failure does not exceed the approved service objective. A dependency with no tested fallback is a single point of failure.
      th: ผลิตภัณฑ์ต้องบันทึกการพึ่งพา region zone และ quota ของบริการ cloud และต้องทดสอบว่าความล้มเหลวของ zone หรือ quota ไม่เกิน service objective ที่อนุมัติ dependency ที่ไม่มี fallback ที่ทดสอบแล้วถือเป็น single point of failure
    rationale:
      en: Cloud redundancy is not automatic; it exists only where it is designed and tested.
      th: ความซ้ำซ้อนของ cloud ไม่ได้เกิดขึ้นเอง แต่มีเฉพาะจุดที่ถูกออกแบบและทดสอบแล้ว
    criticality: medium
    applicability:
      tiers: [2, 3]
      modules: [SRAS-CLD]
