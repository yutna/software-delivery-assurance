    assessment:
      lite:
        pass: Dependencies and fallbacks are documented and tested.
        partial: Dependencies are documented but failover is untested.
      full:
        l2: Failover and quota limits are tested against the service objective.
        l3: Tests are repeated after architecture or provider change.
