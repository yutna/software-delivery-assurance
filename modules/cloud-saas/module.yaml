  - id: SRAS-CLD-009
    version: 0.1.0
    module: SRAS-CLD
    title:
      en: Cloud identities and encryption keys are controlled
      th: Identity และ encryption key ของ cloud ถูกควบคุม
    description:
      en: Privileged cloud identities must use strong authentication, least privilege, and a reviewed access list. Encryption keys must have a named custodian, a rotation rule, and a documented recovery and revocation path.
      th: identity ของ cloud ที่มีสิทธิ์สูงต้องใช้การยืนยันตัวตนที่แข็งแรง หลักการสิทธิ์น้อยที่สุด และรายการสิทธิ์การเข้าถึงที่ทบทวนแล้ว encryption key ต้องมีผู้ดูแลที่ระบุชื่อ กฎการหมุน และเส้นทาง recovery และ revocation ที่จัดทำเอกสาร
    rationale:
      en: A privileged identity or an unmanaged key bypasses every other control.
      th: identity ที่มีสิทธิ์สูงหรือ key ที่ไม่มีการจัดการสามารถข้ามการควบคุมอื่นทั้งหมดได้
    criticality: gate
    applicability:
      tiers: [1, 2, 3]
      modules: [SRAS-CLD]
      overlays: []
      excludes: []
    evidence:
      - type: configuration
        description: Privileged identity, key rotation, and revocation configuration
        max_age_days: 180
      - type: log
        description: Privileged access review and key rotation records
        max_age_days: 90
    assessment:
      lite:
        pass: Privileged access and keys have owners and rotation rules.
        partial: Controls exist but review or recovery is undocumented.
      full:
        l2: Access is reviewed and keys are rotated and recoverable.
        l3: Access and key events are monitored and anomalies are investigated.
    references:
      - title: ISO/IEC 27017:2015
        url: https://www.iso.org/standard/43757.html
        type: standard
      - title: ISO/IEC 27001:2022
        url: https://www.iso.org/standard/27001
        type: standard
    tags: [identity, key-management, least-privilege]
    status: active
    introduced_in: 0.1.0
    deprecated_in: null
    replaced_by: null
    translation_status: partial
    machine_translated: true
